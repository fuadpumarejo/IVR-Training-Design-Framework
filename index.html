    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #1B4C8C; z-index: 9999; }

<body>
  <div id="__bundler_thumbnail"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#1B4C8C"></rect><text x="50" y="62" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">VR</text></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>VR Training Design Framework — PPGDesign/UFPR<\u002Ftitle>\n<style>\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\nbody {\n  font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;\n  color: #171B22;\n  background: #FFFFFF;\n  line-height: 1.5;\n}\n.app { max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }\n#root { animation: fadeIn 0.25s ease; }\n@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n.header { text-align: center; margin-bottom: 2.75rem; }\n.header h1 { font-family: var(--serif); font-size: 34px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 8px; }\n.header { padding-bottom: 1.5rem; border-bottom: 1px solid #DBE0E7; }\n.header p { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: #1B4C8C; }\n\n.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }\n.home-card { background: #EEF1F5; border: 1px solid #DBE0E7; border-radius: 12px; padding: 1.1rem; }\n.home-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0.5rem 0 1.75rem; }\n.home-hero-ring { width: 340px; height: 340px; margin-bottom: 1.1rem; }\n.home-hero-line { font-family: var(--serif); font-size: 19px; line-height: 1.5; font-weight: 600; color: #171B22; max-width: 480px; margin: 0; }\n.home-guidelines { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }\n.gl-divider { height: 1px; background: #DBE0E7; margin: 6px 10px; }\n.gl-row { font-size: 12.5px; line-height: 1.5; color: #171B22; background: #fff; border: 1px solid #DBE0E7;\n  border-radius: 8px; padding: 9px 12px; display: block; width: 100%; text-align: left;\n  font-family: inherit; cursor: pointer; position: relative; transition: border-color .12s, background .12s; }\n.gl-row b { font-family: var(--serif); font-size: 13.5px; }\n.gl-row:hover { border-color: #1B4C8C; background: #EAF1FA; }\n.gl-row:hover .gl-more { opacity: 1; transform: translateX(2px); }\n.gl-row:focus-visible { outline: 2px solid #1B4C8C; outline-offset: 2px; }\n.gl-more { display: inline-block; font-size: 18px; font-weight: 700; color: #1B4C8C; float: right; opacity: .45; transition: opacity .12s, transform .12s; line-height: 1.3; }\n.gl-tag { display: inline-block; font-size: 10px; font-weight: 700; color: #1B4C8C; background: #DCE7F5;\n  padding: 2px 7px; border-radius: 99px; margin-right: 8px; }\n.gi-text { font-size: 13.5px; line-height: 1.65; color: #171B22; margin-bottom: 1.2rem; }\n.home-card .icon { font-size: 22px; color: #1B4C8C; display: block; margin-bottom: 8px; }\n.home-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }\n.home-card p { font-size: 12.5px; color: #58626F; }\n.home-note {\n  background: #FBEBD3; border: 1px solid #E3C48F; border-radius: 10px;\n  padding: 0.9rem 1.1rem; margin-bottom: 1.75rem; font-size: 12.5px; color: #7A4300;\n}\n.home-note strong { color: #7A4300; }\n\n.participant-panel {\n  background: #EEF1F5; border: 1px solid #DBE0E7; border-radius: 12px;\n  padding: 1.1rem 1.25rem; margin-bottom: 1.25rem;\n}\n.participant-panel h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }\n.participant-panel .p-sub { font-size: 11.5px; color: #727C8A; margin-bottom: 12px; }\n.p-field { margin-bottom: 10px; }\n.p-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }\n.p-field input, .p-field select {\n  width: 100%; padding: 8px 10px; border: 1px solid #C7CDD6; border-radius: 6px;\n  font-size: 13px; font-family: inherit; background: #fff;\n}\n.p-field input:focus, .p-field select:focus { outline: none; border-color: #1B4C8C; }\n.p-optional { font-weight: 400; color: #727C8A; font-size: 11px; }\n\n.consent-note {\n  font-size: 11px; color: #727C8A; margin-top: 10px; line-height: 1.5;\n}\n\n.export-row { display: flex; gap: 8px; flex-wrap: wrap; }\n\n.filter-row { display: flex; gap: 8px; margin-bottom: 1.1rem; }\n.chip {\n  padding: 7px 14px; border-radius: 99px; font-size: 12.5px; cursor: pointer;\n  border: 1px solid #C7CDD6; background: #fff; color: #58626F; font-family: inherit;\n}\n.chip:hover { border-color: #8891A0; }\n.chip.active { background: #1B4C8C; color: #fff; border-color: transparent; }\n.home-cta { text-align: center; }\n.home-sub { font-size: 12px; color: #727C8A; margin-top: 8px; }\n\n.btn { padding: 10px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid #B7BFCA; background: transparent; color: #171B22; font-family: inherit; }\n.btn:hover { background: #F3F5F8; }\n.btn-primary { background: #1B4C8C; color: #fff; border-color: transparent; }\n.btn-primary:hover { background: #123765; }\n\n.progress-label { font-size: 12px; color: #727C8A; text-align: right; margin-bottom: 6px; }\n.progress-bar { background: #E4E9EF; border-radius: 99px; height: 5px; margin-bottom: 1.75rem; overflow: hidden; }\n.progress-fill { height: 100%; background: #1B4C8C; border-radius: 99px; transition: width .35s ease; }\n.step-title { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 6px; }\n.step-sub { font-size: 14px; color: #58626F; margin-bottom: 2rem; }\n\n.field { background: #EEF1F5; border: 1px solid #DBE0E7; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }\n.field.diagnostic { background: #FBEBD3; border-color: #E3C48F; }\n.field-label { font-size: 13px; font-weight: 700; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }\n.field-tag {\n  font-size: 9.5px; font-weight: 700; color: #7A4300; background: #FBEBD3;\n  padding: 2px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .3px;\n}\n.field-tag-guideline {\n  font-size: 9.5px; font-weight: 700; color: #1B4C8C; background: #DCE7F5;\n  padding: 2px 7px; border-radius: 99px; letter-spacing: .3px; margin-right: 6px;\n}\n.field-hint { font-size: 12px; color: #727C8A; margin-bottom: 12px; }\n.field-evidence { font-size: 12px; color: #8A6A2E; font-style: italic; margin-bottom: 12px; }\n.inline-effort-hint {\n  font-size: 12px; line-height: 1.55; color: #333B47; background: #F3F5F8;\n  border: 1px solid #DBE0E7; border-radius: 8px; padding: 9px 12px; margin: -6px 0 16px;\n}\n.inline-effort-hint .eff-chip { margin-right: 8px; vertical-align: 1px; }\n.options { display: grid; gap: 8px; }\n.opt { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1px solid #DBE0E7; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color .15s; }\n.opt:hover { border-color: #8891A0; }\n.opt.selected { border-color: #1B4C8C; background: #DCE7F5; }\n.opt input { margin-top: 2px; accent-color: #1B4C8C; flex-shrink: 0; }\n.opt-name { font-size: 13px; font-weight: 700; }\n.opt-desc { font-size: 11.5px; color: #58626F; margin-top: 1px; }\n.opt.selected .opt-name { color: #1B4C8C; }\n\n.err { font-size: 13px; font-weight: 600; color: #9A2020; background: #FBE1DF; border: 1px solid #E3A2A0; border-radius: 8px; padding: 9px 12px; margin: 4px 0 12px; }\n.field.field-error .options { outline: 2px solid #9A2020; outline-offset: 4px; border-radius: 8px; }\n\n.nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }\n.step-dots { display: flex; gap: 6px; }\n.dot {\n  width: 8px; height: 8px; border-radius: 50%; background: #B7BFCA;\n  display: inline-block; border: none; padding: 0; cursor: pointer;\n  transition: background .15s, width .2s;\n}\n.dot:hover { background: #727C8A; }\n.dot:focus-visible { outline: 2px solid #1B4C8C; outline-offset: 2px; }\n.dot.active { background: #1B4C8C; width: 20px; border-radius: 99px; }\n.dot-flagged:not(.active) { background: #E3A2A0; }\n\n.view-row { margin-bottom: 1.4rem; }\n.guided-panel { max-width: 100%; }\n.guided-progress { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }\n.guided-count { font-size: 12px; color: #727C8A; font-weight: 700; }\n.guided-nav { display: flex; justify-content: space-between; margin-top: 14px; }\n.guided-empty { font-size: 13px; color: #727C8A; padding: 1rem 0; }\n\n/* ── Dashboard grid ── */\n.gd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }\n@media (max-width: 900px) { .gd-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 520px) { .gd-grid { grid-template-columns: 1fr; } }\n.gd-tile {\n  text-align: left; border-radius: 12px; padding: .95rem 1rem; cursor: pointer;\n  font-family: inherit; border: 1px solid; transition: transform .12s, box-shadow .12s;\n  display: flex; flex-direction: column; gap: 7px; min-height: 128px;\n}\n.gd-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.08); }\n.gd-tile:focus-visible { outline: 2px solid #1B4C8C; outline-offset: 2px; }\n.gd-tile.crit { background: #FBE1DF; border-color: #E3A2A0; }\n.gd-tile.mod  { background: #FBEBD3; border-color: #E3C48F; }\n.gd-tile.ok   { background: #E1F0E3; border-color: #AED9BA; }\n.gd-tile-top { display: flex; align-items: center; gap: 8px; }\n.gd-tile-icon { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n.gd-tile-id { font-size: 11px; font-weight: 700; color: #58626F; letter-spacing: .3px; }\n.gd-tile-sev { margin-left: auto; font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .3px; }\n.gd-tile.crit .gd-tile-sev { background: #C7302E; color: #fff; }\n.gd-tile.mod .gd-tile-sev { background: #B5791A; color: #fff; }\n.gd-tile.ok .gd-tile-sev { background: #2E8B4E; color: #fff; }\n.gd-tile-name { font-family: var(--serif); font-size: 15px; font-weight: 700; color: #171B22; line-height: 1.3; }\n.gd-tile-snippet { font-size: 11.5px; color: #58626F; line-height: 1.4; flex-grow: 1; }\n.gd-tile-bar { height: 5px; background: rgba(0,0,0,.08); border-radius: 99px; margin-top: auto; overflow: hidden; }\n.gd-tile-bar-fill { display: block; height: 100%; border-radius: 99px; }\n.gd-tile-bar-fill.crit { background: #C7302E; }\n.gd-tile-bar-fill.mod { background: #B5791A; }\n.gd-tile-bar-fill.ok { background: #2E8B4E; }\n\n.gd-hero {\n  display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer;\n  border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 14px; border: 1px solid;\n  transition: transform .12s, box-shadow .12s;\n}\n.gd-hero:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }\n.gd-hero:focus-visible { outline: 2px solid #1B4C8C; outline-offset: 2px; }\n.gd-hero.crit { background: linear-gradient(135deg, #FBE1DF, #FBE1DF); border-color: #E3A2A0; }\n.gd-hero.mod  { background: linear-gradient(135deg, #FBEBD3, #FBEBD3); border-color: #E3C48F; }\n.gd-hero-kicker {\n  display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .5px;\n  text-transform: uppercase; color: #7A4444; margin-bottom: 10px;\n}\n.gd-hero-top { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }\n.gd-hero-icon { width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n.gd-hero-icon svg { width: 24px; height: 24px; }\n.gd-hero-name { font-family: var(--serif); font-size: 25px; font-weight: 700; color: #171B22; margin-top: 3px; }\n.gd-hero-snippet { font-size: 13.5px; color: #333B47; line-height: 1.5; margin-bottom: 14px; }\n.gd-legend { display: flex; gap: 16px; align-items: center; margin: 4px 0 1.1rem; font-size: 11.5px; color: #58626F; flex-wrap: wrap; }\n.gd-legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }\n\n\n\n\n\n\n/* ── Worksheet call-to-action on each card ── */\n.ws-open {\n  display: flex; align-items: center; gap: 11px; width: 100%;\n  background: #EAF1FA; border: 1px solid #9DB8DA; border-radius: 9px;\n  padding: 11px 13px; margin: 10px 0; cursor: pointer;\n  font-family: inherit; font-size: 12.5px; color: #171B22; text-align: left;\n  line-height: 1.45; transition: border-color .15s, background .15s;\n}\n.ws-open:hover { background: #DCE7F5; border-color: #9DB8DA; }\n.ws-open:focus-visible { outline: 2px solid #1B4C8C; outline-offset: 1px; }\n.ws-open-icon { font-size: 17px; color: #1B4C8C; flex-shrink: 0; }\n.ws-open strong { color: #0F2E52; }\n.ws-open-sub { font-size: 11.5px; color: #58626F; }\n.ws-open-arrow { margin-left: auto; color: #1B4C8C; font-size: 15px; flex-shrink: 0; }\n\n/* ── Worksheet modal ── */\n.ws-backdrop {\n  position: fixed; inset: 0; background: rgba(26,26,26,.55);\n  display: flex; align-items: center; justify-content: center;\n  padding: 1.5rem 1rem; z-index: 100; animation: fadeIn .16s ease;\n}\n.ws-modal {\n  background: #fff; border-radius: 14px; width: 100%; max-width: 940px;\n  max-height: 90vh; display: flex; flex-direction: column;\n  box-shadow: 0 14px 44px rgba(0,0,0,.25);\n}\n.ws-head {\n  display: flex; align-items: flex-start; gap: 12px;\n  padding: 1.15rem 1.4rem 0.9rem; border-bottom: 1px solid #E1E5EB;\n}\n.ws-eyebrow { font-size: 11px; font-weight: 700; color: #1B4C8C; letter-spacing: .3px; margin-bottom: 3px; }\n.ws-head h2 { font-family: var(--serif); font-size: 23px; font-weight: 700; margin: 0; }\n.ws-back {\n  background: transparent; border: 1px solid #C7CDD6; border-radius: 7px; font-size: 12px;\n  color: #1B4C8C; font-weight: 700; cursor: pointer; padding: 6px 11px; font-family: inherit;\n  flex-shrink: 0; margin-top: 1px;\n}\n.ws-back:hover { background: #EAF1FA; border-color: #1B4C8C; }\n.ws-back:focus-visible { outline: 2px solid #1B4C8C; outline-offset: 2px; }\n.ws-close {\n  margin-left: auto; background: transparent; border: none; font-size: 26px;\n  line-height: 1; color: #727C8A; cursor: pointer; padding: 0 4px; font-family: inherit;\n}\n.ws-close:hover { color: #171B22; }\n.ws-close:focus-visible { outline: 2px solid #1B4C8C; outline-offset: 2px; border-radius: 4px; }\n.ws-body { padding: 1.1rem 1.4rem; overflow-y: auto; }\n.ws-produces, .ws-method { font-size: 12.5px; line-height: 1.55; margin-bottom: 6px; color: #333B47; }\n.ws-method { color: #58626F; font-size: 12px; margin-bottom: 1.4rem; }\n.ws-sub {\n  font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;\n  color: #1B4C8C; margin: 1.2rem 0 .55rem;\n}\n.ws-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }\n.ws-table th, .ws-table td {\n  border: 1px solid #DBE0E7; padding: 7px 9px; text-align: left;\n  vertical-align: top; line-height: 1.45;\n}\n.ws-table th { background: #EAF1FA; font-weight: 700; color: #0F2E52; }\n.ws-table tbody tr:nth-child(even) { background: #F3F5F8; }\n.ws-notes { margin: 0; padding-left: 1.15rem; }\n.ws-notes li { font-size: 12.5px; line-height: 1.6; margin-bottom: 7px; color: #333B47; }\n.ws-foot {\n  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;\n  padding: .95rem 1.4rem; border-top: 1px solid #E1E5EB; background: #F3F5F8;\n  border-radius: 0 0 14px 14px;\n}\n.ws-copy-ok { display: none; font-size: 11.5px; color: #1F6B3D; }\n\n@media (max-width: 640px) {\n  .ws-body { padding: 1rem; }\n  .ws-table { font-size: 10.5px; }\n  .ws-table th, .ws-table td { padding: 5px 6px; }\n}\n@media print {\n  .ws-backdrop { position: static; background: none; padding: 0; }\n  .ws-modal { max-height: none; box-shadow: none; }\n  .ws-close, .ws-foot { display: none; }\n}\n\n\n\n\n\n/* ── Shared disclosure panels inside the worksheet modal.\n   Two peer panels answering two distinct questions: where the guideline\n   came from, and what theory explains it. Both collapsed by default so the\n   worksheet itself stays the primary content. ── */\n.info-panel {\n  marg 08-16',\n  framework: 'G1–G8, derived from a systematic literature review',\n};\n\n// ── Cross-guideline dependencies (framework Figure 4).\n// Surfacing these turns a flat checklist into a sequenced design system:\n// fixing a prerequisite changes what its dependents should say.\n// Implementation effort vs. retention payoff, per guideline.\n// Added after Cycle 2 specialist feedback: practitioners weigh every guideline\n// against project budget, and the framework was silent on that trade-off.\n// \"effort\" = relative build cost; \"payoff\" = strength of the retention/transfer\n// case for paying it. The note names the specific condition that shifts it.\nconst EFFORT = {\n  G1: {effort:'low', payoff:'high', note:'Costs planning time, not build time — a few hours of writing objectives down before anything is modelled. The cheapest guideline here, and everything downstream depends on it.'},\n  G2: {effort:'low', payoff:'high', note:'A couple of interviews with people who do the task. Low cost, and it prevents the expensive failure of building a task flow that practitioners don\\u2019t recognise.'},\n  G3: {effort:'medium', payoff:'high', note:'Staging content costs authoring time, but it is mostly sequencing work you would do anyway — the cost is in planning the progression, not in extra assets.'},\n  G4: {effort:'varies', payoff:'varies', note:'This is where the trade-off is sharpest. If the skill is fine perceptual-motor work, gesture fidelity IS the training and hand tracking earns its cost. If the learner only needs to know which steps happen in what order, mapped controllers with a ready-made framework are far cheaper and lose little.'},\n  G5: {effort:'medium', payoff:'high', note:'A second feedback channel is usually cheap to add (audio over visual). The expensive part is structured debriefing content — but that is also where most of the retention gain sits.'},\n  G6: {effort:'low', payoff:'high', note:'Often cheaper than the alternative: correct behaviour with simpler assets costs less than photorealistic models that behave wrong. This guideline usually saves budget rather than spending it.'},\n  G7: {effort:'high', payoff:'varies', note:'Real-time difficulty adaptation is genuinely expensive to build and maintain. Strong for high-stakes or repeated-use training; hard to justify for a one-off induction module. A fixed, well-paced difficulty curve captures much of the benefit for far less.'},\n  G8: {effort:'medium', payoff:'high', note:'Cheap if planned alongside the build, expensive if retrofitted. The cost is almost entirely a function of when you decide to do it.'},\n};\n// G4 and G7 don't have one fixed cost — specialists in the Cycle 2 focus group\n// tied both directly to answers already collected elsewhere in the questionnaire.\n// This computes the real trade-off from the user's own data instead of a generic\n// \"it depends\" — same function powers the dashboard chip and the in-flow hint.\nfunction computeEffort(id, d){\n  if(id==='G4'){\n    if(d.skillType==='perceptual') return {effort:'high', payoff:'high', note:'Your training is perceptual-motor — gesture fidelity IS the skill being taught here, so hand tracking\\u2019s extra cost is worth paying.'};\n    if(d.skillType==='procedural'||d.skillType==='decision') return {effort:'low', payoff:'high', note:'Your training is procedural/decision-based, not fine motor work — mapped controllers with a ready-made framework capture most of the value for a fraction of hand tracking\\u2019s cost.'};\n    if(d.skillType==='mixed') return {effort:'medium', payoff:'high', note:'Your training mixes skill types — reserve gesture fidelity for the perceptual-motor parts of the task, and use simpler controls for the rest.'};\n    return EFFORT.G4;\n  }\n  if(id==='G7'){\n    if(d.complexity==='high') return {effort:'high', payoff:'high', note:'Your training has high cognitive complexity — real-time difficulty adaptation is expensive, but justified: static pacing is likelier to overload learners juggling this much at once.'};\n    if(d.complexity==='low') return {effort:'low', payoff:'varies', note:'Your training has low cognitive complexity — a single well-paced difficulty curve likely covers most of the benefit; full real-time personalization is probably more than this needs.'};\n    if(d.complexity==='medium') return {effort:'medium', payoff:'high', note:'Your training has moderate complexity — a few well-placed difficulty checkpoints, short of full real-time adaptation, usually hits the sweet spot.'};\n    return EFFORT.G7;\n  }\n  return EFFORT[id];\n}\n// One-line preview of computeEffort, shown inline right after the question that\n// drives it is answered — so the trade-off shows up while deciding, not only\n// at the end.\nfunction effortPreview(guidelineId, d){\n  const e = computeEffort(guidelineId, d);\n  if(!e) return '';\n  const labels = {low:'Low effort',medium:'Medium effort',high:'High effort',varies:'Effort varies'};\n  return `<div class=\"inline-effort-hint\"><span class=\"eff-chip eff-${e.effort}\">${labels[e.effort]}<\u002Fspan> for ${guidelineId} — ${e.note}<\u002Fdiv>`;\n}\n\nconst DEPENDS = {\n  G1: { requires: [],                     informs: ['G2','G3','G4','G5','G6','G7','G8'],\n        note: 'Framing conditions every other decision — settle this before the rest.' },\n  G2: { requires: ['G1'],                 informs: ['G4','G8'],\n        note: 'Task criteria become the reference for feedback design and for evidence.' },\n  G3: { requires: ['G1'],                 informs: ['G7','G8'],\n        note: 'Stage thresholds set the pacing that experiential targets are built around.' },\n  G4: { requires: ['G1','G2'],            informs: ['G5','G8'],\n        note: 'Interaction defines what a learner action is, before feedback can respond to it.' },\n  G5: { requires: ['G1','G2','G4'],       informs: ['G8'],\n        note: 'Feedback responds to task criteria (G2) through the interaction defined in G4.' },\n  G6: { requires: ['G1','G2'],            informs: ['G8'],\n        note: 'Functional realism gives the task its real consequences.' },\n  G7: { requires: ['G1','G3'],            informs: ['G8'],\n        note: 'Experiential targets are built on the progression designed in G3.' },\n  G8: { requires: ['G1','G2','G4','G5','G7'], informs: [],\n        note: 'Evaluation closes the loop: it can only be as good as the decisions above it.' },\n};\n\n// How the priority score is computed — stated openly so the ranking is\n// contestable rather than a black box.\nconst SCORING = {\n  formula: 'Priority = corpus gap prevalence ± context adjustment, constrained by dependency order',\n  detail: 'Each guideline starts at its gap prevalence across the corpus we reviewed (45–90). ' +\n          'If your answers match that gap, +12 (capped at 100). If they do not, the score drops ' +\n          'to a low band (10–45) that stays below every possible “review” score — so a ' +\n          'guideline flagged for you always outranks one that is not, regardless of how common ' +\n          'that gap is in the wider literature. One more rule sits above the raw number: if a ' +\n          'flagged guideline requires another flagged guideline to be settled first (see “Builds ' +\n          'on” in each card), that prerequisite inherits at least the same score — a foundational ' +\n          'guideline can never rank below something that depends on it. The score ranks attention ' +\n          'for your context; it is not a quality grade.',\n};\n\n// Scope and limitations of the evidence base, disclosed in the artifact itself\n// rather than only in the thesis.\nconst LIMITS = [\n  'Based on <strong>20 peer-reviewed studies<\u002Fstrong> (2020–2026) — not the whole literature. A different search could surface different gaps.',\n  'Coded by a <strong>single researcher<\u002Fstrong>. Every guideline is backed by a documented evidence trail rather than a second opinion.',\n  'These guidelines come from <strong>analysing published research<\u002Fstrong>, not yet from testing with practitioners in the field — that validation is the next phase.',\n];\n\n// ── DATA: 8 guidelines, corpus gap prevalence (from SAM, Cycle 1, n=20) ──\n// ── Icon set — one simple line-icon per guideline, matches accent color ──\n// The framework's visual signature: an 8-segment ring, one spoke per guideline.\n// Neutral on the home screen (a promise of what the diagnosis will reveal);\n// colored by real status on the results screen. Same shape, same identity,\n// two states — this is deliberately the tool's single most-crafted visual.\nfunction renderGuidelineRing(tierById, displaySize, opts){\n  opts = opts || {};\n  const ids = Object.keys(GUIDELINES);\n  const vb = 280; // fixed internal coordinate space, generous margin for markers + labels\n  const cx = vb/2, cy = vb/2;\n  const maxR = 82, labelR = 108;\n  const dist = {crit:0.32, mod:0.62, ok:1, neutral:0.85};\n  const colors = {crit:'#9A2020', mod:'#B5791A', ok:'#2E6B1F', neutral:'#8891A0'};\n  const anchors = ['middle','start','start','start','middle','end','end','end'];\n  const pt = (r, i) => { const rad = i*45*Math.PI/180; return [cx + r*Math.sin(rad), cy - r*Math.cos(rad)]; };\n\n  // Web: 8 spokes from center + one outer reference octagon\n  let web = '';\n  ids.forEach((_,i)=>{ const [x,y] = pt(maxR,i); web += `<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${x.toFixed(1)}\" y2=\"${y.toFixed(1)}\" class=\"ring-axis\"/>`; });\n  const octPts = ids.map((_,i)=>pt(maxR,i).map(n=>n.toFixed(1)).join(',')).join(' ');\n  web += `<polygon points=\"${octPts}\" class=\"ring-web\"/>`;\n\n  // Data polygon: vertex distance encodes status (further out = better)\n  const dataPts = ids.map((id,i)=>pt(maxR*dist[tierById?(tierById[id]||'neutral'):'neutral'], i));\n  const dataPath = dataPts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');\n  const overallTier = !tierById ? 'neutral' : (Object.values(tierById).some(t=>t==='crit') ? 'crit' : Object.values(tierById).some(t=>t==='mod') ? 'mod' : 'ok');\n\n  let markers = '', labels = '';\n  ids.forEach((id,i)=>{\n    const tier = tierById ? (tierById[id]||'neutral') : 'neutral';\n    const [dx,dy] = dataPts[i];\n    markers += `<circle id=\"ring-m-${id}\" cx=\"${dx.toFixed(1)}\" cy=\"${dy.toFixed(1)}\" r=\"7\" fill=\"${colors[tier]}\" stroke=\"var(--bg2,#fff)\" stroke-width=\"2\"${opts.clickable?` class=\"ring-spoke\" onclick=\"${opts.clickFn||'openGuidelineDetail'}('${id}')\" role=\"button\" tabindex=\"0\" aria-label=\"${id} — ${GUIDELINES[id].name}, ${tier==='crit'?'critical':tier==='mod'?'worth reviewing':tier==='ok'?'on track':'not yet diagnosed'}\"`:''}${opts.interactiveHint?` onmouseenter=\"ringHint('${id}')\" onmouseleave=\"ringUnhint('${id}')\" onfocus=\"ringHint('${id}')\" onblur=\"ringUnhint('${id}')\"`:''}/>`;\n    if(opts.labels!==false){\n      const [lx,ly] = pt(labelR,i);\n      labels += `<text x=\"${lx.toFixed(1)}\" y=\"${ly.toFixed(1)}\" text-anchor=\"${anchors[i]}\" dominant-baseline=\"middle\" class=\"ring-label\">${id}<\u002Ftext>`;\n    }\n  });\n\n  return `<svg viewBox=\"0 0 ${vb} ${vb}\" width=\"${displaySize}\" height=\"${displaySize}\" class=\"guideline-ring\" role=\"img\" aria-label=\"${opts.ariaLabel||'The eight guidelines, shown as a radar chart'}\">${web}<polygon points=\"${dataPath}\" fill=\"${colors[overallTier]}\" fill-opacity=\"0.16\" stroke=\"${colors[overallTier]}\" stroke-width=\"2\"/>${markers}${labels}${opts.centerText?`<text x=\"${cx}\" y=\"${cy}\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"ring-center\">${opts.centerText}<\u002Ftext>`:''}<\u002Fsvg>`;\n}\n\n// Paired with opts.interactiveHint on renderGuidelineRing — highlights a ring\n// marker and its matching row when either is hovered/focused. Currently unused\n// (no caller passes interactiveHint), kept ready in case that linking returns.\nfunction ringHint(id){\n  const m = document.getElementById('ring-m-'+id);\n  if(m){ m.setAttribute('fill','#1B4C8C'); m.setAttribute('r','10'); }\n  const cap = document.getElementById('home-ring-caption');\n  if(cap){ const g = GUIDELINES[id]; cap.innerHTML = `<span class=\"gl-tag\">${id}<\u002Fspan> <b>${g.name}<\u002Fb>`; }\n  const row = document.getElementById('gl-row-'+id);\n  if(row) row.classList.add('is-hint');\n}\nfunction ringUnhint(id){\n  const m = document.getElementById('ring-m-'+id);\n  if(m){ m.setAttribute('fill','#8891A0'); m.setAttribute('r','7'); }\n  const cap = document.getElementById('home-ring-caption');\n  if(cap) cap.innerHTML = 'Hover a point — or a guideline below — to preview it here.';\n  const row = document.getElementById('gl-row-'+id);\n  if(row) row.classList.remove('is-hint');\n}\n\nconst ICONS = {\n  G1: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"6\"/><line x1=\"12\" y1=\"18\" x2=\"12\" y2=\"21\"/><\u002Fsvg>',\n  G2: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6h16M4 12h16M4 18h10\"/><circle cx=\"20\" cy=\"18\" r=\"2\"/><\u002Fsvg>',\n  G3: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 20h4v-4H3v4zM10 20h4v-9h-4v9zM17 20h4V6h-4v14z\"/><\u002Fsvg>',\n  G4: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11.5V6a1.5 1.5 0 0 1 3 0v4M12 10V4.5a1.5 1.5 0 0 1 3 0V10M15 10.5V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6.5 7S4 19 4 15v-3.5a1.5 1.5 0 0 1 3 0\"/><\u002Fsvg>',\n  G5: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 15v-6M8 18v-12M12 20v-16M16 18v-12M20 15v-6\"/><\u002Fsvg>',\n  G6: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/><\u002Fsvg>',\n  G7: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5 2.3-7.2-6-4.6h7.6z\"/><\u002Fsvg>',\n  G8: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><path d=\"M9.5 10v2a2 2 0 0 0 2 2h2\"/><\u002Fsvg>',\n};\n\n// ── Concrete poor/good example pairs — makes abstract guidance tangible ──\nconst EXAMPLES = {\n  G1: { poor:'Start building the VR scene from a general idea like \"safety training\" — no written objective.',\n        good:'Written spec: \"Procedural training for novice technicians; success = correctly isolating power within 90 seconds.\"' },\n  G2: { poor:'Task steps copied from a manual, never checked with anyone who actually does the job.',\n        good:'Task steps walked through with two senior practitioners for 30 minutes before any 3D work begins.' },\n  G3: { poor:'One long session — same difficulty from the first minute to the last.',\n        good:'Practice \\u2192 Guided \\u2192 Independent \\u2192 Final Check, with a clear rule for moving between stages.' },\n  G4: { poor:'Press a button to \"turn the valve\" \\u2014 no relationship between the button and the real motion.',\n        good:'Grip and physically rotate the controller to turn the valve, just like the real one.' },\n  G5: { poor:'On-screen text only when something goes wrong, then nothing \\u2014 no other channel, no way to review afterward.',\n        good:'A visual, audio, and haptic cue together in the moment, plus a written summary the learner can reopen after the session.' },\n  G6: { poor:'A beautifully rendered valve \\u2014 but it turns freely with no resistance, unlike the real one.',\n        good:'A simple valve model that resists turning correctly and leaks if closed the wrong way.' },\n  G7: { poor:'Presence and engagement only ever asked about in a survey after the session ends.',\n        good:'Difficulty curve sketched out in advance; adjusted in real time if someone finishes too fast or slow.' },\n  G8: { poor:'A generic satisfaction survey, disconnected from what was actually being taught.',\n        good:'Each logged action ties back to a specific learning goal named at the start.' },\n};\n\n// ── Mini structural diagrams — only for guidelines whose concept is inherently spatial ──\nconst DIAGRAMS = {\n  G1: {\n    caption: 'A declared target changes everything that follows — including the aim',\n    svg: `<svg viewBox=\"0 0 420 118\" xmlns=\"http://www.w3.org/2000/svg\">\n      <g font-family=\"inherit\" font-size=\"11\" text-anchor=\"middle\">\n        <rect x=\"10\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"102\" y=\"26\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"10\">✗ BUILD FIRST, AIM LATER<\u002Ftext>\n        <g class=\"dg-wobble\"><line x1=\"50\" y1=\"70\" x2=\"95\" y2=\"70\" stroke=\"#9A2020\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n        <path d=\"M95 70 L86 65 M95 70 L86 75\" stroke=\"#9A2020\" stroke-width=\"2.2\" stroke-linecap=\"round\" fill=\"none\"/><\u002Fg>\n        <text x=\"102\" y=\"95\" fill=\"#9A5050\" font-size=\"9\" font-style=\"italic\">no target in sight<\u002Ftext>\n\n        <rect x=\"225\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#E1F0E3\" stroke=\"#1C4A22\" stroke-width=\"1.3\"/>\n        <text x=\"317\" y=\"26\" fill=\"#1C4A22\" font-weight=\"700\" font-size=\"10\">✓ DEFINE THE TARGET FIRST<\u002Ftext>\n        <circle cx=\"352\" cy=\"70\" r=\"16\" fill=\"none\" stroke=\"#1C4A22\" stroke-width=\"1.6\"/>\n        <circle cx=\"352\" cy=\"70\" r=\"9\" fill=\"none\" stroke=\"#1C4A22\" stroke-width=\"1.4\"/>\n        <circle cx=\"352\" cy=\"70\" r=\"2.6\" fill=\"#1C4A22\"/>\n        <g class=\"dg-arrow-fly\"><line x1=\"265\" y1=\"70\" x2=\"300\" y2=\"70\" stroke=\"#1C4A22\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n        <path d=\"M300 70 L292 65 M300 70 L292 75\" stroke=\"#1C4A22\" stroke-width=\"2.2\" stroke-linecap=\"round\" fill=\"none\"/><\u002Fg>\n        <text x=\"317\" y=\"95\" fill=\"#3F7A50\" font-size=\"9\" font-style=\"italic\">objective set, then aimed<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>`\n  },\n  G2: {\n    caption: 'A task map is only as good as who confirms it',\n    svg: `<svg viewBox=\"0 0 420 118\" xmlns=\"http://www.w3.org/2000/svg\">\n      <g font-family=\"inherit\" font-size=\"11\" text-anchor=\"middle\">\n        <rect x=\"10\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"102\" y=\"26\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"10\">✗ FROM A MANUAL ALONE<\u002Ftext>\n        <rect x=\"70\" y=\"44\" width=\"26\" height=\"32\" rx=\"2\" fill=\"#fff\" stroke=\"#9A2020\" stroke-width=\"1.3\"/>\n        <line x1=\"75\" y1=\"52\" x2=\"91\" y2=\"52\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <line x1=\"75\" y1=\"58\" x2=\"91\" y2=\"58\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <line x1=\"75\" y1=\"64\" x2=\"86\" y2=\"64\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <path class=\"dg-flow-line\" d=\"M100 60 L130 60\" stroke=\"#9A2020\" stroke-width=\"1.6\" marker-end=\"url(#arrR)\"/>\n        <rect x=\"136\" y=\"46\" width=\"28\" height=\"28\" rx=\"3\" fill=\"#fff\" stroke=\"#9A2020\" stroke-width=\"1.3\"/>\n        <path d=\"M141 54h18M141 60h18M141 66h12\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"102\" y=\"95\" fill=\"#9A5050\" font-size=\"9\" font-style=\"italic\">no one checked it<\u002Ftext>\n\n        <rect x=\"225\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#E1F0E3\" stroke=\"#1C4A22\" stroke-width=\"1.3\"/>\n        <text x=\"317\" y=\"26\" fill=\"#1C4A22\" font-weight=\"700\" font-size=\"10\">✓ CONFIRMED BY PRACTICE<\u002Ftext>\n        <rect x=\"248\" y=\"36\" width=\"24\" height=\"30\" rx=\"2\" fill=\"#fff\" stroke=\"#1C4A22\" stroke-width=\"1.3\"/>\n        <line x1=\"252\" y1=\"44\" x2=\"266\" y2=\"44\" stroke=\"#1C4A22\" stroke-width=\"1.1\"/>\n        <line x1=\"252\" y1=\"50\" x2=\"266\" y2=\"50\" stroke=\"#1C4A22\" stroke-width=\"1.1\"/>\n        <circle cx=\"260\" cy=\"82\" r=\"9\" fill=\"#fff\" stroke=\"#1C4A22\" stroke-width=\"1.3\"/>\n        <circle cx=\"260\" cy=\"78\" r=\"3\" fill=\"#1C4A22\"/>\n        <path d=\"M255 86 q5 -6 10 0\" stroke=\"#1C4A22\" stroke-width=\"1.3\" fill=\"none\"/>\n        <path class=\"dg-flow-line\" d=\"M275 46 L328 58\" stroke=\"#1C4A22\" stroke-width=\"1.4\" marker-end=\"url(#arrG)\"/>\n        <path class=\"dg-flow-line\" d=\"M270 80 L328 64\" stroke=\"#1C4A22\" stroke-width=\"1.4\" marker-end=\"url(#arrG)\"/>\n        <rect x=\"332\" y=\"48\" width=\"28\" height=\"28\" rx=\"3\" fill=\"#fff\" stroke=\"#1C4A22\" stroke-width=\"1.4\"/>\n        <path d=\"M337 56h18M337 62h18M337 68h12\" stroke=\"#1C4A22\" stroke-width=\"1.1\"/>\n        <text x=\"317\" y=\"98\" fill=\"#3F7A50\" font-size=\"9\" font-style=\"italic\">document + practitioner agree<\u002Ftext>\n      <\u002Fg>\n      <defs>\n        <marker id=\"arrR\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"2.5\" orient=\"auto\"><path d=\"M0,0 L5,2.5 L0,5 Z\" fill=\"#9A2020\"/><\u002Fmarker>\n        <marker id=\"arrG\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"2.5\" orient=\"auto\"><path d=\"M0,0 L5,2.5 L0,5 Z\" fill=\"#1C4A22\"/><\u002Fmarker>\n      <\u002Fdefs>\n    <\u002Fsvg>`\n  },\n  G6: {\n    caption: 'Looking right and behaving right are two different design jobs',\n    svg: `<svg viewBox=\"0 0 420 118\" xmlns=\"http://www.w3.org/2000/svg\">\n      <g font-family=\"inherit\" font-size=\"11\" text-anchor=\"middle\">\n        <rect x=\"10\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"102\" y=\"26\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"10\">✗ LOOKS REAL<\u002Ftext>\n        <g class=\"dg-spin-free\">\n          <circle cx=\"102\" cy=\"65\" r=\"20\" fill=\"#fff\" stroke=\"#9A2020\" stroke-width=\"1.4\"/>\n          <line x1=\"102\" y1=\"65\" x2=\"102\" y2=\"49\" stroke=\"#9A2020\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n          <line x1=\"102\" y1=\"65\" x2=\"114\" y2=\"73\" stroke=\"#9A2020\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n        <\u002Fg>\n        <text x=\"102\" y=\"98\" fill=\"#9A5050\" font-size=\"9\" font-style=\"italic\">spins freely — no resistance<\u002Ftext>\n\n        <rect x=\"225\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#E1F0E3\" stroke=\"#1C4A22\" stroke-width=\"1.3\"/>\n        <text x=\"317\" y=\"26\" fill=\"#1C4A22\" font-weight=\"700\" font-size=\"10\">✓ BEHAVES REAL<\u002Ftext>\n        <g class=\"dg-spin-stop\">\n          <circle cx=\"317\" cy=\"65\" r=\"20\" fill=\"#fff\" stroke=\"#1C4A22\" stroke-width=\"1.4\"/>\n          <line x1=\"317\" y1=\"65\" x2=\"317\" y2=\"49\" stroke=\"#1C4A22\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n        <\u002Fg>\n        <path d=\"M317 43 a22 22 0 0 1 18 12\" stroke=\"#1C4A22\" stroke-width=\"1\" fill=\"none\" stroke-dasharray=\"2 2\"/>\n        <text x=\"317\" y=\"98\" fill=\"#3F7A50\" font-size=\"9\" font-style=\"italic\">stops firmly at its real limit<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>`\n  },\n  G7: {\n    caption: 'A curve you design beats a survey you send afterward',\n    svg: `<svg viewBox=\"0 0 420 118\" xmlns=\"http://www.w3.org/2000/svg\">\n      <g font-family=\"inherit\" font-size=\"11\" text-anchor=\"middle\">\n        <rect x=\"10\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"102\" y=\"26\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"10\">✗ SURVEY AFTER<\u002Ftext>\n        <line x1=\"30\" y1=\"75\" x2=\"175\" y2=\"75\" stroke=\"#e0b8b6\" stroke-width=\"1.4\"/>\n        <g class=\"dg-appear-late\">\n          <circle cx=\"168\" cy=\"75\" r=\"5\" fill=\"#9A2020\"/>\n          <text x=\"168\" y=\"60\" fill=\"#9A2020\" font-size=\"8.5\" font-weight=\"600\">survey<\u002Ftext>\n        <\u002Fg>\n        <text x=\"102\" y=\"98\" fill=\"#9A5050\" font-size=\"9\" font-style=\"italic\">one signal, once, at the end<\u002Ftext>\n\n        <rect x=\"225\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#E1F0E3\" stroke=\"#1C4A22\" stroke-width=\"1.3\"/>\n        <text x=\"317\" y=\"26\" fill=\"#1C4A22\" font-weight=\"700\" font-size=\"10\">✓ CURVE DESIGNED IN<\u002Ftext>\n        <path class=\"dg-draw-path\" d=\"M245 88 Q275 48 305 58 T390 42\" stroke=\"#1C4A22\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/>\n        <text x=\"317\" y=\"98\" fill=\"#3F7A50\" font-size=\"9\" font-style=\"italic\">challenge tracked the whole way<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>`\n  },\n  G3: {\n    caption: 'Progression as named stages, not one flat session — watch each stage activate in turn',\n    svg: `<svg viewBox=\"0 0 420 90\" xmlns=\"http://www.w3.org/2000/svg\">\n      <g font-family=\"inherit\" font-size=\"11\" text-anchor=\"middle\">\n        <g class=\"dg-stage\"><rect x=\"6\" y=\"28\" width=\"88\" height=\"36\" rx=\"7\" fill=\"#FBEBD3\" stroke=\"#7A4300\" stroke-width=\"1.2\"/>\n        <text x=\"50\" y=\"50\" fill=\"#7A4300\" font-weight=\"600\">Practice<\u002Ftext><\u002Fg>\n        <g class=\"dg-stage\"><rect x=\"112\" y=\"28\" width=\"88\" height=\"36\" rx=\"7\" fill=\"#FBEBD3\" stroke=\"#7A4300\" stroke-width=\"1.2\"/>\n        <text x=\"156\" y=\"50\" fill=\"#7A4300\" font-weight=\"600\">Guided<\u002Ftext><\u002Fg>\n        <g class=\"dg-stage\"><rect x=\"218\" y=\"28\" width=\"94\" height=\"36\" rx=\"7\" fill=\"#FBEBD3\" stroke=\"#7A4300\" stroke-width=\"1.2\"/>\n        <text x=\"265\" y=\"50\" fill=\"#7A4300\" font-weight=\"600\">Independent<\u002Ftext><\u002Fg>\n        <g class=\"dg-stage\"><rect x=\"330\" y=\"28\" width=\"86\" height=\"36\" rx=\"7\" fill=\"#E8F5EE\" stroke=\"#1E6040\" stroke-width=\"1.4\"/>\n        <text x=\"373\" y=\"50\" fill=\"#1E6040\" font-weight=\"600\">Final Check<\u002Ftext><\u002Fg>\n        <path class=\"dg-flow-line\" d=\"M96 46 L110 46\" stroke=\"#999\" stroke-width=\"1.6\" marker-end=\"url(#arr)\"/>\n        <path class=\"dg-flow-line\" d=\"M202 46 L216 46\" stroke=\"#999\" stroke-width=\"1.6\" marker-end=\"url(#arr)\"/>\n        <path class=\"dg-flow-line\" d=\"M314 46 L328 46\" stroke=\"#999\" stroke-width=\"1.6\" marker-end=\"url(#arr)\"/>\n        <text x=\"50\" y=\"80\" fill=\"#999\" font-size=\"9\" font-style=\"italic\">max scaffold<\u002Ftext>\n        <text x=\"373\" y=\"80\" fill=\"#999\" font-size=\"9\" font-style=\"italic\">min scaffold<\u002Ftext>\n      <\u002Fg>\n      <defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#999\"/><\u002Fmarker><\u002Fdefs>\n    <\u002Fsvg>`\n  },\n  G4: {\n    caption: 'The gesture should mirror the real motion — not stand in for it',\n    svg: `<svg viewBox=\"0 0 420 118\" xmlns=\"http://www.w3.org/2000/svg\">\n      <g font-family=\"inherit\" font-size=\"11\" text-anchor=\"middle\">\n        <rect x=\"10\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"102\" y=\"26\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"10\">✗ GENERIC BUTTON<\u002Ftext>\n        <circle cx=\"102\" cy=\"62\" r=\"20\" fill=\"#fff\" stroke=\"#9A2020\" stroke-width=\"1.4\"/>\n        <rect class=\"dg-press\" x=\"94\" y=\"54\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#9A2020\" opacity=\"0.75\"/>\n        <text x=\"102\" y=\"95\" fill=\"#9A5050\" font-size=\"9\" font-style=\"italic\">press = \"turn valve\"<\u002Ftext>\n        <rect x=\"225\" y=\"8\" width=\"185\" height=\"100\" rx=\"8\" fill=\"#E1F0E3\" stroke=\"#1C4A22\" stroke-width=\"1.3\"/>\n        <text x=\"317\" y=\"26\" fill=\"#1C4A22\" font-weight=\"700\" font-size=\"10\">✓ PHYSICAL ROTATION<\u002Ftext>\n        <g class=\"dg-rotate\">\n          <circle cx=\"317\" cy=\"62\" r=\"20\" fill=\"#fff\" stroke=\"#1C4A22\" stroke-width=\"1.4\"/>\n          <line x1=\"317\" y1=\"62\" x2=\"317\" y2=\"46\" stroke=\"#1C4A22\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n          <circle cx=\"317\" cy=\"46\" r=\"2.4\" fill=\"#1C4A22\"/>\n        <\u002Fg>\n        <text x=\"317\" y=\"95\" fill=\"#3F7A50\" font-size=\"9\" font-style=\"italic\">rotate = turn valve<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>`\n  },\n  G5: {\n    caption: 'Two channels, not one — immediate cue plus a report to revisit later',\n    svg: `<svg viewBox=\"0 0 420 128\" xmlns=\"http://www.w3.org/2000/svg\">\n      <g font-family=\"inherit\" font-size=\"11\" text-anchor=\"middle\">\n        <rect x=\"10\" y=\"46\" width=\"90\" height=\"34\" rx=\"7\" fill=\"#DCE7F5\" stroke=\"#1B4C8C\" stroke-width=\"1.2\"/>\n        <text x=\"55\" y=\"67\" fill=\"#1B4C8C\" font-weight=\"600\">Action<\u002Ftext>\n        <path class=\"dg-flow-line\" d=\"M100 54 L155 30\" stroke=\"#999\" stroke-width=\"1.4\" marker-end=\"url(#arr2)\"/>\n        <path class=\"dg-flow-line\" d=\"M100 69 L155 91\" stroke=\"#999\" stroke-width=\"1.4\" marker-end=\"url(#arr2)\"/>\n        <rect x=\"160\" y=\"14\" width=\"120\" height=\"34\" rx=\"7\" fill=\"#FBEBD3\" stroke=\"#7A4300\" stroke-width=\"1.2\"/>\n        <text x=\"220\" y=\"35\" fill=\"#7A4300\" font-weight=\"600\">Immediate cue<\u002Ftext>\n        <text x=\"220\" y=\"60\" fill=\"#999\" font-size=\"9\" font-style=\"italic\">visual · haptic · audio<\u002Ftext>\n        <rect x=\"160\" y=\"74\" width=\"130\" height=\"34\" rx=\"7\" fill=\"#EDE4F8\" stroke=\"#5B1F99\" stroke-width=\"1.2\"/>\n        <text x=\"225\" y=\"95\" fill=\"#3D1466\" font-weight=\"600\">Debrief report<\u002Ftext>\n        <text x=\"225\" y=\"120\" fill=\"#999\" font-size=\"9\" font-style=\"italic\">available after session<\u002Ftext>\n      <\u002Fg>\n      <defs><marker id=\"arr2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#999\"/><\u002Fmarker><\u002Fdefs>\n    <\u002Fsvg>`\n  },\n  G8: {\n    caption: 'Every logged event traces back to a named learning goal — follow the dot',\n    svg: `<svg viewBox=\"0 0 420 90\" xmlns=\"http://www.w3.org/2000/svg\">\n      <g font-family=\"inherit\" font-size=\"11\" text-anchor=\"middle\">\n        <rect x=\"6\" y=\"28\" width=\"110\" height=\"36\" rx=\"7\" fill=\"#DCE7F5\" stroke=\"#1B4C8C\" stroke-width=\"1.2\"/>\n        <text x=\"61\" y=\"50\" fill=\"#1B4C8C\" font-weight=\"600\">Learning goal<\u002Ftext>\n        <rect x=\"150\" y=\"28\" width=\"110\" height=\"36\" rx=\"7\" fill=\"#FBEBD3\" stroke=\"#7A4300\" stroke-width=\"1.2\"/>\n        <text x=\"205\" y=\"50\" fill=\"#7A4300\" font-weight=\"600\">Logged event<\u002Ftext>\n        <rect x=\"294\" y=\"28\" width=\"120\" height=\"36\" rx=\"7\" fill=\"#E8F5EE\" stroke=\"#1E6040\" stroke-width=\"1.4\"/>\n        <text x=\"354\" y=\"50\" fill=\"#1E6040\" font-weight=\"600\">Evidence<\u002Ftext>\n        <path class=\"dg-flow-line\" d=\"M118 46 L148 46\" stroke=\"#999\" stroke-width=\"1.6\" marker-end=\"url(#arr3)\"/>\n        <path class=\"dg-flow-line\" d=\"M262 46 L292 46\" stroke=\"#999\" stroke-width=\"1.6\" marker-end=\"url(#arr3)\"/>\n        <circle class=\"dg-travel-dot\" cx=\"118\" cy=\"46\" r=\"4\" fill=\"#1B4C8C\"/>\n      <\u002Fg>\n      <defs><marker id=\"arr3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#999\"/><\u002Fmarker><\u002Fdefs>\n    <\u002Fsvg>`\n  },\n};\n// One-line first action per guideline — used in the \"Where to start\" panel.\n// Deliberately short and imperative: this is feed-forward, not explanation.\n// ── How each guideline was actually derived: the focused code that bridges\n// 80 coded corpus entries to the guideline statement (SAM, CGT per Charmaz, 2014).\n// Kept visible so the classical theory citations never eclipse the RBS provenance.\nconst DERIVATION = {\n  G1: 'Socio-pedagogical framing of immersive experiences',\n  G2: 'Ecology of task action in immersive environments',\n  G3: 'Cognitive scaffolding & progressive complexity curves',\n  G4: 'Embodied motor action & hand-agency',\n  G5: 'Multimodal feedback systems & post-task reflection',\n  G6: 'Functional realism vs. aesthetic fidelity',\n  G7: 'Proactive experience modelling & presence management',\n  G8: 'Constructive articulation of design & evaluation (ECD)',\n};\n\n// ── Theory primers: the worksheets ask users to apply named theories\n// (Bloom levels, cognitive load types, flow, ECD). Without a short accurate\n// explanation those columns are unusable for anyone outside instructional design.\n// Shown on demand inside the worksheet modal.\nconst THEORY = {\n  G1: {\n    name: 'Bloom\\u2019s revised taxonomy — the six cognitive process levels',\n    cite: 'Anderson, L. W., &amp; Krathwohl, D. R. (2001). <em>A Taxonomy for Learning, Teaching, and Assessing.<\u002Fem> Longman. (Revision of Bloom et al., 1956.)',\n    use: 'Pick the level your objective actually targets, then choose a verb from that level. The level tells you what kind of evidence G8 will need.',\n    caveat: 'Levels are not strict prerequisites: an objective can target Apply without first exhausting Remember and Understand. Pick the level the real task demands \\u2014 aiming lower than the job requires is the more common mistake.',\n    svg: `<svg viewBox=\"0 0 420 176\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Six levels of Bloom's revised taxonomy from Remember to Create, with example verbs\">\n      <g font-family=\"inherit\" font-size=\"10.5\">\n        ${[['Remember','recall, list, name','#EAF1F8','#1B4C8C'],\n           ['Understand','explain, classify','#E4EEF6','#1B4C8C'],\n           ['Apply','execute, carry out, use','#DFEAF3','#1E6040'],\n           ['Analyse','differentiate, diagnose','#DAE7F1','#1E6040'],\n           ['Evaluate','check, critique, judge','#D5E3EF','#7A4300'],\n           ['Create','design, plan, produce','#D0E0ED','#7A4300']]\n          .map(([lv,vb,bg,fg],i)=>`\n            <rect x=\"${58+i*4}\" y=\"${8+i*27}\" width=\"${300-i*4}\" height=\"22\" rx=\"4\" fill=\"${bg}\" stroke=\"${fg}\" stroke-width=\"1\"/>\n            <text x=\"${66+i*4}\" y=\"${23+i*27}\" fill=\"${fg}\" font-weight=\"700\">${lv}<\u002Ftext>\n            <text x=\"${172+i*4}\" y=\"${23+i*27}\" fill=\"#727C8A\" font-style=\"italic\">${vb}<\u002Ftext>`).join('')}\n        <text x=\"18\" y=\"20\" fill=\"#999\" font-size=\"9\">simpler<\u002Ftext>\n        <text x=\"18\" y=\"165\" fill=\"#999\" font-size=\"9\">more<\u002Ftext>\n        <text x=\"18\" y=\"174\" fill=\"#999\" font-size=\"9\">complex<\u002Ftext>\n        <line x1=\"48\" y1=\"14\" x2=\"48\" y2=\"168\" stroke=\"#ccc\" stroke-width=\"1\" marker-end=\"url(#tarr)\"/>\n      <\u002Fg>\n      <defs><marker id=\"tarr\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L3,5 L6,0 Z\" fill=\"#ccc\"/><\u002Fmarker><\u002Fdefs>\n    <\u002Fsvg>`,\n  },\n  G2: {\n    name: 'Hierarchical Task Analysis — decomposing a real task',\n    cite: 'Annett, J., &amp; Duncan, K. D. (1967). Task analysis and training design. <em>Occupational Psychology<\u002Fem>, 41, 211\\u2013221.',\n    use: 'Break the goal into sub-tasks, then into operations, and stop when each operation has one clear success criterion. Each leaf becomes a row in your table.',\n    caveat: 'The stopping rule matters: decompose only until an operation can be judged right or wrong. Going deeper adds detail without adding design value.',\n    svg: `<svg viewBox=\"0 0 420 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hierarchical task analysis tree: goal decomposed into sub-tasks and operations\">\n      <g font-family=\"inherit\" font-size=\"10\" text-anchor=\"middle\">\n        <rect x=\"145\" y=\"8\" width=\"130\" height=\"26\" rx=\"5\" fill=\"#DCE7F5\" stroke=\"#1B4C8C\" stroke-width=\"1.3\"/>\n        <text x=\"210\" y=\"25\" fill=\"#1B4C8C\" font-weight=\"700\">Goal<\u002Ftext>\n        <line x1=\"210\" y1=\"34\" x2=\"105\" y2=\"58\" stroke=\"#bbb\"/><line x1=\"210\" y1=\"34\" x2=\"315\" y2=\"58\" stroke=\"#bbb\"/>\n        <rect x=\"45\" y=\"58\" width=\"120\" height=\"24\" rx=\"5\" fill=\"#EAF3DE\" stroke=\"#1C4A22\" stroke-width=\"1.1\"/>\n        <text x=\"105\" y=\"74\" fill=\"#1C4A22\" font-weight=\"600\">Sub-task 1<\u002Ftext>\n        <rect x=\"255\" y=\"58\" width=\"120\" height=\"24\" rx=\"5\" fill=\"#EAF3DE\" stroke=\"#1C4A22\" stroke-width=\"1.1\"/>\n        <text x=\"315\" y=\"74\" fill=\"#1C4A22\" font-weight=\"600\">Sub-task 2<\u002Ftext>\n        <line x1=\"105\" y1=\"82\" x2=\"60\" y2=\"104\" stroke=\"#bbb\"/><line x1=\"105\" y1=\"82\" x2=\"150\" y2=\"104\" stroke=\"#bbb\"/>\n        <line x1=\"315\" y1=\"82\" x2=\"285\" y2=\"104\" stroke=\"#bbb\"/>\n        ${[[60,'1.1'],[150,'1.2'],[285,'2.1']].map(([x,l])=>`\n          <rect x=\"${x-38}\" y=\"104\" width=\"76\" height=\"22\" rx=\"4\" fill=\"#FBEBD3\" stroke=\"#7A4300\" stroke-width=\"1\"/>\n          <text x=\"${x}\" y=\"119\" fill=\"#7A4300\" font-weight=\"600\">Op ${l}<\u002Ftext>`).join('')}\n        <text x=\"210\" y=\"143\" fill=\"#999\" font-size=\"9\" font-style=\"italic\">Stop when each operation has one clear success criterion<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>`,\n  },\n  G3: {\n    name: 'Cognitive Load Theory + Zone of Proximal Development',\n    cite: 'Sweller, J. (1988). Cognitive load during problem solving. <em>Cognitive Science<\u002Fem>, 12(2), 257\\u2013285. · Vygotsky, L. S. (1978). <em>Mind in Society.<\u002Fem> Harvard University Press.',\n    use: 'Your stage plan should cut extraneous load, sequence intrinsic load, and protect room for germane load. Scaffolds belong in the middle zone and fade as the learner moves left.',\n    caveat: 'The three load types share one limited working memory. You cannot reduce intrinsic load without changing the task \\u2014 you can only sequence it across stages.',\n    svg: `<svg viewBox=\"0 0 420 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Three types of cognitive load sharing one working memory capacity, and the three zones of proximal development\">\n      <g font-family=\"inherit\" font-size=\"10\">\n        <text x=\"8\" y=\"14\" fill=\"#333B47\" font-weight=\"700\" font-size=\"10.5\">One limited working memory<\u002Ftext>\n        <rect x=\"8\" y=\"20\" width=\"404\" height=\"30\" rx=\"4\" fill=\"#fff\" stroke=\"#bbb\" stroke-width=\"1.2\"/>\n        <rect x=\"10\" y=\"22\" width=\"150\" height=\"26\" fill=\"#FBEBD3\"/><text x=\"85\" y=\"38\" fill=\"#7A4300\" text-anchor=\"middle\" font-weight=\"600\">Intrinsic<\u002Ftext>\n        <rect x=\"160\" y=\"22\" width=\"120\" height=\"26\" fill=\"#FBE1DF\"/><text x=\"220\" y=\"38\" fill=\"#9A2020\" text-anchor=\"middle\" font-weight=\"600\">Extraneous<\u002Ftext>\n        <rect x=\"280\" y=\"22\" width=\"130\" height=\"26\" fill=\"#E1F0E3\"/><text x=\"345\" y=\"38\" fill=\"#1C4A22\" text-anchor=\"middle\" font-weight=\"600\">Germane<\u002Ftext>\n        <text x=\"85\" y=\"62\" fill=\"#96814A\" text-anchor=\"middle\" font-size=\"8.5\">task complexity — sequence it<\u002Ftext>\n        <text x=\"220\" y=\"62\" fill=\"#9A5050\" text-anchor=\"middle\" font-size=\"8.5\">poor design — cut it<\u002Ftext>\n        <text x=\"345\" y=\"62\" fill=\"#3F7A50\" text-anchor=\"middle\" font-size=\"8.5\">schema building — protect it<\u002Ftext>\n\n        <text x=\"8\" y=\"92\" fill=\"#333B47\" font-weight=\"700\" font-size=\"10.5\">Zone of Proximal Development<\u002Ftext>\n        <rect x=\"8\" y=\"98\" width=\"128\" height=\"34\" rx=\"4\" fill=\"#E1F0E3\" stroke=\"#1C4A22\" stroke-width=\"1.1\"/>\n        <text x=\"72\" y=\"112\" fill=\"#1C4A22\" text-anchor=\"middle\" font-weight=\"600\">Can do alone<\u002Ftext>\n        <text x=\"72\" y=\"125\" fill=\"#3F7A50\" text-anchor=\"middle\" font-size=\"8.5\">no scaffold needed<\u002Ftext>\n        <rect x=\"146\" y=\"98\" width=\"128\" height=\"34\" rx=\"4\" fill=\"#FBEBD3\" stroke=\"#7A4300\" stroke-width=\"1.4\"/>\n        <text x=\"210\" y=\"112\" fill=\"#7A4300\" text-anchor=\"middle\" font-weight=\"700\">With help — ZPD<\u002Ftext>\n        <text x=\"210\" y=\"125\" fill=\"#96814A\" text-anchor=\"middle\" font-size=\"8.5\">scaffold here, then fade<\u002Ftext>\n        <rect x=\"284\" y=\"98\" width=\"128\" height=\"34\" rx=\"4\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"348\" y=\"112\" fill=\"#9A2020\" text-anchor=\"middle\" font-weight=\"600\">Not yet possible<\u002Ftext>\n        <text x=\"348\" y=\"125\" fill=\"#9A5050\" text-anchor=\"middle\" font-size=\"8.5\">too far — split the task<\u002Ftext>\n        <line x1=\"270\" y1=\"150\" x2=\"60\" y2=\"150\" stroke=\"#7A4300\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" marker-end=\"url(#zarr)\"/>\n        <text x=\"210\" y=\"164\" fill=\"#999\" text-anchor=\"middle\" font-size=\"9\" font-style=\"italic\">as competence grows, the zone moves and scaffolds fade<\u002Ftext>\n      <\u002Fg>\n      <defs><marker id=\"zarr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#7A4300\"/><\u002Fmarker><\u002Fdefs>\n    <\u002Fsvg>`,\n  },\n  G4: {\n    name: 'Motor schema theory — why the movement must match',\n    cite: 'Schmidt, R. A. (1975). A schema theory of discrete motor skill learning. <em>Psychological Review<\u002Fem>, 82(4), 225\\u2013260. · Varela, F. J., Thompson, E., &amp; Rosch, E. (1991). <em>The Embodied Mind.<\u002Fem> MIT Press.',\n    use: 'Learners build a movement schema from the relationship between what they intend, what they do, and what results. A button press abstracts that relationship away.',\n    caveat: 'Varied practice strengthens a schema; but the variation must be in task parameters, not in the mapping between gesture and effect. Keep the mapping stable.',\n    svg: `<svg viewBox=\"0 0 420 132\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Motor schema loop: intention, movement, outcome, compared against real task versus abstracted button input\">\n      <g font-family=\"inherit\" font-size=\"10\" text-anchor=\"middle\">\n        <text x=\"105\" y=\"14\" fill=\"#1C4A22\" font-weight=\"700\" font-size=\"10.5\">Gesture matches the task<\u002Ftext>\n        ${[[38,'Intent'],[105,'Movement'],[172,'Outcome']].map(([x,l])=>`\n          <rect x=\"${x-31}\" y=\"26\" width=\"62\" height=\"24\" rx=\"4\" fill=\"#E1F0E3\" stroke=\"#1C4A22\" stroke-width=\"1.1\"/>\n          <text x=\"${x}\" y=\"41\" fill=\"#1C4A22\" font-weight=\"600\" font-size=\"9.5\">${l}<\u002Ftext>`).join('')}\n        <line x1=\"69\" y1=\"38\" x2=\"73\" y2=\"38\" stroke=\"#1C4A22\" stroke-width=\"1.2\" marker-end=\"url(#marr)\"/>\n        <line x1=\"136\" y1=\"38\" x2=\"140\" y2=\"38\" stroke=\"#1C4A22\" stroke-width=\"1.2\" marker-end=\"url(#marr)\"/>\n        <path d=\"M172 50 q0 22 -67 22 q-67 0 -67 -22\" fill=\"none\" stroke=\"#1C4A22\" stroke-width=\"1.1\" stroke-dasharray=\"3 3\" marker-end=\"url(#marr)\"/>\n        <text x=\"105\" y=\"86\" fill=\"#3F7A50\" font-size=\"8.5\" font-style=\"italic\">schema forms from this loop<\u002Ftext>\n\n        <text x=\"315\" y=\"14\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"10.5\">Gesture abstracted to a button<\u002Ftext>\n        <rect x=\"252\" y=\"26\" width=\"62\" height=\"24\" rx=\"4\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"283\" y=\"41\" fill=\"#9A2020\" font-weight=\"600\" font-size=\"9.5\">Intent<\u002Ftext>\n        <rect x=\"346\" y=\"26\" width=\"62\" height=\"24\" rx=\"4\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.1\"/>\n        <text x=\"377\" y=\"41\" fill=\"#9A2020\" font-weight=\"600\" font-size=\"9.5\">Outcome<\u002Ftext>\n        <line x1=\"316\" y1=\"38\" x2=\"342\" y2=\"38\" stroke=\"#9A2020\" stroke-width=\"1.2\" stroke-dasharray=\"3 2\" marker-end=\"url(#marr2)\"/>\n        <text x=\"330\" y=\"62\" fill=\"#9A5050\" font-size=\"8.5\" font-style=\"italic\">movement skipped<\u002Ftext>\n        <text x=\"330\" y=\"86\" fill=\"#9A5050\" font-size=\"8.5\" font-style=\"italic\">no motor schema to transfer<\u002Ftext>\n      <\u002Fg>\n      <defs>\n        <marker id=\"marr\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"2.5\" orient=\"auto\"><path d=\"M0,0 L5,2.5 L0,5 Z\" fill=\"#1C4A22\"/><\u002Fmarker>\n        <marker id=\"marr2\" markerWidth=\"7\" markerHeight=\"7\" refX=\"5\" refY=\"2.5\" orient=\"auto\"><path d=\"M0,0 L5,2.5 L0,5 Z\" fill=\"#9A2020\"/><\u002Fmarker>\n      <\u002Fdefs>\n    <\u002Fsvg>`,\n  },\n};\n\nObject.assign(THEORY, {\n  G5: {\n    name: 'Feedback timing, an

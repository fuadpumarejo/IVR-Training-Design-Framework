d the three feedback questions',\n    cite: 'Hattie, J., &amp; Timperley, H. (2007). The power of feedback. <em>Review of Educational Research<\u002Fem>, 77(1), 81\\u2013112. · Shute, V. J. (2008). Focus on formative feedback. <em>Review of Educational Research<\u002Fem>, 78(1), 153\\u2013189.',\n    use: 'Immediate cues serve performance in the moment; the debrief serves learning afterwards. Your matrix needs both columns because they do different jobs.',\n    caveat: 'Hattie &amp; Timperley found \"Where to next?\" is the most effective and least often provided. A debrief that only reports what went wrong stops one question short.',\n    svg: `<svg viewBox=\"0 0 420 148\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Immediate versus delayed feedback, and the three feedback questions\">\n      <g font-family=\"inherit\" font-size=\"10\">\n        <line x1=\"20\" y1=\"34\" x2=\"400\" y2=\"34\" stroke=\"#ccc\" stroke-width=\"1.4\"/>\n        <circle cx=\"70\" cy=\"34\" r=\"5\" fill=\"#7A4300\"/>\n        <text x=\"70\" y=\"24\" fill=\"#7A4300\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"9.5\">action<\u002Ftext>\n        <circle cx=\"120\" cy=\"34\" r=\"5\" fill=\"#7A4300\"/>\n        <text x=\"120\" y=\"52\" fill=\"#7A4300\" text-anchor=\"middle\" font-size=\"9\">immediate cue<\u002Ftext>\n        <text x=\"120\" y=\"63\" fill=\"#96814A\" text-anchor=\"middle\" font-size=\"8.5\">&lt; 150 ms · supports doing<\u002Ftext>\n        <circle cx=\"330\" cy=\"34\" r=\"5\" fill=\"#5B1F99\"/>\n        <text x=\"330\" y=\"52\" fill=\"#3D1466\" text-anchor=\"middle\" font-size=\"9\">debrief report<\u002Ftext>\n        <text x=\"330\" y=\"63\" fill=\"#7a5a99\" text-anchor=\"middle\" font-size=\"8.5\">after session · supports learning<\u002Ftext>\n        <text x=\"225\" y=\"30\" fill=\"#999\" text-anchor=\"middle\" font-size=\"8.5\" font-style=\"italic\">session continues<\u002Ftext>\n\n        <text x=\"20\" y=\"90\" fill=\"#333B47\" font-weight=\"700\" font-size=\"10.5\">Every debrief should answer all three<\u002Ftext>\n        ${[[20,'Where am I going?','the objective (G1)','#DCE7F5','#1B4C8C'],\n           [156,'How am I going?','what actually happened','#EAF3DE','#1C4A22'],\n           [292,'Where to next?','the specific next step','#FBEBD3','#7A4300']]\n          .map(([x,q,s,bg,fg])=>`\n            <rect x=\"${x}\" y=\"98\" width=\"128\" height=\"38\" rx=\"5\" fill=\"${bg}\" stroke=\"${fg}\" stroke-width=\"1.2\"/>\n            <text x=\"${x+64}\" y=\"113\" fill=\"${fg}\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"9.5\">${q}<\u002Ftext>\n            <text x=\"${x+64}\" y=\"127\" fill=\"#727C8A\" text-anchor=\"middle\" font-size=\"8.5\">${s}<\u002Ftext>`).join('')}\n        <text x=\"356\" y=\"146\" fill=\"#7A4300\" text-anchor=\"middle\" font-size=\"8\" font-style=\"italic\">most often missing<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>`,\n  },\n  G6: {\n    name: 'Three kinds of fidelity — and which one carries the learning',\n    cite: 'Gibson, J. J. (1979). <em>The Ecological Approach to Visual Perception.<\u002Fem> Houghton Mifflin. · Fidelity dimensions per simulation-training literature (physical / functional / psychological).',\n    use: 'Rate each element on all three. Functional fidelity is what usually carries transfer; visual fidelity is what usually consumes the budget.',\n    caveat: 'High physical fidelity with low functional fidelity is the risky combination: it looks authoritative while teaching an incorrect model of how the equipment behaves.',\n    svg: `<svg viewBox=\"0 0 420 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Physical, functional and psychological fidelity compared\">\n      <g font-family=\"inherit\" font-size=\"10\" text-anchor=\"middle\">\n        ${[[10,'Physical','Looks and feels like the real thing','#DCE7F5','#1B4C8C','often over-invested'],\n           [146,'Functional','Behaves by the real rules and physics','#E1F0E3','#1C4A22','carries the transfer'],\n           [282,'Psychological','Feels consequential — real stakes','#EDE4F8','#5B1F99','often forgotten']]\n          .map(([x,t,d,bg,fg,n])=>`\n            <rect x=\"${x}\" y=\"10\" width=\"128\" height=\"72\" rx=\"6\" fill=\"${bg}\" stroke=\"${fg}\" stroke-width=\"${t==='Functional'?1.7:1.1}\"/>\n            <text x=\"${x+64}\" y=\"30\" fill=\"${fg}\" font-weight=\"700\">${t}<\u002Ftext>\n            <text x=\"${x+64}\" y=\"47\" fill=\"#333B47\" font-size=\"8.5\">${d.split(' ').slice(0,4).join(' ')}<\u002Ftext>\n            <text x=\"${x+64}\" y=\"59\" fill=\"#333B47\" font-size=\"8.5\">${d.split(' ').slice(4).join(' ')}<\u002Ftext>\n            <text x=\"${x+64}\" y=\"75\" fill=\"${fg}\" font-size=\"8\" font-style=\"italic\">${n}<\u002Ftext>`).join('')}\n        <rect x=\"10\" y=\"96\" width=\"400\" height=\"34\" rx=\"5\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.2\"/>\n        <text x=\"210\" y=\"110\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"9.5\">The risky combination<\u002Ftext>\n        <text x=\"210\" y=\"123\" fill=\"#9A5050\" font-size=\"8.5\">High physical + low functional: looks convincing, teaches the wrong behaviour<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>`,\n  },\n  G7: {\n    name: 'The flow channel — challenge balanced against skill',\n    cite: 'Csikszentmihalyi, M. (1990). <em>Flow: The Psychology of Optimal Experience.<\u002Fem> Harper &amp; Row. · Deci, E. L., &amp; Ryan, R. M. (1985). <em>Intrinsic Motivation and Self-Determination in Human Behavior.<\u002Fem> Springer.',\n    use: 'Plot each stage on these axes. Because skill rises during training, a flat difficulty line drifts out of the channel into boredom.',\n    caveat: 'Flow is a by-product of the challenge/skill balance, not something you can add directly. You design the balance; flow follows or it does not.',\n    svg: `<svg viewBox=\"0 0 420 176\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Flow channel diagram: challenge on the vertical axis, skill on the horizontal, with anxiety above and boredom below the diagonal channel\">\n      <g font-family=\"inherit\" font-size=\"10\">\n        <line x1=\"46\" y1=\"150\" x2=\"400\" y2=\"150\" stroke=\"#999\" stroke-width=\"1.2\"/>\n        <line x1=\"46\" y1=\"150\" x2=\"46\" y2=\"14\" stroke=\"#999\" stroke-width=\"1.2\"/>\n        <text x=\"223\" y=\"168\" fill=\"#727C8A\" text-anchor=\"middle\" font-size=\"9.5\">Learner skill \\u2192<\u002Ftext>\n        <text x=\"14\" y=\"86\" fill=\"#727C8A\" text-anchor=\"middle\" font-size=\"9.5\" transform=\"rotate(-90 14 86)\">Challenge \\u2192<\u002Ftext>\n        <path d=\"M46 150 L400 20 L400 62 L46 150 Z\" fill=\"#E1F0E3\" stroke=\"#1C4A22\" stroke-width=\"1.3\"/>\n        <text x=\"250\" y=\"98\" fill=\"#1C4A22\" font-weight=\"700\" font-size=\"11\" transform=\"rotate(-20 250 98)\">FLOW<\u002Ftext>\n        <text x=\"150\" y=\"42\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"10\">Anxiety<\u002Ftext>\n        <text x=\"150\" y=\"55\" fill=\"#9A5050\" font-size=\"8.5\">too hard for current skill<\u002Ftext>\n        <text x=\"308\" y=\"146\" fill=\"#7A4300\" font-weight=\"700\" font-size=\"10\">Boredom<\u002Ftext>\n        <text x=\"308\" y=\"158\" fill=\"#96814A\" font-size=\"8.5\">too easy for grown skill<\u002Ftext>\n        <line x1=\"46\" y1=\"118\" x2=\"356\" y2=\"118\" stroke=\"#9A2020\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/>\n        <text x=\"60\" y=\"132\" fill=\"#9A2020\" font-size=\"8.5\" text-anchor=\"start\" font-style=\"italic\">a flat difficulty line starts in flow, then drifts out into boredom<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>`,\n  },\n  G8: {\n    name: 'Evidence-Centred Design — the claim, evidence, task chain',\n    cite: 'Mislevy, R. J., Steinberg, L. S., &amp; Almond, R. G. (2003). On the structure of educational assessments. <em>Measurement<\u002Fem>, 1(1), 3\\u201362. · Biggs, J. (2003). <em>Teaching for Quality Learning at University.<\u002Fem> Open University Press.',\n    use: 'Work right to left: state the claim, decide what would count as evidence for it, then design the task that produces that evidence. Your matrix is this chain in table form.',\n    caveat: 'The common failure is working left to right \\u2014 logging whatever the engine produces, then hunting for claims it might support. That yields data without evidentiary value.',\n    svg: `<svg viewBox=\"0 0 420 168\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Evidence-centred design chain from competency claim to evidence to task, designed right to left while evidence flows left to right\">\n      <g font-family=\"inherit\" font-size=\"10\" text-anchor=\"middle\">\n        <text x=\"210\" y=\"12\" fill=\"#1B4C8C\" font-weight=\"700\" font-size=\"9\">DESIGN in this direction \\u2192<\u002Ftext>\n        <line x1=\"60\" y1=\"22\" x2=\"360\" y2=\"22\" stroke=\"#1B4C8C\" stroke-width=\"1.5\" marker-end=\"url(#earr)\"/>\n        ${[[8,'Claim','what the learner can do','#DCE7F5','#1B4C8C'],\n           [146,'Evidence','what would prove it','#FBEBD3','#7A4300'],\n           [284,'Task','what produces that data','#E1F0E3','#1C4A22']]\n          .map(([x,t,d,bg,fg])=>`\n            <rect x=\"${x}\" y=\"34\" width=\"128\" height=\"46\" rx=\"6\" fill=\"${bg}\" stroke=\"${fg}\" stroke-width=\"1.3\"/>\n            <text x=\"${x+64}\" y=\"54\" fill=\"${fg}\" font-weight=\"700\">${t}<\u002Ftext>\n            <text x=\"${x+64}\" y=\"69\" fill=\"#727C8A\" font-size=\"8.5\">${d}<\u002Ftext>`).join('')}\n        <line x1=\"360\" y1=\"92\" x2=\"60\" y2=\"92\" stroke=\"#1C4A22\" stroke-width=\"1.5\" marker-end=\"url(#earr2)\"/>\n        <text x=\"210\" y=\"108\" fill=\"#1C4A22\" font-weight=\"700\" font-size=\"9\">\\u2190 EVIDENCE flows back this way<\u002Ftext>\n        <rect x=\"8\" y=\"122\" width=\"404\" height=\"38\" rx=\"5\" fill=\"#FBE1DF\" stroke=\"#9A2020\" stroke-width=\"1.2\"/>\n        <text x=\"210\" y=\"137\" fill=\"#9A2020\" font-weight=\"700\" font-size=\"9.5\">The common failure<\u002Ftext>\n        <text x=\"210\" y=\"151\" fill=\"#9A5050\" font-size=\"8.5\">Starting from the data the engine happens to log, then hunting for claims it might support<\u002Ftext>\n      <\u002Fg>\n      <defs>\n        <marker id=\"earr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#1B4C8C\"/><\u002Fmarker>\n        <marker id=\"earr2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#1C4A22\"/><\u002Fmarker>\n      <\u002Fdefs>\n    <\u002Fsvg>`,\n  },\n});\n\n// ── Per-guideline worksheets: a real instrument + worked example + blank template.\n// Each is anchored to an established, citable method so the guidance is defensible,\n// not generic advice. Opened on demand in a modal (details-on-demand pattern).\nconst WORKSHEETS = {\n  G1: {\n    title: 'Learning Objectives Worksheet',\n    produces: 'A short table of observable objectives that every later decision points back to.',\n    method: 'Mager\\u2019s ABCD format (Audience, Behavior, Condition, Degree) + Bloom\\u2019s revised taxonomy (Anderson &amp; Krathwohl, 2001)',\n    cols: ['#','Audience','Behavior (observable verb)','Condition','Degree (criterion)','Bloom level'],\n    example: [\n      ['1','Novice maintenance technician','Isolates the power supply','Using the lockout/tagout kit, no prompts','Under 90 s, zero missed steps','Apply'],\n      ['2','Novice maintenance technician','Identifies an unsafe isolation point','Given 4 candidate points in the scene','3 of 3 trials correct','Analyse'],\n    ],\n    notes: [\n      '<strong>Use verbs you can observe:<\u002Fstrong> identify, assemble, isolate, sequence, diagnose, calibrate, demonstrate.',\n      '<strong>Avoid verbs you cannot observe:<\u002Fstrong> understand, know, appreciate, be aware of, be familiar with \\u2014 these cannot be captured by G8 evaluation.',\n      'Every objective here becomes a row in the G8 evidence matrix. If you cannot imagine what data would prove it, rewrite it.',\n    ],\n  },\n  G2: {\n    title: 'Task Decomposition Table',\n    produces: 'A step-by-step map of the real task, checked by people who actually perform it.',\n    method: 'Hierarchical Task Analysis (Annett &amp; Duncan, 1967); decision points via Cognitive Task Analysis',\n    cols: ['Step','Action','Cue / trigger','Success criterion','Common error','Consequence if wrong','Validated?'],\n    example: [\n      ['1.1','Verify circuit is de-energised','Panel indicator off','Meter reads &lt; 1 V','Trusts indicator without meter','Live circuit, shock risk','Yes \\u2014 2 techs'],\n      ['1.2','Apply personal lock','Breaker in OFF position','Lock seated, key retained','Lock applied to wrong breaker','Another worker re-energises','Yes \\u2014 2 techs'],\n    ],\n    notes: [\n      'Fill this in <em>before<\u002Fem> modelling any 3D asset \\u2014 reviewers anchor on visuals and stop checking the logic.',\n      'The \"Validated?\" column is the point of the exercise. An unvalidated row is an assumption, not a requirement.',\n      '\"Common error\" and \"Consequence\" feed directly into G5 feedback and G6 functional consequences.',\n    ],\n  },\n  G3: {\n    title: 'Stage &amp; Scaffolding Plan',\n    produces: 'Named stages with explicit rules for advancing, and a plan for removing support.',\n    method: 'Cognitive Load Theory (Sweller, 1988); Zone of Proximal Development and fading (Vygotsky, 1978)',\n    cols: ['Stage','Sub-tasks included','Scaffolds ON','Scaffolds FADED','Advance rule','Regress rule'],\n    example: [\n      ['1. Practice','1.1 only','Step highlights, text prompts, no timer','\\u2014','1 clean run','\\u2014'],\n      ['2. Guided','1.1\\u20131.2','Text prompts on error only','Step highlights off','2 consecutive clean runs','2 consecutive failures \\u2192 Stage 1'],\n      ['3. Independent','Full sequence','None','All prompts off','3 consecutive clean runs','2 consecutive failures \\u2192 Stage 2'],\n      ['4. Final check','Full sequence + variation','None','\\u2014','Meets G1 criterion','\\u2014'],\n    ],\n    notes: [\n      'Keep advance/regress rules as adjustable settings, not hard-coded logic \\u2014 you will retune them after the first real cohort.',\n      'For novices, start at maximum scaffold and require a longer success streak. For experienced learners, start later in the sequence (expertise-reversal effect).',\n      'If you cannot state an advance rule as a number, it is not yet a rule.',\n    ],\n  },\n  G4: {\n    title: 'Gesture Mapping Table',\n    produces: 'An explicit mapping from each real action to its VR input, with tolerances.',\n    method: 'Embodied cognition (Varela, Thompson &amp; Rosch, 1991); motor schema theory (Schmidt, 1975)',\n    cols: ['Real action','Physical motion','VR input mapping','Proprioceptive match','Tolerance','Fallback if tracking fails'],\n    example: [\n      ['Turn valve','Grip + wrist rotation','Grip button held + controller roll axis','High','\\u00b115\\u00b0 per detent','Show ghost hand guide'],\n      ['Press E-stop','Flat palm strike','Palm collider, velocity &gt; 0.4 m/s','High','Any palm contact','Highlight target after 3 s'],\n      ['Read gauge','Head/eye movement','Head proximity + dwell','Medium','Dwell 0.8 s','Zoom affordance on approach'],\n    ],\n    notes: [\n      'Rate proprioceptive match honestly. Anything you rate Low is a candidate to redesign, whatever hardware you have.',\n      'Set tolerances from the <em>real task\\u2019s<\u002Fem> precision needs \\u2014 not from the engine default.',\n      'Never penalise the learner for tracking noise: the fallback column exists so noise is not scored as error.',\n    ],\n  },\n  G5: {\n    title: 'Feedback Design Matrix',\n    produces: 'Both feedback layers planned per event: what happens now, and what is reviewable later.',\n    method: 'Formative feedback timing (Shute, 2008); feed-back / feed-forward (Hattie &amp; Timperley, 2007)',\n    cols: ['Trigger event','Immediate cue','Latency','Goes in debrief report?','Maps to objective'],\n    example: [\n      ['Lock applied to wrong breaker','Red outline + short haptic pulse','&lt; 150 ms','Yes \\u2014 with correct breaker shown','Obj. 2'],\n      ['Meter step skipped','Amber prompt on tool','&lt; 150 ms','Yes \\u2014 step order timeline','Obj. 1'],\n      ['Sequence completed','Green confirmation + chime','Immediate','Yes \\u2014 time and error count','Obj. 1'],\n    ],\n    notes: [\n      'The last column is the check: a cue that maps to no objective is decoration \\u2014 cut it or fix the objective.',\n      'The debrief must survive the session. A message shown only inside the headset cannot be reflected on.',\n      'Immediate cues support performance; the debrief supports learning. You need both.',\n    ],\n  },\n  G6: {\n    title: 'Fidelity Decision Table',\n    produces: 'A deliberate, defensible split of effort between how things look and how they behave.',\n    method: 'Physical / functional / psychological fidelity distinction (simulation training literature); affordances (Gibson, 1979)',\n    cols: ['Element','Visual fidelity needed','Functional fidelity needed','Why (which objective?)','Build priority'],\n    example: [\n      ['Breaker panel','Medium \\u2014 must be recognisable','High \\u2014 correct states, resists wrong order','Obj. 1: sequence accuracy','1'],\n      ['Lockout padlock','Medium','High \\u2014 seats only on correct hasp','Obj. 2: correct isolation point','1'],\n      ['Background factory','Low','Low','Sets context only','4'],\n    ],\n    notes: [\n      'A row with High visual and Low functional is a warning sign \\u2014 it looks right and teaches the wrong thing.',\n      'The \"Why\" column forces the justification. If an element serves no objective, it is set dressing: deprioritise it.',\n      'Record the real physical parameters you are matching (mass, resistance, travel) so they can be checked against the actual equipment.',\n    ],\n  },\n  G7: {\n    title: 'Experience Target Sheet',\n    produces: 'The intended difficulty curve and target states, decided before content is built.',\n    method: 'Flow channel (Csikszentmihalyi, 1990); presence conditions (Slater, 1999); Self-Determination Theory (Deci &amp; Ryan, 1985)',\n    cols: ['Stage','Intended challenge','Expected learner skill','Target state','Design lever','Observable signal'],\n    example: [\n      ['1. Practice','Low','Low','Safe, oriented, willing to try','Full prompts, no timer, no penalty','Completes without asking for help'],\n      ['3. Independent','Medium\\u2013high','Medium','Absorbed, focused','Timer on, real consequences active','Time per attempt stabilises'],\n      ['4. Final check','High','High','Competent, in control','Scenario variation, no prompts','Voluntary retry rate &gt; 0'],\n    ],\n    notes: [\n      'Sketch this <em>before<\u002Fem> building content. Afterwards it becomes a survey, which is the gap this guideline addresses.',\n      'Watch time-per-attempt during sessions: too fast suggests boredom, too slow or rising suggests frustration \\u2014 both are cues to adjust.',\n      'Anchor motivation in real professional stakes: state the real-world consequence in the scenario briefing.',\n    ],\n  },\n  G8: {\n    title: 'Evidence Alignment Matrix',\n    produces: 'A row per objective proving what will be captured as evidence \\u2014 closing the loop back to G1.',\n    method: 'Evidence-Centred Design (Mislevy, Steinberg &amp; Almond, 2003); constructive alignment (Biggs, 2003)',\n    cols: ['Objective (from G1)','Competency claim','Observable evidence','Data captured in VR','Pass threshold'],\n    example: [\n      ['Obj. 1','Can isolate power safely and in order','Correct step sequence, no omissions','Step order array, timestamps, error type','100% sequence, &lt; 90 s'],\n      ['Obj. 2','Can identify the correct isolation point','Selects correct breaker first attempt','Selection ID, attempt count','3 of 3 trials'],\n    ],\n    notes: [\n      'Start from the G1 objectives, not from what the engine happens to log \\u2014 that reversal is exactly the gap this guideline names.',\n      'If a metric fits no row here, it adds analysis cost without evidentiary value. Cut it.',\n      'Record error <em>type<\u002Fem> (omission, wrong order, imprecision), not just pass/fail \\u2014 only type tells you what to fix.',\n    ],\n  },\n};\n\nconst NEXT_STEPS = {\n  G1: 'Write down what learners should be able to do, in observable terms, before designing anything else.',\n  G2: 'Book 30 minutes with two people who actually do this job and walk them through your task steps.',\n  G3: 'Split the experience into named stages with a clear rule for moving between them.',\n  G4: 'Rework the key interaction so the gesture physically resembles the real motion.',\n  G5: 'Combine visual, audio, and haptic feedback for the same event, and add a post-session summary the learner can reopen after taking the headset off.',\n  G6: 'Move effort from visual polish to correct behaviour, physics, and consequences.',\n  G7: 'Sketch the intended difficulty curve before building content, and track pace during sessions.',\n  G8: 'Pick each learning goal and name the one thing you will observe as proof it was met.',\n};\n\nconst ICON_COLORS = {\n  G1:{bg:'#DCE7F5',fg:'#1B4C8C'}, G2:{bg:'#EAF3DE',fg:'#1C4A22'},\n  G3:{bg:'#EAF3DE',fg:'#1C4A22'}, G4:{bg:'#FBEBD3',fg:'#7A4300'},\n  G5:{bg:'#FBEBD3',fg:'#7A4300'}, G6:{bg:'#EAF3DE',fg:'#1C4A22'},\n  G7:{bg:'#EAF3DE',fg:'#1C4A22'}, G8:{bg:'#DCE7F5',fg:'#1B4C8C'},\n};\n\nconst GAP = {\n  G1:{pct:85,n:'17/20'}, G2:{pct:90,n:'18/20*'}, G3:{pct:70,n:'14/20'},\n  G4:{pct:55,n:'11/20'}, G5:{pct:45,n:'9/20'},  G6:{pct:60,n:'12/20'},\n  G7:{pct:65,n:'13/20'}, G8:{pct:50,n:'10/20'},\n};\n\n// ── QUESTIONNAIRE ──────────────────────────────────────────────\n// Two kinds of fields:\n//  \"profile\"    — shapes HOW a prescription is phrased (domain, complexity, etc.)\n//  \"diagnostic\" — directly probes whether the SAM-identified corpus gap is\n//                 present in the user's own plan (yes/no). These drive both\n//                 the priority score and the \"flagged\" state per guideline.\nconst STEPS = [\n  {title:'Step 1 — Training framing', sub:'Context and pedagogical declaration (G1)', fields:[\n    {id:'domain', kind:'profile', label:'Application domain', hint:'Primary professional field', options:[\n      {val:'clinical',name:'Clinical',desc:'Surgery, diagnosis, medical emergencies'},\n      {val:'industrial',name:'Industrial',desc:'Maintenance, safety, manufacturing'},\n      {val:'educational',name:'Educational',desc:'Technical training, laboratories'},\n      {val:'emergency',name:'Emergency response',desc:'Disaster response, evacuation'},\n      {val:'other',name:'Another field',desc:'Aviation, defence, retail, services…'},\n    ]},\n    {id:'skillType', kind:'profile', label:'Skill acquisition model', hint:'Which best describes the skill being trained? (e.g. a checklist you follow vs. a tool you operate by feel)', options:[\n      {val:'procedural',name:'Procedural',desc:'Defined sequences, performance criteria \\u2014 e.g. shutting down a machine in a fixed order'},\n      {val:'perceptual',name:'Perceptual-motor',desc:'Physical skills, hand-eye coordination \\u2014 e.g. suturing, welding, precise tool handling'},\n      {val:'decision',name:'Decision-making',desc:'Critical thinking, strategic choices \\u2014 e.g. triage, diagnosing a fault before acting'},\n      {val:'mixed',name:'Mixed',desc:'A combination of the above \\u2014 true of most real-world tasks'},\n    ]},\n    {id:'objectivesDeclared', kind:'diagnostic', guideline:'G1', label:'Learning objectives declared', cols:2,\n      hint:'Have explicit, observable learning objectives been written down for this training?',\n      evidence:'Write down what the learner should be able to do before deciding on any technology — without it, there is no way to check afterward whether the training actually worked.',\n      options:[\n        {val:'yes',name:'Yes',desc:'Objectives are documented as observable behaviours'},\n        {val:'no',name:'No',desc:'Objectives exist only informally, or not at all'},\n      ]},\n  ]},\n  {title:'Step 2 — Task foundation', sub:'Task grounding in real professional practice (G2)', fields:[\n    {id:'expertise', kind:'profile', label:'Learner expertise level', hint:\"Target user's current skill level\", cols:3, options:[\n      {val:'novice',name:'Novice',desc:'New to the task. Little or no on-the-job practice yet'},\n      {val:'intermediate',name:'Intermediate',desc:'Performs the task, but still with supervision or checklists'},\n      {val:'expert',name:'Expert',desc:'Performs it independently. Refining it or teaching others'},\n      {val:'mixed',name:'Mixed group',desc:'Learners range from novice to experienced'},\n    ]},\n    {id:'taskType', kind:'profile', label:'Task type', hint:'Which best describes the dominant character of the task, even if it has more than one element?', options:[\n      {val:'sequential',name:'Sequential',desc:'A checklist that must be followed in a fixed order'},\n      {val:'decision',name:'Decision-making',desc:'Diagnosing a situation or choosing between options before acting'},\n      {val:'manipulative',name:'Manipulative',desc:'Assembling, adjusting, or operating equipment by hand'},\n    ]},\n    {id:'taskValidated', kind:'diagnostic', guideline:'G2', label:'Task validated with practitioners', cols:2,\n      hint:'Has the task structure been checked against real professional practice by domain experts?',\n      evidence:'Validate the task sequence with real practitioners, not documentation alone — copying how a task looks without checking its logic is how training ends up teaching the wrong thing, convincingly.',\n      options:[\n        {val:'yes',name:'Yes',desc:'Practitioners reviewed and validated the task structure'},\n        {val:'no',name:'No',desc:'Task is designed from documentation or assumption only'},\n      ]},\n  ]},\n  {title:'Step 3 — Temporal progression', sub:'Scaffolding and session structure (G3)', fields:[\n    {id:'complexity', kind:'profile', label:'Cognitive complexity', hint:'How much does the learner need to track and decide at once?', cols:3, options:[\n      {val:'low',name:'Low',desc:'A single action repeated the same way each time'},\n      {val:'medium',name:'Medium',desc:'Several steps where the order can change depending on conditions'},\n      {val:'high',name:'High',desc:'Monitoring multiple things while making time-pressured decisions'},\n    ]},\n    {id:'sessionStructure', kind:'diagnostic', guideline:'G3', label:'Session structure', cols:2,\n      hint:'Is the training planned as a single static exposure, or structured across multiple sessions with increasing difficulty?',\n      evidence:'Introduce difficulty gradually, across stages — a single static exposure leaves pacing entirely up to whoever happens to be supervising.',\n      options:[\n        {val:'multi',name:'Progressive stages',desc:'Multiple sessions with a designed difficulty gradient'},\n        {val:'single',name:'Single session',desc:'One static exposure, no built-in progression'},\n      ]},\n  ]},\n  {title:'Step 4 — Embodied interaction and feedback', sub:'Gesture correspondence and multimodal feedback design (G4, G5)', fields:[\n    {id:'interactionHW', kind:'profile', label:'Interaction hardware', hint:'Primary input method planned', options:[\n      {val:'controllers',name:'Standard controllers',desc:'Button-mapped handheld controllers'},\n      {val:'handtracking',name:'Hand tracking',desc:'Bare-hand gesture recognition'},\n      {val:'haptic',name:'Haptic devices',desc:'Force-feedback or wearable haptics'},\n      {val:'undecided',name:'Not decided yet',desc:'Advice will stay hardware-neutral'},\n    ]},\n    {id:'gestureCorrespondence', kind:'diagnostic', guideline:'G4', label:'Gesture correspondence', cols:2,\n      hint:'Are in-VR gestures designed to physically resemble the real-world action (e.g. an actual turning motion), or mapped to a generic button press regardless of hardware?',\n      evidence:'Design the gesture to physically resemble the real-world action, not a generic button press — the gesture itself is how motor memory forms; a button press builds no transferable skill.',\n      options:[\n        {val:'yes',name:'Direct correspondence',desc:'Gesture physically mirrors the real action'},\n        {val:'no',name:'Abstracted / generic',desc:'Mapped to a generic button or trigger'},\n      ]},\n    {id:'feedbackChannels', kind:'diagnostic', guideline:'G5', label:'Feedback channels', cols:2,\n      hint:'Is in-task feedback for an action or error planned to combine more than one channel — visual, audio, and, where possible, haptic — or limited to a single channel such as on-screen text?',\n      evidence:'Combine more than one feedback channel — visual, audio, and haptic together — a single channel, especially text, is easy to miss inside an immersive environment.',\n      options:[\n        {val:'yes',name:'Multiple channels',desc:'Visual, audio, and/or haptic combined for the same event'},\n        {val:'no',name:'Single channel',desc:'Feedback relies on one channel only, typically text'},\n      ]},\n    {id:'debriefPlanned', kind:'diagnostic', guideline:'G5', label:'Post-task debrief', cols:2,\n      hint:'Beyond immediate in-task feedback, is a structured, revisitable report planned after each session?',\n      evidence:'Plan a structured debrief the learner can revisit after the session, not just an in-the-moment alert — feedback that disappears the moment the headset comes off cannot be reflected on.',\n      options:[\n        {val:'yes',name:'Yes',desc:'A structured, accessible debrief report is planned'},\n        {val:'no',name:'No',desc:'Only immediate in-task feedback is planned'},\n      ]},\n  ]},\n  {title:'Step 5 — Context realism and experience design', sub:'Functional realism and proactive experience targets (G6, G7)', fields:[\n    {id:'realismPriority', kind:'diagnostic', guideline:'G6', label:'Realism priority', cols:2,\n      hint:'When these two compete for design effort, which is the priority?',\n      evidence:'Prioritise correct behaviour over visual polish — a beautifully rendered valve that turns with no resistance teaches the wrong physical expectation.',\n      options:[\n        {val:'functional',name:'Realistic behaviour',desc:'Equipment that responds correctly when used or misused'},\n        {val:'visual',name:'Realistic appearance',desc:'A photorealistic, detailed setting'},\n        {val:'partial',name:'Both at the same pace',desc:'Behaviour and appearance get equal effort'},\n      ]},\n    {id:'immersion', kind:'profile', label:'Overall immersion level', hint:'Degree of environment fidelity', options:[\n      {val:'low',name:'Low',desc:'Desktop or seated view. The learner mostly watches and selects.'},\n      {val:'medium',name:'Medium',desc:'Headset. The learner moves and handles the key objects.'},\n      {val:'high',name:'High',desc:'Room-scale. Objects respond like the real ones: weight, resistance, consequences.'},\n      {val:'undecided',name:'Not decided yet',desc:'Advice will stay neutral on immersion'},\n    ]},\n    {id:'experienceProactive', kind:'diagnostic', guideline:'G7', label:'Challenge and pacing designed up front', cols:2,\n      hint:'Are presence, flow, and motivation designed in from the start — for example, adjusting pacing or difficulty in real time to keep the learner challenged but not overwhelmed — or only checked afterward with a survey?',\n      evidence:'Design for engagement and flow as an explicit target from the start — measuring it only afterward means there is nothing left to do about it.',\n      options:[\n        {val:'yes',name:'Yes, planned',desc:'Pacing and difficulty are design targets'},\n        {val:'no',name:'Checked afterward only',desc:'Engagement is measured with a post-session survey'},\n      ]},\n  ]},\n  {title:'Step 6 — Evaluation articulation', sub:'The central Cycle 1 finding: design–evaluation coupling (G8)', fields:[\n    {id:'evalDesign', kind:'diagnostic', guideline:'G8', label:'Evaluation–objective link', cols:3,\n      hint:'Does each planned metric trace back to a learning objective, are metrics defined on their own, or is evaluation not planned yet?',\n      evidence:'Every evaluation metric should trace back to a specific learning objective — otherwise you end up measuring something, but not necessarily what you meant to teach.',\n      options:[\n        {val:'linked',name:'Explicitly linked',desc:'Each metric maps to a specific objective declared at the start'},\n        {val:'independent',name:'Defined separately',desc:'Metrics exist, but are not tied back to the stated objectives'},\n        {val:'none',name:'Not planned yet',desc:'A perfectly normal place to be this early \\u2014 evaluation just hasn\\u2019t been decided on yet'},\n      ]},\n  ]},\n];\nconst LBL = {\n  domain:{clinical:'clinical',industrial:'industrial',educational:'educational',emergency:'emergency response',other:'professional'},\n  skillType:{procedural:'procedural',perceptual:'perceptual-motor',decision:'decision-making',mixed:'mixed'},\n  taskType:{sequential:'sequential',decision:'decision-making',manipulative:'hands-on'},\n  expertise:{novice:'novice',intermediate:'intermediate',expert:'expert',mixed:'mixed-level'},\n  interactionHW:{controllers:'standard controllers',handtracking:'hand tracking',haptic:'haptic devices',undecided:'hardware not decided'},\n};\n\n// ── Training-profile synthesis: what the domain + skill model combination\n// means for this project, stated up front — before the guideline-by-guideline\n// detail below. Reuses the same reasoning already grounding G1/G4/G6/G8. ──\nconst DOMAIN_FRAME = {\n  other: 'Outside the four reviewed domains, the same logic holds: objectives, realism and evaluation should trace back to the standard your field already uses to judge competence.',\n  clinical: 'Clinical training carries real consequences for patient safety, so objectives, realism, and evaluation should all trace back to standards clinical educators already trust — not criteria invented just for this VR experience. In practice, that means grounding your objectives in a real competency framework (G1), prioritising anatomical and physiological correctness over visual polish (G6), and making sure your evidence would be legible to a clinical educator, not just internally consistent (G8).',\n  industrial: 'Industrial training usually sits inside a safety or quality compliance system, so the strongest version of this project ties every design decision back to the certification or standard the task is actually regulated by. In practice, that means writing objectives that read like a line from that standard (G1), matching real mechanical behaviour rather than just appearance (G6), and building evidence that would satisfy an actual safety audit (G8).',\n  educational: 'Educational training serves a curriculum or learning progression beyond this one experience, so it\\u2019s worth anchoring objectives and evaluation to the standard this lesson is meant to support, not just this VR session in isolation. In practice, that means aligning your objectives with a real curriculum standard (G1), keeping the underlying phenomenon accurate even if the visual style is simplified (G6), and deciding early whether your evaluation is formative or summative (G8).',\n  emergency: 'Emergency response training lives or dies on decisions made correctly under time pressure, so timing needs to be treated as part of what\\u2019s being trained and evaluated — not an afterthought. In practice, that means naming the time threshold that defines competent performance in your objectives (G1), making the scenario\\u2019s consequences unfold with real urgency (G6), and evaluating whether the right action was taken in time, not just whether it was eventually correct (G8).',\n};\nconst SKILL_FRAME = {\n  procedural: 'Because the skill itself is a defined sequence, sequence and completeness should be the throughline across objectives, interaction, and evaluation — not just the visual scene. In practice, that means writing the objective as the exact sequence and its completion criteria (G1), giving the interaction a clear per-step check rather than judging the whole sequence at the end (G4), and tracking the type of mistake, not just pass/fail (G8).',\n  perceptual: 'Because this is a hands-on, perceptual-motor skill, physical fidelity carries more weight here than in most training — it deserves disproportionate design attention relative to the other guidelines. In practice, that means attaching a measurable tolerance to the objective itself (G1), treating gesture fidelity as close to the actual skill being trained (G4), and evaluating against that same numeric tolerance (G8).',\n  decision: 'Because this is a decision-making skill, the reasoning path matters as much as the final choice — objectives and evaluation should be able to tell a defensible decision from a lucky one. In practice, that means defining what makes a choice defensible, not just naming the correct one (G1), giving the physical action that executes a decision the same interaction care as any other guideline (G4), and recording the reasoning path alongside the outcome (G8).',\n  mixed: 'Because this task mixes procedural and decision-making elements, it\\u2019s worth treating them as genuinely separate threads throughout, rather than blending them into one vague goal. In practice, that means writing separate objectives for each component (G1), deciding which parts of the interaction need gesture fidelity and which need consequence design (G4), and keeping procedural compliance and decision quality as separate lines of evidence (G8).',\n};\nconst TASK_FRAME = {\n  sequential: 'Because the task is a fixed sequence, completeness and order should be the core success criteria throughout \\u2014 a learner who does the right things in the wrong order should not pass. In practice, that means giving each step its own clear check (G2), rather than judging the whole sequence only at the end.',\n  decision: 'Because the task itself is decision-making, the task structure should capture real consequences for each choice, not just branch visually. In practice, that means giving each decision point a consequence the learner actually experiences (G2), not just a cosmetic fork in the story.',\n  manipulative: 'Because the task is hands-on, how much precision it demands should come directly from what the real tool or equipment requires \\u2014 not an assumption. In practice, that means calibrating the precision threshold in the task structure to match the real equipment (G2), not a generic default.',\n};\n// Compact one-line headline per option \\u2014 shown on the synthesis card face.\n// The full paragraph above stays available behind \"See the full reasoning\".\nconst DOMAIN_HEAD = {\n  other: 'Tie objectives, realism and evidence to your field’s own standard.',\n  clinical: 'Trace objectives, realism & evidence to trusted clinical standards.',\n  industrial: 'Tie every decision to the real safety or quality standard.',\n  educational: 'Anchor objectives & evaluation to the curriculum this lesson serves.',\n  emergency: 'Treat timing as part of what\\u2019s trained and measured.',\n};\nconst SKILL_HEAD = {\n  procedural: 'Sequence and completeness should run through everything.',\n  perceptual: 'Physical fidelity deserves outsized design attention here.',\n  decision: 'The reasoning path matters as much as the final choice.',\n  mixed: 'Keep the procedural and decision threads genuinely separate.',\n};\nconst TASK_HEAD = {\n  sequential: 'Order and completeness are the core success criteria.',\n  decision: 'Give each decision point a real, experienced consequence.',\n  manipulative: 'Calibrate precision to what the real equipment demands.',\n};\nconst CAT_ICONS = {\n  domain: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21c-4-4-7-7.5-7-11a7 7 0 0 1 14 0c0 3.5-3 7-7 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/><\u002Fsvg>',\n  skill: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2L4 14h6l-1 8 9-12h-6l1-8z\"/><\u002Fsvg>',\n  task: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><path d=\"M4 6l1 1 2-2\"/><path d=\"M4 12l1 1 2-2\"/><path d=\"M4 18l1 1 2-2\"/><\u002Fsvg>',\n};\nconst DOMAIN_GUIDELINES = ['G1','G6','G8'], SKILL_GUIDELINES = ['G1','G4','G8'], TASK_GUIDELINES = ['G2'];\n// Small labelled tag baked into a context tip, so the card can visually\n// distinguish \"this note is about your domain\" from \"this note is about\n// your skill type\" at a glance.\nfunction tagTip(label, text){ return `<span class=\"g-tag\">${label}<\u002Fspan>${text}`; }\n\n// ── GUIDELINES — prescription (stable) + action (context + diagnostic aware) ──\nconst GUIDELINES = {\n  G1:{name:'Pedagogical Framing',type:'Criterion',\n    theory:'Constructive Alignment (Biggs, 2003); Experiential Learning (Kolb, 1984)',\n    exemplar:{study:'Teichmann (2025)', note:'one of the few corpus studies that derives use cases and learning targets from real-world processes before any component design begins'},\n    prescription:'Before any component design decision, declare the skill acquisition model, learning objectives as observable behaviours, learner profile, and technology mediation requirements.',\n    action:(a)=>{let p=[];\n      if(a.objectivesDeclared==='no'){p.push('⚑ Before designing anything, write down three things in one place: how people will learn this skill (step-by-step practice? decision-making? hands-on movement?), what success looks like in plain, observable terms — \"correctly closes the valve within 90 seconds\", not \"understands valve safety\" — and who your learner is (experience level, prior VR exposure, any access needs). Keep this as a single shared reference that guides every other decision, instead of everyone building from their own assumptions.');}\n      else{p.push('Objectives are written down — good. Keep them specific and observable (not just topics), so the progression stages and the evaluation later on can point back to the exact same goals instead of drifting apart.');}\n      const domainTips = {\n        clinical: 'In clinical training, ground objectives in an established competency framework \\u2014 an OSCE checklist or a procedural certification standard \\u2014 rather than inventing criteria from scratch.',\n        industrial: 'In industrial training, tie objectives to the safety certification or quality standard the task is regulated by \\u2014 the objective should read like a line from that standard, not a paraphrase of it.',\n        educational: 'In educational training, align objectives with the curriculum standard or grade-level expectation this lesson serves, not just the VR experience\\u2019s own internal logic.',\n        emergency: 'In emergency response training, objectives should name the protocol step and the time threshold that defines competent performance \\u2014 not just \\u201cknows the protocol.\\u201d',\n      };\n      const skillTips = {\n        procedural: 'For procedural skills, write the objective as the exact sequence and its completion criteria \\u2014 \\u201cperforms steps 1\\u20135 in order, zero omissions\\u201d \\u2014 since the sequence itself is what\\u2019s being assessed.',\n        perceptual: 'For perceptual-motor skills, the objective needs a measurable tolerance \\u2014 \\u201cwithin 2mm, three consecutive attempts\\u201d \\u2014 not just \\u201ccan perform the motion.\\u201d',\n        decision: 'For decision-making skills, define what makes a choice defensible, not just which one is \\u201ccorrect\\u201d \\u2014 real judgment tasks often have more than one acceptable path.',\n        mixed: 'For mixed-skill tasks, write separate objectives for each component (the procedure vs. the judgment call) \\u2014 one blended objective is usually too vague to assess either part well.',\n      };\n      if(domainTips[a.domain]) p.push(tagTip('DOMAIN', domainTips[a.domain]));\n      if(skillTips[a.skillType]) p.push(tagTip('SKILL TYPE', skillTips[a.skillType]));\n      return p;}},\n  G2:{name:'Task-Centered Structure',type:'Principle',\n    theory:'Situated Learning (Lave & Wenger, 1991); Activity Theory (Engeström, 1987)',\n    exemplar:{study:'Moore et al. (2020)', note:'validated task structure through 10 clinician interviews before system design began'},\n    prescription:'Derive task structure and success/failure criteria from professional practice analysis validated with domain experts — not a superficial visual translation.',\n    action:(a)=>{let p=[];\n      if(a.taskValidated==='no'){p.push('⚑ Before designing any scene, map out the task step by step: what the learner does at each stage, what counts as doing it correctly, what a mistake looks like, and roughly how long each step should take. Walk through this map with two or three people who actually do this job — not with a working prototype, since by then people react to how it looks rather than whether the logic is right.');}\n      else{p.push('Practitioner input is in place — keep a dated version of this task map so later changes can be compared against what was validated, and so the interaction and evaluation design can stay anchored to the same steps.');}\n      if(a.taskType==='sequential')p.push('For step-by-step tasks: give each step its own clear pass/fail check, rather than judging the whole sequence at the end.');\n      if(a.taskType==='decision')p.push('For decision-based tasks: give each choice a real consequence shown to the learner, not just a visual branch in the story.');\n      if(a.taskType==='manipulative')p.push('For hands-on tasks: decide how much precision each step really needs, matched to what the real tool or equipment requires.');\n      return p;}},\n  G3:{name:'Temporal Progression',type:'Principle',\n    theory:'Cognitive Load Theory (Sweller, 1988); Zone of Proximal Development (Vygotsky, 1978)',\n    exemplar:{study:'Holmer et al. (2024)', note:'demonstrates explicit CLT-based staging in a virtual physics laboratory'},\n    prescription:'Structure the experience into progressive microcycles with explicit cognitive load gradient, scaffolding fading logic, and transfer readiness thresholds.',\n    action:(a)=>{let p=[];\n      if(a.sessionStructure==='single'){p.push('⚑ Design the experience as a set of clearly named stages — for example, Practice, Guided, Independent, Final Check — each with a simple rule for moving forward (three good attempts in a row) or repeating a stage. Keep these rules as settings you can adjust, rather than baking them permanently into the scene, so you can fine-tune pacing later without starting over.');}\n      else{p.push('Progressive stages are planned — make the criteria for moving between them measurable and recorded (not just a feeling), so the pacing can be checked and improved after real use.');}\n      if(a.expertise==='novice')p.push('For novice learners: start with maximum support (all hints on, fewer distractions) and ask for a longer streak of success before advancing.');\n      if(a.complexity==='high')p.push('For high-complexity tasks: break the task itself into smaller pieces across stages, rather than keeping it whole and only changing the difficulty.');\n      return p;}},\n  G4:{name:'Embodied Interaction',type:'Criterion',\n    theory:'Embodied Cognition (Varela et al., 1991); Motor Schema Theory (Schmidt, 1975)',\n    exemplar:{study:'Omar et al. (2024)', note:'explicitly adapted Nielsen\\u2019s heuristics for metaverse/HMD interaction rather than applying generic desktop criteria'},\n    prescription:'Specify HMD-specific interaction criteria where gestures have physical and proprioceptive correspondence with the real-world task.',\n    action:(a)=>{let p=[];\n      if(a.gestureCorrespondence==='no'){p.push('⚑ Make the VR gesture feel like the real motion, not a shortcut. If the real task involves turning a valve, the learner should turn their hand or controller — not just pull a trigger. Watch someone who actually does this job perform the motion, then check that your VR version asks for a similar physical movement.');}\n      else{p.push('Gestures already mirror the real motion — good. Now decide how forgiving the system should be about small variations in movement, based on how much precision the real task actually calls for.');}\n      if(a.interactionHW==='controllers')p.push('With standard controllers: tie the trigger or grip pressure to the strength of the in-world action, rather than treating it as a simple on/off press.');\n      if(a.interactionHW==='handtracking')p.push('With hand tracking: build in some tolerance for tracking noise, so a shaky hand isn\\u2019t mistaken for a mistake.');\n      const skillTips4 = {\n        procedural: 'For procedural skills, prioritise correct sequence and completeness of the gesture over fine precision \\u2014 missing or reordering a step matters more here than exact hand trajectory.',\n        perceptual: 'For perceptual-motor skills, gesture fidelity is the training itself \\u2014 an approximate movement teaches an approximate skill. This is worth disproportionate design effort relative to the other guidelines.',\n        decision: 'For decision-making skills, the decision itself doesn\\u2019t need a \\u201cgesture\\u201d \\u2014 but once a choice is made, the action that executes it should still follow this guideline. Don\\u2019t let interaction fidelity slide just because the task is framed as cognitive.',\n        mixed: 'For mixed-skill tasks, identify which parts are perceptual-motor (invest in gesture fidelity there) and which are decision points (invest in consequence, not gesture).',\n      };\n      if(skillTips4[a.skillType]) p.push(tagTip('SKILL TYPE', skillTips4[a.skillType]));\n      return p;}},\n  G5:{name:'Multimodal Feedback',type:'Principle',\n    theory:'Operant Conditioning (Skinner, 1953); Metacognitive Reflection (Schön, 1983)',\n    exemplar:{study:'Burova et al. (2022)', note:'implemented three designed feedback channels (visual, haptic, verbal) as a unified pedagogical mechanism'},\n    prescription:'Design a dual-level feedback system: immediate multimodal sensory feedback, plus structured post-task debriefing for schema reflection.',\n    action:(a)=>{let p=[];\n      if(a.debriefPlanned==='no'){p.push('⚑ Give two kinds of feedback: something immediate the moment a mistake happens — a visual cue, a short vibration, a sound — and a clear summary afterward that the learner can look back on: what happened, what was expected, and where things went differently. Make sure that summary is still available once the headset comes off; a message that only appears inside VR and then disappears doesn\\u2019t help anyone reflect.');}\n      else{p.push('A debrief summary is planned — make sure it\\u2019s easy to find afterward (emailed, or on a simple dashboard); a report only visible inside the headset is hard for most people to actually use.');}\n      if(a.immersion==='high')p.push('At high immersion levels, combine all three immediate signals together (see it, feel it, hear it) — this helps errors register even when the learner is focused elsewhere in the scene.');\n      return p;}},\n  G6:{name:'Contextual Functional Realism',type:'Principle',\n    theory:'Affordance Theory (Gibson, 1979); Ecological Validity (Lave & Wenger, 1991)',\n    exemplar:{study:'García Fracaro et al. (2021)', note:'prioritised functional realism (correct process logic) over visual fidelity in chemical industry VR training'},\n    prescription:'Prioritise functional realism — logical rules, physical constraints, consequences — over visual fidelity.',\n    action:(a)=>{let p=[];\n      if(a.realismPriority==='visual'){p.push('⚑ Spend your early effort making things behave correctly before making them look beautiful. A valve that looks realistic but doesn\\u2019t resist turning, or a tool that doesn\\u2019t respond the way it should, teaches the wrong lesson even if it looks great. Get the logic and consequences right first; polish the visuals once the behaviour is solid.');}\n      else{p.push('Correct behaviour is already the priority — good. Write down the specific real-world details you\\u2019re matching (weight, resistance, friction) so they can be checked against the real equipment, not just judged by feel during testing.');}\n      p.push('When someone makes a mistake, show the real consequence happening in the scene itself — not just a warning message on screen.');\n      const domainTips6 = {\n        clinical: 'In clinical training, functional realism means anatomically correct landmarks and physiologically plausible responses — bleeding, resistance, vital signs reacting to actions — not photorealistic skin texture.',\n        industrial: 'In industrial training, functional realism means the equipment behaves mechanically as it would in reality — the right resistance, the right failure mode when misused — not a shinier render of the machine.',\n        educational: 'In educational training, functional realism is about whether the underlying phenomenon — the physics, the reaction, the process — behaves correctly, even if the visual style is simplified for the learner\\u2019s level.',\n        emergency: 'In emergency response training, functional realism means the scenario\\u2019s consequences unfold correctly under pressure — fire spreads the way real fire spreads — not just visual intensity.',\n      };\n      if(domainTips6[a.domain]) p.push(tagTip('DOMAIN', domainTips6[a.domain]));\n      p.push('Expect pushback here: clients often equate \"looks real\" with \"teaches well,\" even when the evidence says otherwise. Rather than arguing the theory, show them \\u2014 a quick side-by-side of a functionally-correct-but-simpler asset next to a polished-but-wrong one usually settles it faster than citing a source.');\n      return p;}},\n  G7:{name:'Proactive Experiential Design',type:'Principle',\n    theory:'Flow Theory (Csikszentmihalyi, 1990); Self-Determination Theory (Deci & Ryan, 1985)',\n    exemplar:{study:'Pizzolante et al. (2023)', note:'designed and validated presence/awe conditions as explicit targets, not just post-hoc measurements'},\n    prescription:'Map and induce specific experiential targets as explicit design parameters, not as emergent outcomes measured post-hoc.',\n    action:(a)=>{let p=[];\n      if(a.experienceProactive==='no'){p.push('⚑ Before building content, sketch out how the challenge should feel over the session — starting manageable, then gradually asking more as the learner\\u2019s skill grows, so they stay engaged without feeling bored or overwhelmed. While people are training, watch how long each attempt takes; if it swings too far in either direction, that\\u2019s your cue to adjust difficulty in the moment, rather than waiting for a survey afterward.');}\n      else{p.push('This is already planned for — good. Keep track of a few simple signals (how engaged people seem, whether they retry voluntarily) so you can check later whether the experience is landing the way you intended.');}\n      p.push(`Frame the scenario around real ${LBL.domain[a.domain]||'professional'} stakes from the start — people engage more when the \"why this matters\" is concrete, not abstract.`);\n      p.push('Watch the session\\u2019s total length, not just its difficulty curve: attention and retention drop once a session runs long, especially in stretches where the learner is only watching rather than doing. If a passage feels like a cutscene, it\\u2019s a candidate to shorten or cut, not just a bandwidth cost.');\n      return p;}},\n  G8:{name:'Constructive Evaluation Articulation',type:'Criterion',\n    theory:'Evidence-Centered Design (Mislevy, 2003); Constructive Alignment (Biggs, 2003)',\n    exemplar:{study:'Haj-Bolouri et al. (2024)', note:'one of only 4 corpus studies (of 20) with evaluation criteria explicitly derived from design decisions'},\n    prescription:'Solder every evaluation metric to the training components from the framing phase (G1) — traceable to a specific competence claim.',\n    action:(a)=>{let p=[];\n      if(a.evalDesign==='none'){p.push('⚑ For every learning goal you wrote down in Step 1, decide what you\\u2019ll actually observe and record as proof the learner achieved it. Every piece of data you collect — a completion time, a mistake, a decision made — should clearly connect back to one of those goals; if you can\\u2019t say which goal it\\u2019s evidence for, it\\u2019s probably not worth collecting.');}\n      else if(a.evalDesign==='independent'){p.push('⚑ You already have metrics, but they\\u2019re not yet tied to specific goals — go back through your list and connect each one to a learning goal from Step 1. Anything that can\\u2019t be connected is adding noise without telling you whether learning actually happened.');}\n      else{p.push('Evaluation is planned and clearly tied to your learning goals — this is the target state. Keep that connection documented and up to date as the training evolves, so the two don\\u2019t drift apart.');}\n      if(a.skillType==='procedural')p.push(tagTip('SKILL TYPE', 'For procedural skills: track not just pass/fail but the type of mistake (skipped a step, wrong order, imprecise action) — this makes it much easier to know what to fix.'));\n      if(a.skillType==='decision')p.push(tagTip('SKILL TYPE', 'For decision-making skills: record the path the learner chose alongside the best possible path, so you can assess judgment quality, not just the final outcome.'));\n      if(a.skillType==='perceptual')p.push(tagTip('SKILL TYPE', 'For perceptual-motor skills: attach a numeric tolerance to your evidence — not just \"did it correctly\" but \"within what margin\" — otherwise two very different performances both count as a pass.'));\n      if(a.skillType==='mixed')p.push(tagTip('SKILL TYPE', 'For mixed-skill tasks: keep procedural compliance and decision quality as separate lines of evidence — collapsing them into one score hides which part of the skill actually needs more training.'));\n      const domainTips8 = {\n        clinical: 'In clinical training, map your evidence to a recognised competency framework already used in the field — an OSCE checklist or Miller\\u2019s pyramid level — so your evaluation is legible to clinical educators, not just internally consistent.',\n        industrial: 'In industrial training, your evidence should double as what a safety auditor or supervisor would need to sign off competency — if it wouldn\\u2019t satisfy a real certification, it isn\\u2019t specific enough yet.',\n        educational: 'In educational training, decide early whether this is formative (informs teaching) or summative (counts toward a grade) — the same interaction can produce very different evidence requirements depending on which one it\\u2019s for.',\n        emergency: 'In emergency response training, evaluate both whether the right action was taken and whether it was taken within the time window that matters in reality — a correct action taken too late is still a failure here.',\n      };\n      if(domainTips8[a.domain]) p.push(tagTip('DOMAIN', domainTips8[a.domain]));\n      p.push('Learning-outcome evidence is only half the picture — pair it with a standard instrument for the experience itself (the IPQ for presence, the IEQ, or a SUS-style usability score). Decisions you made earlier in this tool, like realism or feedback channels, are exactly what these instruments end up measuring after the fact.');\n      return p;}},\n};\n\n/**\n * priorityScore — diagnostic answers dominate the score (they detect whether\n * THIS user's plan matches a known corpus gap). Profile answers provide a\n * smaller contextual adjustment on top of the base corpus prevalence.\n */\n// All 8 guidelines now share the identical diagnostic logic — each is\n// flagged directly from its own dedicated SAM-evidenced question, with no\n// guideline inferred indirectly from another guideline's profile variables.\n// Traces each flag back to the specific answer that triggered it — makes the\n// diagnosis scrutable rather than a black box (explainable-recommendation practice).\nfunction whyFlagged(a, id){\n  const bad = {objectivesDeclared:['no'],taskValidated:['no'],sessionStructure:['single'],gestureCorrespondence:['no'],feedbackChannels:['no'],debriefPlanned:['no'],realismPriority:['visual'],experienceProactive:['no'],evalDesign:['none','independent']};\n  const hard = k => bad[k].includes(a[k]), soft = k => a[k]==='partial' || a[k]==='unsure';\n  const F = (G_FIELDS[id]||[]).find(hard) || (G_FIELDS[id]||[]).find(soft);\n  if(!F) return false;\n  return [adaptQ(F, a).q, ansName(F, a), F];\n  return t || null;\n}\n\nconst SOFT_KEYS = ['objectivesDeclared','taskValidated','gestureCorrespondence','feedbackChannels','debriefPlanned','experienceProactive'];\n// Maps \"partly\" / \"not sure\" onto the original binary instrument, so every\n// flag and every piece of advice still comes from the validated yes/no logic.\nfunction hardAns(a){\n  const o = {...a};\n  SOFT_KEYS.forEach(k=>{ if(o[k]==='partial' || o[k]==='unsure') o[k]='no'; });\n  if(o.sessionStructure==='unsure') o.sessionStructure='single';\n  if(o.realismPriority==='unsure' || o.realismPriority==='partial') o.realismPriority='visual';\n  if(o.evalDesign==='unsure') o.evalDesign='none';\n  ['interactionHW','immersion'].forEach(k=>{ if(o[k]==='undecided') delete o[k]; });\n  return o;\n}\nconst G_FIELDS = {G1:['objectivesDeclared'],G2:['taskValidated'],G3:['sessionStructure'],G4:['gestureCorrespondence'],G5:['feedbackChannels','debriefPlanned'],G6:['realismPriority'],G7:['experienceProactive'],G8:['evalDesign']};\nconst GOOD = {evalDesign:'linked', sessionStructure:'multi', realismPriority:'functional'};\n// 'unsure' | 'partial' | '' — set only when a soft answer is the sole reason for the flag.\nfunction softKind(a, id){\n  const vals = G_FIELDS[id].map(k=>a[k]);\n  if(!vals.some(v=>v==='partial'||v==='unsure')) return '';\n  const good = {...a};\n  G_FIELDS[id].forEach(k=>{ if(a[k]==='partial'||a[k]==='unsure') good[k] = GOOD[k]||'yes'; });\n  if(computeFlags(good)[id]) return '';\n  return vals.includes('unsure') ? 'unsure' : 'partial';\n}\nconst SOFT_NOTE = {unsure:' Check this first with whoever owns that decision. If it’s already covered, this guideline is on track.', partial:' The steps below apply to the parts not yet covered.'};\nconst SNIP = {\n  G1:'Define what the learner must be able to do before choosing technology.',\n  G2:'Base the steps on how practitioners actually do the job.',\n  G3:'Add difficulty in stages, not all at once.',\n  G4:'Make gestures resemble the real physical action.',\n  G5:'Combine feedback channels and explain each error.',\n  G6:'Make things behave correctly before making them look real.',\n  G7:'Plan pacing and challenge up front.',\n  G8:'Link every measure back to a learning objective.',\n};\nconst sevCls = (g,tier) => g.flagged && g.soft==='unsure' ? 'verify' : tier;\nfunction sevLabel(g, tier){\n  if(g.flagged && g.soft==='unsure') return 'Verify';\n  return ({crit:'Act first', mod:'Review', ok:'On track'})[tier];\n}\nfunction computeFlags(a){ return computeFlagsRaw(hardAns(a)); }\nfunction computeFlagsRaw(a){\n  return {\n    G1: a.objectivesDeclared==='no',\n    G2: a.taskValidated==='no',\n    G3: a.sessionStructure==='single',\n    G4: a.gestureCorrespondence==='no',\n    G5: a.feedbackChannels==='no' || a.debriefPlanned==='no',\n    G6: a.realismPriority==='visual',\n    G7: a.experienceProactive==='no',\n    G8: a.evalDesign==='none' || a.evalDesign==='independent',\n  };\n}\n\nfunction priorityScore(a,id){\n  const base = GAP[id].pct;\n  const flags = computeFlags(a);\n  if (flags[id] && softKind(a,id)) return Math.max(50, Math.min(74, base));\n  if (flags[id]) return Math.min(100, base + 12);\n  // Not flagged: score must stay safely below the lowest possible flagged score (57),\n  // so \"worth reviewing\" always outranks \"on track\" regardless of the guideline's\n  // corpus-wide prevalence. Higher-prevalence guidelines still edge out lower ones\n  // within this band, as a mild \"keep an eye on this anyway\" signal.\n  return Math.min(45, Math.max(10, base - 40));\n}\n\nfunction isFlagged(a,id){\n  return !!computeFlags(a)[id];\n}\n\nlet state={screen:'home',step:0,data:{},error:'',showOnlyFlagged:false,resultsView:'dashboard',guidedIndex:0};\n\n// Warn before an accidental close/reload/back if there's unsaved assessment\n// work in progress — the only recovery otherwise is the \"Save progress\" link.\n// Autosave on this device, so a reload or closed tab never loses answers.\nconst SAVE_KEY = 'vrfw-v9-session';\nfunction autosave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({data:state.data, q:state.q, participant:state.participant||{}, screen:state.screen})); }catch(e){} }\n(function restore(){ try{ const o = JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(o && o.data){ state.data=o.data; state.q=o.q||0; state.participant=o.participant||{}; if(o.screen==='steps'||o.screen==='results') state.screen=o.screen; } }catch(e){} })();\nfunction continueAssessment(){ const v=visibleQs(state.data); if(v.every(k=>state.data[k])){ state.screen='results'; } else { state.screen='steps'; state.q=firstUnanswered(); } render(); }\nfunction uiConfirm(title, body, okLabel, onOk){\n  const prev = document.activeElement;\n  const host = document.createElement('div'); host.id='cfHost';\n  host.innerHTML = '<div class=\"ws-backdrop cf-backdrop\"><div class=\"ws-modal cf-modal\" role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"cf-t\" aria-describedby=\"cf-b\"><h2 id=\"cf-t\" class=\"cf-title\">'+title+'<\u002Fh2><p id=\"cf-b\" class=\"cf-body\">'+body+'<\u002Fp><div class=\"cf-actions\"><button class=\"btn\" data-a=\"no\">Cancel<\u002Fbutton><button class=\"btn btn-danger\" data-a=\"ok\">'+okLabel+'<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  const close = ()=>{ host.remove(); document.removeEventListener('keydown', key); document.body.style.overflow=''; if(prev&&prev.focus) prev.focus(); };\n  const key = e=>{ if(e.key==='Escape') close(); if(e.key==='Tab'){ const b=host.querySelectorAll('button'); if(e.shiftKey&&document.activeElement===b[0]){e.preventDefault();b[1].focus();} else if(!e.shiftKey&&document.activeElement===b[1]){e.preventDefault();b[0].focus();} } };\n  host.addEventListener('click', e=>{ const a=e.target.dataset&&e.target.dataset.a; if(e.target.classList.contains('cf-backdrop')||a==='no') close(); if(a==='ok'){ close(); onOk(); } });\n  document.body.appendChild(host); document.body.style.overflow='hidden';\n  document.addEventListener('keydown', key);\n  host.querySelector('[data-a=\"no\"]').focus();\n}\nconst CLEAR_MSG = 'Your current answers will be cleared from this device. To keep them, download your results first.';\nfunction clearAll(){ state.data={}; state.participant={}; state.error=''; state.showOnlyFlagged=false; }\nfunction startNew(){ if(!Object.keys(state.data).length) return startAssessment(); uiConfirm('Start a new assessment?', CLEAR_MSG, 'Clear and restart', ()=>{ clearAll(); startAssessment(); }); }\n\n// ── Full design brief: everything on one page, worksheets inline, print-ready.\n// This is the deliverable a designer hands to their team — the worksheets are\n// the tool's most valuable output and must be exportable, not modal-only.\nfunction ansName(id, d){\n  if(d[id]==='unsure') return 'Not sure';\n  return ((adaptQ(id,d).options.find(o=>o.val===d[id]))||(FIELD_BY_ID[id].options.find(o=>o.val===d[id]))||{}).name;\n}\nfunction getAnswerTables(d){\n  const ctx = [];\n  if(d.stage) ctx.push(['Project stage', optName('stage', d.stage)]);\n  STEPS.forEach(s => s.fields.forEach(f => {\n    if(f.kind !== 'profile') return;\n    const chosen = ansName(f.id, d);\n    ctx.push([f.label, chosen || '—']);\n  }));\n  const diag = [];\n  STEPS.forEach(s => s.fields.forEach(f => {\n    if(f.kind !== 'diagnostic') return;\n    const chosen = ansName(f.id, d);\n    diag.push([f.label, chosen || '—']);\n  }));\n  return {ctx, diag};\n}\n\nfunction openBrief(){\n  const d = state.data;\n  const scored = getScoredGuidelines(d);\n  const flaggedCount = scored.filter(g=>g.flagged).length;\n  const p = state.participant || {};\n  const today = new Date().toISOString().slice(0,10);\n  const hasSynthesis = !!(d.domain && d.skillType);\n  const off = hasSynthesis ? 1 : 0; // section-number shift when the profile synthesis is present\n\n  // Derive the answer tables from the questionnaire itself, so they can never\n  // drift out of sync with the actual fields (uses each option's own label).\n  const {ctx, diag} = getAnswerTables(d);\n\n  const wsTable = (w, rows) => `<table class=\"ws-table\">\n    <thead><tr>${w.cols.map(c=>`<th>${c}<\u002Fth>`).join('')}<\u002Ftr><\u002Fthead>\n    <tbody>${rows.map(r=>`<tr>${r.map(cell=>`<td>${cell}<\u002Ftd>`).join('')}<\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable>`;\n\n  let h = `<div class=\"brief-doc\">\n    <div class=\"brief-header\">\n      <h1>VR Training Design Brief${p.project?`: ${p.project}`:''}<\u002Fh1>\n      <div class=\"brief-meta\">\n        Generated ${today}${p.project?` · ${p.project}`:''}${p.name?` · ${p.name}`:''}${p.role?` (${p.role})`:''}<br>\n        Based on the eight-guideline framework (G1–G8) derived from a systematic review of immersive VR training design.<br>\n        <strong>Tool version ${ARTIFACT.version} · ${ARTIFACT.build} · released ${ARTIFACT.released}<\u002Fstrong>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 class=\"brief-h2\">1. Training context<\u002Fh2>\n    <table class=\"brief-ctx\"><tbody>\n      ${ctx.map(([k,v])=>`<tr><th>${k}<\u002Fth><td>${v||'—'}<\u002Ftd><\u002Ftr>`).join('')}\n    <\u002Ftbody><\u002Ftable>\n`;\n\n  if(hasSynthesis){\n    h += `<h2 class=\"brief-h2\">2. Your training, in one line<\u002Fh2>\n    <p class=\"brief-p\"><strong>You\\u2019re designing a ${LBL.domain[d.domain]} training built around a ${LBL.skillType[d.skillType]} skill${LBL.taskType[d.taskType]?`, structured as a ${LBL.taskType[d.taskType]} task`:''}.<\u002Fstrong><\u002Fp>\n    <p class=\"brief-p brief-p-context\"><span class=\"g-tag\">DOMAIN<\u002Fspan>${DOMAIN_FRAME[d.domain]}<\u002Fp>\n    <p class=\"brief-p brief-p-context\"><span class=\"g-tag\">SKILL TYPE<\u002Fspan>${SKILL_FRAME[d.skillType]}<\u002Fp>\n    ${TASK_FRAME[d.taskType]?`<p class=\"brief-p brief-p-context\"><span class=\"g-tag\">TASK TYPE<\u002Fspan>${TASK_FRAME[d.taskType]}<\u002Fp>`:''}\n`;\n  }\n\n  h += `<h2 class=\"brief-h2\">${2+off}. Diagnostic answers<\u002Fh2>\n    <table class=\"brief-ctx\"><tbody>\n      ${diag.map(([k,v])=>`<tr><th>${k}<\u002Fth><td>${v}<\u002Ftd><\u002Ftr>`).join('')}\n    <\u002Ftbody><\u002Ftable>\n\n    <h2 class=\"brief-h2\">${3+off}. Diagnosis summary<\u002Fh2>\n    <p class=\"brief-p\"><strong>${flaggedCount} of 8 guidelines to review.<\u002Fstrong> Ranked by priority for this context.<\u002Fp>\n    <table class=\"ws-table\">\n      <thead><tr><th>Rank<\u002Fth><th>Guideline<\u002Fth><th>Priority<\u002Fth><th>Status<\u002Fth><th>Why flagged<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>${scored.map((g,i)=>`<tr>\n        <td>${i+1}<\u002Ftd><td><strong>${g.id}<\u002Fstrong> — ${g.name}<\u002Ftd><td>${g.score}<\u002Ftd>\n        <td>${g.flagged?sevLabel(g,'mod'):'No gap detected'}<\u002Ftd>\n        <td>${g.why?`Answered “${g.why[1]}” to “${g.why[0]}”`:'—'}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody>\n    <\u002Ftable>`;\n\n  const topFixes = scored.filter(g=>g.flagged).slice(0,3);\n  if(topFixes.length){\n    h += `<h2 class=\"brief-h2\">${4+off}. Where to start<\u002Fh2>\n      <ol class=\"brief-ol\">${topFixes.map(g=>`<li><strong>${g.id} — ${g.name}.<\u002Fstrong> ${g.nextStep}<\u002Fli>`).join('')}<\u002Fol>`;\n  }\n\n  h += `<h2 class=\"brief-h2\">${(topFixes.length?5:4)+off}. Guidance and worksheets<\u002Fh2>`;\n\n  scored.forEach(g=>{\n    const w = WORKSHEETS[g.id];\n    const blank = Array.from({length:4}, ()=> w.cols.map(()=>'&nbsp;'));\n    h += `<div class=\"brief-guideline${g.flagged?' flagged':''}\">\n      <h3 class=\"brief-h3\">${g.id} — ${g.name} <span class=\"brief-tag\">${g.type}<\u002Fspan>${g.flagged?'<span class=\"brief-flag\">${sevLabel(g,severityTier(g)).toLowerCase()}<\u002Fspan>':''}<\u002Fh3>\n      <p class=\"brief-p\"><em>${g.prescription}<\u002Fem><\u002Fp>\n      ${g.why?`<p class=\"brief-why\"><strong>Why flagged:<\u002Fstrong> you answered “${g.why[1]}” to “${g.why[0]}”.${SOFT_NOTE[g.soft]||''}<\u002Fp>`:''}\n      <p class=\"brief-p\"><strong>What to do:<\u002Fstrong> ${g.action[0]}<\u002Fp>\n      ${g.action.slice(1).map(line=>`<p class=\"brief-p brief-p-context\">${line}<\u002Fp>`).join('')}\n      <p class=\"brief-p brief-small\"><strong>Derived from:<\u002Fstrong> the systematic literature review, via the focused code \\u201c${DERIVATION[g.id]||'\\u2014'}\\u201d; present as a gap in ${g.gap.pct}% of the corpus.<\u002Fp>\n      <p class=\"brief-p brief-small\"><strong>Interpreted through:<\u002Fstrong> ${g.theory}<\u002Fp>\n      <p class=\"brief-p brief-small\"><strong>Worksheet built on:<\u002Fstrong> ${w.method}<\u002Fp>\n\n      <div class=\"brief-ws-title\">${w.title} — worked example<\u002Fdiv>\n      ${wsTable(w, w.example)}\n      <div class=\"brief-ws-title\">${w.title} — your version<\u002Fdiv>\n      ${wsTable(w, blank)}\n      <ul class=\"brief-notes\">${w.notes.map(n=>`<li>${n}<\u002Fli>`).join('')}<\u002Ful>\n      <p class=\"brief-p brief-small brief-grounding\">${g.theory} · Gap present in ${g.gap.pct}% of the studies reviewed.<\u002Fp>\n      <p class=\"brief-p brief-small\"><strong>Someone already did this:<\u002Fstrong> ${g.exemplar.study} — ${g.exemplar.note}.<\u002Fp>\n    <\u002Fdiv>`;\n  });\n\n  h += `<h2 class=\"brief-h2\">${(topFixes.length?6:5)+off}. Scope and limitations<\u002Fh2>\n    <ul class=\"brief-notes\">${LIMITS.map(l=>`<li>${l}<\u002Fli>`).join('')}<\u002Ful>\n    <p class=\"brief-p brief-small brief-grounding\">${SCORING.formula}. ${SCORING.detail}<\u002Fp>\n  <\u002Fdiv>`;\n\n  const host = document.createElement('div');\n  host.id = 'briefHost';\n  host.innerHTML = `<div class=\"brief-bar\">\n      <button class=\"btn\" onclick=\"closeBrief()\">← Back to results<\u002Fbutton>\n      <button class=\"btn btn-primary\" onclick=\"window.print()\">Print / save as PDF ↗<\u002Fbutton>\n    <\u002Fdiv>${h}`;\n  document.body.appendChild(host);\n  document.getElementById('root').style.display='none';\n  document.querySelector('.header').style.display='none';\n  window.scrollTo(0,0);\n}\n\nfunction closeBrief(){\n  const host = document.getElementById('briefHost');\n  if(host) host.remove();\n  document.getElementById('root').style.display='';\n  document.querySelector('.header').style.display='';\n}\n\n// ── Save / resume: a JSON file the designer can keep with their project ──\nfunction saveSession(){\n  const payload = { version:1, savedAt:new Date().toISOString(),\n    participant: state.participant||{}, data: state.data };\n  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'vr-training-assessment.json';\n  a.click();\n  URL.revokeObjectURL(a.href);\n}\n\nfunction loadSession(input){\n  const file = input.files && input.files[0];\n  if(!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const parsed = JSON.parse(e.target.result);\n      if(!parsed || typeof parsed.data !== 'object') throw new Error('bad shape');\n      state.data = parsed.data;\n      state.participant = parsed.participant || {};\n      const missing = STEPS.some(s => s.fields.some(f => !state.data[f.id]));\n      state.screen = missing ? 'steps' : 'results';\n      state.step = 0; state.q = missing ? firstUnanswered() : 0; state.error = missing ? 'Some answers were missing from that file. You’re at the first one still open.' : '';\n      render();\n    } catch(err){\n      state.error = 'That file could not be read. Please choose a file saved from this tool.';\n      render();\n    }\n  };\n  reader.readAsText(file);\n  input.value = '';\n}\n\n// ── Jump back to a specific step to change an answer ──\nfunction backToResults(){\n  state.screen = 'results';\n  state.error = '';\n  render();\n}\n\nfunction editStep(i){\n  state.screen = 'steps';\n  state.step = i;\n  state.q = Math.max(0, visibleQs(state.data).indexOf(i===0 ? 'stage' : (STEPS[i] ? STEPS[i].fields[0].id : QORDER[0])));\n  state.error = '';\n  render();\n}\n\n// ── Worksheet modal: details-on-demand so the results page stays scannable ──\nlet _lastFocused = null;\nlet _worksheetOpenedFrom = null; // guideline id, if the worksheet was opened from its detail modal\n\nfunction openWorksheet(id){\n  const gdHost = document.getElementById('gdHost');\n  _worksheetOpenedFrom = gdHost ? id : null;\n  if(gdHost){ closeGuidelineDetail(); }\n  const w = WORKSHEETS[id];\n  const g = GUIDELINES[id];\n  if(!w) return;\n  _lastFocused = document.activeElement;\n\n  const tbl = (rows) => `<table class=\"ws-table\">\n    <thead><tr>${w.cols.map(c=>`<th scope=\"col\">${c}<\u002Fth>`).join('')}<\u002Ftr><\u002Fthead>\n    <tbody>${rows.map(r=>`<tr>${r.map(cell=>`<td>${cell}<\u002Ftd>`).join('')}<\u002Ftr>`).join('')}<\u002Ftbody>\n  <\u002Ftable>`;\n\n  const blank = Array.from({length:3}, ()=> w.cols.map(()=>'&nbsp;'));\n\n  const html = `\n  <div class=\"ws-backdrop\" onclick=\"if(event.target===this)closeWorksheet()\">\n    <div class=\"ws-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ws-title\">\n      <div class=\"ws-head\">\n        ${_worksheetOpenedFrom?`<button class=\"ws-back\" onclick=\"backToGuidelineDetail()\" aria-label=\"Back to ${id} details\">&larr; Back<\u002Fbutton>`:''}\n        <div>\n          <div class=\"ws-eyebrow\">${id} — ${g.name}<\u002Fdiv>\n          <h2 id=\"ws-title\">${w.title}<\u002Fh2>\n        <\u002Fdiv>\n        <button class=\"ws-close\" onclick=\"closeWorksheet()\" aria-label=\"Close worksheet\">&times;<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"ws-body\">\n        <p class=\"ws-produces\"><strong>What you end up with:<\u002Fstrong> ${w.produces}<\u002Fp>\n\n\n        <h3 class=\"ws-sub\">Worked example<\u002Fh3>\n        ${tbl(w.example)}\n\n        <h3 class=\"ws-sub\">How to fill it in<\u002Fh3>\n        <ul class=\"ws-notes\">${w.notes.map(n=>`<li>${n}<\u002Fli>`).join('')}<\u002Ful>\n\n        <h3 class=\"ws-sub\">Blank template <span class=\"ws-sub-note\">Copy it into a spreadsheet with the button below<\u002Fspan><\u002Fh3>\n        ${tbl(blank)}\n\n\n        ${THEORY[id]?`<details class=\"info-panel theory-panel\">\n          <summary>\n            <span class=\"info-icon\" aria-hidden=\"true\">&#9432;<\u002Fspan>\n            <span class=\"info-sum-text\">\n              <strong>Learn the theory behind this worksheet<\u002Fstrong><br>\n              <span class=\"info-sum-sub\">${THEORY[id].name} — diagram, how to apply it, and the reference<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"in

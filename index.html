fo-chev\" aria-hidden=\"true\">›<\u002Fspan>\n          <\u002Fsummary>\n          <div class=\"info-body theory-body\">\n            <div class=\"theory-diagram\">${THEORY[id].svg}<\u002Fdiv>\n            <p class=\"theory-use\"><strong>How to use it here:<\u002Fstrong> ${THEORY[id].use}<\u002Fp>\n            <p class=\"theory-caveat\"><strong>Worth knowing:<\u002Fstrong> ${THEORY[id].caveat}<\u002Fp>\n            <p class=\"theory-cite\"><strong>This worksheet is built on:<\u002Fstrong> ${w.method}<\u002Fp>\n            <p class=\"theory-cite\"><strong>Foundational reference:<\u002Fstrong> ${THEORY[id].cite}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdetails>`:''}\n      <\u002Fdiv>\n      <div class=\"ws-foot\">\n        <button class=\"btn btn-primary\" onclick=\"copyWorksheet('${id}')\">Copy template for a spreadsheet ⧉<\u002Fbutton>\n        <span id=\"wsCopyOK\" class=\"ws-copy-ok\">✓ Copied — paste into a spreadsheet<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n\n  const host = document.createElement('div');\n  host.id = 'wsHost';\n  host.innerHTML = html;\n  document.body.appendChild(host);\n  document.body.style.overflow = 'hidden';\n  const closeBtn = host.querySelector('.ws-close');\n  if(closeBtn) closeBtn.focus();\n  document.addEventListener('keydown', _wsKeydown);\n}\n\nfunction _wsKeydown(e){\n  if(e.key === 'Escape'){ closeWorksheet(); return; }\n  if(e.key !== 'Tab') return;\n  const modal = document.querySelector('.ws-modal');\n  if(!modal) return;\n  const f = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex=\"-1\"])');\n  if(!f.length) return;\n  const first = f[0], last = f[f.length-1];\n  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }\n  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }\n}\n\nfunction closeWorksheet(){\n  const host = document.getElementById('wsHost');\n  if(host) host.remove();\n  document.body.style.overflow = '';\n  document.removeEventListener('keydown', _wsKeydown);\n  _worksheetOpenedFrom = null;\n  if(_lastFocused && _lastFocused.focus) _lastFocused.focus();\n}\nfunction backToGuidelineDetail(){\n  const id = _worksheetOpenedFrom;\n  const host = document.getElementById('wsHost');\n  if(host) host.remove();\n  document.body.style.overflow = '';\n  document.removeEventListener('keydown', _wsKeydown);\n  _worksheetOpenedFrom = null;\n  if(id) openGuidelineDetail(id);\n}\n\n// Tab-separated so it pastes straight into Excel / Sheets as real columns\nfunction copyWorksheet(id){\n  const w = WORKSHEETS[id];\n  const strip = s => String(s).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,'');\n  const lines = [\n    w.cols.map(strip).join('\\t'),\n    ...w.example.map(r=>r.map(strip).join('\\t')),\n    w.cols.map(()=>'').join('\\t'),\n    w.cols.map(()=>'').join('\\t'),\n    w.cols.map(()=>'').join('\\t'),\n  ];\n  const text = lines.join('\\n');\n  const done = ()=>{\n    const el = document.getElementById('wsCopyOK');\n    if(el){ el.style.display='inline'; setTimeout(()=>{el.style.display='none';}, 3000); }\n  };\n  navigator.clipboard.writeText(text).then(done).catch(()=>{\n    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);\n    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();\n  });\n}\n\n\n// Guideline detail modal: header states the verdict once; left column = what to\n// do for this project, right column = evidence to justify it to a client.\nfunction renderGuidelineModal(g, d, opts){\n  opts = opts || {};\n  const ex = EXAMPLES[g.id], diagram = DIAGRAMS[g.id], dep = DEPENDS[g.id];\n  const tier = severityTier(g);\n  const SEV = {crit:'Critical', mod:'Worth reviewing', ok:'On track'};\n  const eff = computeEffort(g.id, d);\n  const lane = !g.flagged ? '' : (eff && eff.effort==='low') ? 'Low effort' : 'Higher effort';\n  const tl = tailoredBy(g.id, d);\n  const openReqs = dep ? dep.requires.filter(r => isFlagged(d, r)) : [];\n  const forYou = [];\n  if(g.why) forYou.push(`You answered “${g.why[1]}” to “${g.why[0]}”.${SOFT_NOTE[g.soft]||''}`+(opts.inline?'':` <button class=\"gm-change\" onclick=\"editFromModal('${g.why[2]}')\">Change this answer<\u002Fbutton>`));\n  if(openReqs.length) forYou.push(`Settle ${openReqs.map(r=>`<a href=\"#\" class=\"g-dep-link\" onclick=\"openGuidelineDetail('${r}');return false;\">${r}<\u002Fa>`).join(' and ')} first — ${g.id} builds on ${openReqs.length===1?'it':'them'}, so decisions here may need redoing.`);\n  const EFF = {low:'Low effort',medium:'Medium effort',high:'High effort',varies:'Effort varies'};\n  const PAY = {high:'High retention payoff',varies:'Payoff depends on context'};\n  return `<div class=\"ws-head gm-head\">\n      <div class=\"gm-head-main\">\n\n        ${opts.inline?`<h3 class=\"gm-inline-title\">${g.name}<\u002Fh3>`:`<h2 id=\"gd-title\">${g.name}<\u002Fh2>`}\n        <div class=\"gm-status\">\n          <span class=\"gm-eyebrow\">${g.id}<\u002Fspan><span class=\"gm-sep\">·<\u002Fspan>\n          <span class=\"dx-sev dx-sev-${sevCls(g,tier)}\">${sevLabel(g,tier)}<\u002Fspan>\n          ${lane?`<span class=\"gm-sep\">·<\u002Fspan><span class=\"gm-lane\">${lane}<\u002Fspan>`:''}\n        <\u002Fdiv>\n        <p class=\"gm-lead\">${g.prescription}<\u002Fp>\n      <\u002Fdiv>\n      ${opts.inline?'':`<button class=\"ws-close\" onclick=\"closeGuidelineDetail()\" aria-label=\"Close\">&times;<\u002Fbutton>`}\n    <\u002Fdiv>\n    <div class=\"ws-body\">\n      <div class=\"gm-body\">\n        <div class=\"gm-col\">\n          ${forYou.length?`<div class=\"gm-foryou${g.flagged?'':' gm-foryou-neutral'}\"><div class=\"gm-k\">${g.flagged?'Why it’s flagged for you':'Settle first'}<\u002Fdiv>${forYou.map(x=>`<p>${x}<\u002Fp>`).join('')}<\u002Fdiv>`:''}\n          <div class=\"gm-block\">\n            <div class=\"gm-k\">How to put this into practice<\u002Fdiv>\n            ${tl.length?`<p class=\"gm-adapted\">Adapted to your project: ${tl.join(' · ')}<\u002Fp>`:''}\n            ${g.action.slice(0,2).map((line,i)=>`<p class=\"${i===0?'gm-action-primary':'gm-action-context'}\">${line}<\u002Fp>`).join('')}\n            ${g.action.length>2?`<details class=\"gm-more\"><summary>${g.action.length-2} more tip${g.action.length>3?'s':''}<\u002Fsummary>${g.action.slice(2).map(line=>`<p class=\"gm-action-context\">${line}<\u002Fp>`).join('')}<\u002Fdetails>`:''}\n          <\u002Fdiv>\n          <button class=\"ws-open\" onclick=\"openWorksheet('${g.id}')\">\n            <span class=\"ws-open-icon\" aria-hidden=\"true\">▤<\u002Fspan>\n            <span><strong>Next step: open the ${WORKSHEETS[g.id].title}<\u002Fstrong><\u002Fspan>\n            <span class=\"ws-open-arrow\" aria-hidden=\"true\">→<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"gm-col gm-col-evidence\">\n          ${diagram?`<figure class=\"gm-fig\">${diagram.svg}<figcaption>${diagram.caption}<\u002Ffigcaption><\u002Ffigure>`:''}\n          <div class=\"gm-compare\">\n            <div class=\"gm-cmp gm-cmp-poor\"><span class=\"gm-cmp-k\">✗ Common pitfall<\u002Fspan>${ex.poor}<\u002Fdiv>\n            <div class=\"gm-cmp gm-cmp-good\"><span class=\"gm-cmp-k\">✓ Better approach<\u002Fspan>${ex.good}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <details class=\"gm-bg\"><summary>Evidence and background<\u002Fsummary>\n      <p class=\"gm-small\" style=\"margin-top:10px\"><strong>Example from the literature:<\u002Fstrong> ${g.exemplar.study} — ${g.exemplar.note}.<\u002Fp>\n      <div class=\"gm-meta\">\n        ${dep&&dep.requires.length?`<span><span class=\"gm-meta-k\">Builds on<\u002Fspan> ${dep.requires.join(', ')}<\u002Fspan>`:''}\n        ${dep&&dep.informs.length?`<span><span class=\"gm-meta-k\">Feeds into<\u002Fspan> ${dep.informs.join(', ')}<\u002Fspan>`:''}\n        <span><span class=\"gm-meta-k\">Grounding<\u002Fspan> ${g.theory}<\u002Fspan>\n        <span><span class=\"gm-meta-k\">Type<\u002Fspan> ${g.type}<\u002Fspan>\n        <span><span class=\"gm-meta-k\">Missing in<\u002Fspan> ${g.gap.pct}% of reviewed studies<\u002Fspan>\n      <\u002Fdiv><\u002Fdetails>\n    <\u002Fdiv>\n`;\n}\nfunction openGuidelineDetail(id){\n  const scored = getScoredGuidelines(state.data);\n  const g = scored.find(x=>x.id===id);\n  if(!g) return;\n  const ids = scored.map(x=>x.id);\n  const idx = ids.indexOf(id);\n  const prevId = ids[(idx-1+ids.length)%ids.length];\n  const nextId = ids[(idx+1)%ids.length];\n  const synHost = document.getElementById('synHost');\n  if(synHost){ synHost.remove(); document.removeEventListener('keydown', _synKeydown); }\n  const existing = document.getElementById('gdHost');\n  if(existing){ existing.remove(); document.removeEventListener('keydown', _gdKeydown); }\n  else if(!synHost){ _lastFocused = document.activeElement; }\n  const html = `\n  <div class=\"ws-backdrop\" onclick=\"if(event.target===this)closeGuidelineDetail()\">\n    <div class=\"ws-modal gm-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"gd-title\">\n${renderGuidelineModal(g, state.data)}\n      <div class=\"ws-foot gi-foot\">\n        <button class=\"ws-back gd-prev\" onclick=\"openGuidelineDetail('${prevId}')\" aria-label=\"Previous guideline, ${prevId}\">&larr; ${GUIDELINES[prevId].name}<\u002Fbutton>\n        <span class=\"gm-pos\">${idx+1} of ${ids.length} · by priority<\u002Fspan>\n        <button class=\"ws-back gd-next\" onclick=\"openGuidelineDetail('${nextId}')\" aria-label=\"Next guideline, ${nextId}\">${GUIDELINES[nextId].name} &rarr;<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  const host = document.createElement('div');\n  host.id = 'gdHost';\n  host.innerHTML = html;\n  document.body.appendChild(host);\n  document.body.style.overflow = 'hidden';\n  const closeBtn = host.querySelector('.ws-close');\n  if(closeBtn) closeBtn.focus();\n  document.addEventListener('keydown', _gdKeydown);\n}\nfunction _gdKeydown(e){\n  if(e.key === 'Escape'){ closeGuidelineDetail(); return; }\n  if(e.key === 'ArrowRight'){ const b = document.querySelector('#gdHost .gd-next'); if(b){ e.preventDefault(); b.click(); } return; }\n  if(e.key === 'ArrowLeft'){ const b = document.querySelector('#gdHost .gd-prev'); if(b){ e.preventDefault(); b.click(); } return; }\n  if(e.key !== 'Tab') return;\n  const modal = document.querySelector('#gdHost .ws-modal');\n  if(!modal) return;\n  const f = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex=\"-1\"])');\n  if(!f.length) return;\n  const first = f[0], last = f[f.length-1];\n  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }\n  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }\n}\nfunction editFromModal(field){\n  closeGuidelineDetail();\n  const v = visibleQs(state.data), i = v.indexOf(field);\n  goQ(i<0 ? 0 : i);\n}\nfunction closeGuidelineDetail(){\n  const host = document.getElementById('gdHost');\n  if(host) host.remove();\n  document.body.style.overflow = '';\n  document.removeEventListener('keydown', _gdKeydown);\n  if(_lastFocused && _lastFocused.focus) _lastFocused.focus();\n}\nfunction severityTier(g){\n  if(!g.flagged) return 'ok';\n  if(g.soft) return 'mod';\n  return g.score>=75 ? 'crit' : 'mod';\n}\n\nfunction setFilter(val){ state.showOnlyFlagged = val; state.guidedIndex = 0; render(); }\nfunction setResultsView(mode){ state.resultsView = mode; state.guidedIndex = 0; render(); }\nfunction guidedNav(delta, max){ state.guidedIndex = Math.max(0, Math.min(max-1, state.guidedIndex+delta)); render();\n  requestAnimationFrame(()=>{ const el=document.querySelector('.guided-panel'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }); }\n\nfunction getScoredGuidelines(d){\n  const ids=Object.keys(GUIDELINES);\n  const flags = ids.reduce((o,id)=>{ o[id]=isFlagged(d,id); return o; }, {});\n\n  // Raw priority score: corpus gap prevalence, adjusted by whether this\n  // project matches the pattern (see priorityScore).\n  const raw = {};\n  ids.forEach(id => { raw[id] = priorityScore(d,id); });\n\n  // Dependency-aware propagation: a flagged guideline can never be\n  // outranked by anything that requires it to be settled first. If G2 is\n  // flagged and scores higher than its own prerequisite G1 (also flagged),\n  // G1 inherits G2's urgency \\u2014 because you cannot properly fix G2 without\n  // first fixing G1. Processed high-id \\u2192 low-id, which DEPENDS guarantees\n  // is a valid topological order (every \"requires\" points to a lower id).\n  const effective = {...raw};\n  [...ids].sort((a,b)=>b.localeCompare(a)).forEach(id=>{\n    if(!flags[id]) return;\n    const dep = DEPENDS[id];\n    if(!dep) return;\n    dep.requires.forEach(req=>{\n      if(flags[req]) effective[req] = Math.max(effective[req], effective[id]);\n    });\n  });\n\n  return ids.map(id=>({id,...GUIDELINES[id],gap:GAP[id],action:GUIDELINES[id].action(hardAns(d)),soft:softKind(d,id),\n    score:effective[id],flagged:flags[id],iconBg:ICON_COLORS[id].bg,iconFg:ICON_COLORS[id].fg,nextStep:NEXT_STEPS[id],why:whyFlagged(d,id)}))\n    .sort((a,b)=> b.score-a.score || (DEPENDS[a.id].requires.length - DEPENDS[b.id].requires.length));\n}\n\n// Jump from the overview list to a specific guideline card\nfunction jumpTo(id){\n  if(state.showOnlyFlagged){\n    const g = Object.keys(GUIDELINES).find(k=>k===id);\n    if(g && !isFlagged(state.data,id)){ state.showOnlyFlagged=false; render(); }\n  }\n  if(state.resultsView==='dashboard'){\n    openGuidelineDetail(id);\n    return;\n  }\n  render();\n  requestAnimationFrame(()=>{\n    const el = document.getElementById('card-'+id);\n    if(!el) return;\n    const details = document.getElementById('details-'+id);\n    if(details) details.open = true;\n    el.scrollIntoView({behavior:'smooth', block:'start'});\n    el.classList.add('just-jumped');\n    setTimeout(()=>el.classList.remove('just-jumped'), 1600);\n  });\n}\n\n// Pause/resume diagram animations based on viewport visibility (perf + reduced cognitive load)\nlet _inViewObserver = null;\nfunction setupInViewObserver(){\n  if(_inViewObserver) _inViewObserver.disconnect();\n  const cards = document.querySelectorAll('.g-card');\n  if(!cards.length || typeof IntersectionObserver === 'undefined') return;\n  _inViewObserver = new IntersectionObserver((entries)=>{\n    entries.forEach(entry=>{\n      entry.target.classList.toggle('in-view', entry.isIntersecting);\n    });\n  }, { threshold: 0.35 });\n  cards.forEach(c=>_inViewObserver.observe(c));\n}\n\nfunction render(){\n  autosave();\n  const r=document.getElementById('root');\n  document.body.dataset.screen = state.screen;\n  if(state.screen==='home'){r.innerHTML=renderHome();return;}\n  if(state.screen==='steps'){r.innerHTML=renderStep();const m=r.querySelector('.aq-q');if(m&&state._lastQ!==state.q){window.scrollTo(0,0);state._lastQ=state.q;}return;}\n  if(state.screen==='results'){r.innerHTML=renderResults();window.scrollTo(0,0);setupInViewObserver();return;}\n}\n\n// Plain-language explanation of each guideline, with a concrete worked example —\n// written for someone who has not yet taken the assessment, so no personalisation,\n// scores, or worksheet links here. Same source text as the SAM's Guideline_Narratives sheet.\nconst GUIDELINE_INTRO = {\n  G1: 'Before designing any screen, it is necessary to establish clearly what the learner should be able to do by the end of the training, and that objective must be tied to how it will later be assessed. In practice, many VR training programs develop in the reverse order: the technological experience is decided first, and the learning objective is fitted in afterward, if it is defined with any clarity at all. G1 proposes reversing that order.',\n  G2: 'Training should be built around the tasks people actually perform in their work, not around what the design team assumes they do. If the training concerns replacing an industrial filter, the sequence of steps should come from observing and interviewing the technicians who carry it out daily, not solely from existing procedural documentation.',\n  G3: 'Difficulty should not be introduced all at once, because the capacity to process new information is limited. If the training involves closing an emergency valve, it is best to practice that single action first, without time pressure. Only once it becomes automatic is a second valve introduced, and only at the end is the pressure of a sounding alarm added. Presenting the full scenario from the outset is one of the most common causes of cognitive overload and dropout.',\n  G4: 'In VR the body can perform the action itself, not merely trigger it with a button, and that action needs to respond with the same physical coherence it would have in the real world. If the training involves tightening a screw, the person should perform the tightening motion with their hand, feeling the resistance increase as the screw tightens, rather than simply pressing a button for the system to do it on their behalf.',\n  G5: 'When the person acts correctly or incorrectly, the system should communicate this through more than one channel at once: visual, auditory, and, where possible, haptic. A single channel, such as on-screen text, reinforces learning far less effectively. Communicating the error, however, is not sufficient: the person needs to understand why the mistake occurred, and a brief moment of guided reflection proves more effective than a simple signal that something went wrong.',\n  G6: 'Photorealistic visual fidelity is not the determining factor. What matters is that machines, tools, and processes behave as they would in reality: that a valve offers the correct resistance, that an alarm activates at the right moment. Prioritising function over appearance is what allows what was learned to transfer to the real context.',\n  G7: 'A person\\'s engagement with the experience is built deliberately. If they complete a maintenance task quickly, the system can introduce a second, simultaneous fault to keep them challenged; if they struggle, it is better to simplify the scenario rather than exceed their capacity. It also helps to offer real options for how to solve the problem, rather than imposing a single correct path.',\n  G8: 'The evaluation must measure exactly what G1 set out to teach, no more and no less. Each action within the training functions as a piece of evidence that, combined with the others, allows one to infer whether the person truly masters the task \\u2014 closer to building a case than to taking a single snapshot at the end.',\n};\n\nfunction openSynthesisDetail(cat){\n  const d = state.data;\n  const CATS = {\n    domain: {label:'Your domain', field:'domain', value:LBL.domain[d.domain], icon:CAT_ICONS.domain, text:DOMAIN_FRAME[d.domain], head:DOMAIN_HEAD[d.domain], guids:DOMAIN_GUIDELINES},\n    skill:  {label:'Your skill type', field:'skillType', value:LBL.skillType[d.skillType], icon:CAT_ICONS.skill, text:SKILL_FRAME[d.skillType], head:SKILL_HEAD[d.skillType], guids:SKILL_GUIDELINES},\n    task:   {label:'Your task type', field:(visibleQs(d).includes('taskType')?'taskType':'skillType'), value:LBL.taskType[d.taskType], icon:CAT_ICONS.task, text:TASK_FRAME[d.taskType], head:TASK_HEAD[d.taskType], guids:TASK_GUIDELINES},\n  };\n  const c = CATS[cat];\n  if(!c) return;\n  const scoredS = getScoredGuidelines(d);\n  // Split the frame paragraph: context sentence + one concrete implication per guideline.\n  const parts = (c.text||'').split(/\\s*In practice, that means\\s*/);\n  const context = parts[0];\n  const impl = {};\n  if(parts[1]){ const re = /(?:^|,\\s*)(?:and\\s+)?(.+?)\\s*\\((G\\d)\\)/g; let m; while((m=re.exec(parts[1]))) impl[m[2]] = capFirst(m[1].trim()); }\n  const tail = parts[1] ? parts[1].replace(/^.*\\(G\\d\\)[,.]?\\s*/,'').replace(/\\.$/,'') : '';\n  const rows = c.guids.map(id=>scoredS.find(g=>g.id===id)).filter(Boolean).map(g=>{ const t=severityTier(g); return `<li class=\"syn-item\">\n      <p class=\"syn-do\">${((impl[g.id]||SNIP[g.id])+((tail && c.guids.length===1)?', '+tail:'')).replace(/\\.?$/,'.')}<\u002Fp>\n      <button class=\"syn-link\" onclick=\"closeSynthesisDetail();openGuidelineDetail('${g.id}')\">\n        <span class=\"syn-row-id\">${g.id}<\u002Fspan><span class=\"syn-row-name\">${g.name}<\u002Fspan>\n        <span class=\"dx-sev dx-sev-${sevCls(g,t)}\">${sevLabel(g,t)}<\u002Fspan><span class=\"syn-row-arr\" aria-hidden=\"true\">›<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fli>`; }).join('');\n  _lastFocused = document.activeElement;\n  const html = `\n  <div class=\"ws-backdrop\" onclick=\"if(event.target===this)closeSynthesisDetail()\">\n    <div class=\"ws-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"syn-title\">\n      <div class=\"ws-head\">\n        <div>\n          <div class=\"ws-eyebrow\" style=\"text-transform:none\">${c.label}<\u002Fdiv>\n          <h2 id=\"syn-title\" style=\"text-transform:capitalize\">${c.value}<\u002Fh2>\n        <\u002Fdiv>\n        <button class=\"ws-close\" onclick=\"closeSynthesisDetail()\" aria-label=\"Close\">&times;<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"ws-body\">\n        ${c.head?`<p class=\"syn-head\">${c.head}<\u002Fp>`:''}\n        <p class=\"syn-context\">${context}<\u002Fp>\n        <div class=\"syn-map-label\">What this means in practice<\u002Fdiv>\n        <ol class=\"syn-list\">${rows}<\u002Fol>\n        <button class=\"gm-change syn-change\" onclick=\"closeSynthesisDetail();editFromModal('${c.field}')\">Change this answer<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  const host = document.createElement('div');\n  host.id = 'synHost';\n  host.innerHTML = html;\n  document.body.appendChild(host);\n  document.body.style.overflow = 'hidden';\n  const closeBtn = host.querySelector('.ws-close');\n  if(closeBtn) closeBtn.focus();\n  document.addEventListener('keydown', _synKeydown);\n}\nfunction _synKeydown(e){\n  if(e.key === 'Escape'){ closeSynthesisDetail(); return; }\n  if(e.key !== 'Tab') return;\n  const modal = document.querySelector('#synHost .ws-modal');\n  if(!modal) return;\n  const f = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex=\"-1\"])');\n  if(!f.length) return;\n  const first = f[0], last = f[f.length-1];\n  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }\n  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }\n}\nfunction closeSynthesisDetail(){\n  const host = document.getElementById('synHost');\n  if(host) host.remove();\n  document.body.style.overflow = '';\n  document.removeEventListener('keydown', _synKeydown);\n  if(_lastFocused && _lastFocused.focus) _lastFocused.focus();\n}\n\nfunction openGuidelineIntro(id, isNav){\n  const g = GUIDELINES[id];\n  const diagram = DIAGRAMS[id];\n  const ids = Object.keys(GUIDELINES);\n  const idx = ids.indexOf(id);\n  const prevId = ids[(idx-1+ids.length)%ids.length];\n  const nextId = ids[(idx+1)%ids.length];\n  const existing = document.getElementById('giHost');\n  if(!isNav) _lastFocused = document.activeElement;\n  if(existing){ existing.remove(); document.removeEventListener('keydown', _giKeydown); }\n  const html = `\n  <div class=\"ws-backdrop\" onclick=\"if(event.target===this)closeGuidelineIntro()\">\n    <div class=\"ws-modal gi-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"gi-title\">\n      <div class=\"ws-head\">\n        <div>\n          <div class=\"ws-eyebrow\">${id} &middot; ${g.type}<\u002Fdiv>\n          <h2 id=\"gi-title\">${g.name}<\u002Fh2>\n        <\u002Fdiv>\n        <button class=\"ws-close\" onclick=\"closeGuidelineIntro()\" aria-label=\"Close\">&times;<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"ws-body gi-body\">\n        <div class=\"gi-col-text\"><p class=\"gi-text\">${GUIDELINE_INTRO[id]}<\u002Fp><\u002Fdiv>\n        ${diagram?`<div class=\"gi-col-diagram\"><div class=\"g-diagram\">${diagram.svg}<div class=\"g-diagram-caption\">${diagram.caption}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`:''}\n      <\u002Fdiv>\n      <div class=\"ws-foot gi-foot\">\n        <button class=\"ws-back gi-prev\" onclick=\"openGuidelineIntro('${prevId}', true)\" aria-label=\"Previous guideline, ${prevId}\">&larr; ${prevId}<\u002Fbutton>\n        <div class=\"gi-foot-spacer\">\n          <button class=\"btn\" onclick=\"closeGuidelineIntro()\">Close<\u002Fbutton>\n          <button class=\"btn btn-primary\" onclick=\"closeGuidelineIntro();startAssessment();\">Start the assessment →<\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"ws-back gi-next\" onclick=\"openGuidelineIntro('${nextId}', true)\" aria-label=\"Next guideline, ${nextId}\">${nextId} &rarr;<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n  const host = document.createElement('div');\n  host.id = 'giHost';\n  host.innerHTML = html;\n  document.body.appendChild(host);\n  document.body.style.overflow = 'hidden';\n  const closeBtn = host.querySelector('.ws-close');\n  if(closeBtn) closeBtn.focus();\n  document.addEventListener('keydown', _giKeydown);\n}\nfunction _giKeydown(e){\n  if(e.key === 'Escape'){ closeGuidelineIntro(); return; }\n  if(e.key === 'ArrowRight'){ const b = document.querySelector('#giHost .gi-next'); if(b){ e.preventDefault(); b.click(); } return; }\n  if(e.key === 'ArrowLeft'){ const b = document.querySelector('#giHost .gi-prev'); if(b){ e.preventDefault(); b.click(); } return; }\n  if(e.key !== 'Tab') return;\n  const modal = document.querySelector('#giHost .ws-modal');\n  if(!modal) return;\n  const f = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex=\"-1\"])');\n  if(!f.length) return;\n  const first = f[0], last = f[f.length-1];\n  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }\n  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }\n}\nfunction closeGuidelineIntro(){\n  const host = document.getElementById('giHost');\n  if(host) host.remove();\n  document.body.style.overflow = '';\n  document.removeEventListener('keydown', _giKeydown);\n  if(_lastFocused && _lastFocused.focus) _lastFocused.focus();\n}\n\nfunction renderHome(){\n  const p = state.participant || {};\n  return `${state.error?`<div class=\"err\">${state.error}<\u002Fdiv>`:''}\n  <h2 class=\"home-gl-h\">The eight guidelines<\u002Fh2>\n  <div class=\"home-guidelines\">\n    <button class=\"gl-row\" onclick=\"openGuidelineIntro('G1')\"><span class=\"gl-tag\">G1<\u002Fspan><b>Pedagogical Framing<\u002Fb> — define what the learner should be able to do, before any technology decision is made.<span class=\"gl-more\" aria-hidden=\"true\">&rsaquo;<\u002Fspan><\u002Fbutton>\n    <button class=\"gl-row\" onclick=\"openGuidelineIntro('G2')\"><span class=\"gl-tag\">G2<\u002Fspan><b>Task-Centered Structure<\u002Fb> — base the task on how practitioners actually work, not on assumption or documentation alone.<span class=\"gl-more\" aria-hidden=\"true\">&rsaquo;<\u002Fspan><\u002Fbutton>\n    <button class=\"gl-row\" onclick=\"openGuidelineIntro('G3')\"><span class=\"gl-tag\">G3<\u002Fspan><b>Temporal Progression<\u002Fb> — introduce difficulty gradually across stages, not all at once.<span class=\"gl-more\" aria-hidden=\"true\">&rsaquo;<\u002Fspan><\u002Fbutton>\n    <button class=\"gl-row\" onclick=\"openGuidelineIntro('G4')\"><span class=\"gl-tag\">G4<\u002Fspan><b>Embodied Interaction<\u002Fb> — make in-VR gestures physically resemble the real-world action being trained.<span class=\"gl-more\" aria-hidden=\"true\">&rsaquo;<\u002Fspan><\u002Fbutton>\n    <button class=\"gl-row\" onclick=\"openGuidelineIntro('G5')\"><span class=\"gl-tag\">G5<\u002Fspan><b>Multimodal Feedback<\u002Fb> — combine more than one feedback channel, and explain the error, not just flag it.<span class=\"gl-more\" aria-hidden=\"true\">&rsaquo;<\u002Fspan><\u002Fbutton>\n    <button class=\"gl-row\" onclick=\"openGuidelineIntro('G6')\"><span class=\"gl-tag\">G6<\u002Fspan><b>Contextual Functional Realism<\u002Fb> — prioritise correct behaviour over visual polish.<span class=\"gl-more\" aria-hidden=\"true\">&rsaquo;<\u002Fspan><\u002Fbutton>\n    <button class=\"gl-row\" onclick=\"openGuidelineIntro('G7')\"><span class=\"gl-tag\">G7<\u002Fspan><b>Proactive Experiential Design<\u002Fb> — design for engagement and flow as a target, not something only measured afterward.<span class=\"gl-more\" aria-hidden=\"true\">&rsaquo;<\u002Fspan><\u002Fbutton>\n    <button class=\"gl-row\" onclick=\"openGuidelineIntro('G8')\"><span class=\"gl-tag\">G8<\u002Fspan><b>Constructive Evaluation Articulation<\u002Fb> — make sure every evaluation metric traces back to the original learning objective.<span class=\"gl-more\" aria-hidden=\"true\">&rsaquo;<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n  <p class=\"home-lead\">Answer questions about your VR training project and see which of these eight guidelines need attention.<\u002Fp>\n  <div class=\"p-block\">\n    <div class=\"p-head\">For your exported brief <span class=\"p-optional\">(optional)<\u002Fspan><\u002Fdiv>\n    <div class=\"p-row\">\n      <label>Your name<input type=\"text\" value=\"${p.name||''}\" oninput=\"updateParticipant('name',this.value)\" placeholder=\"e.g. Participant 3\"><\u002Flabel>\n      <label>Role<input type=\"text\" value=\"${p.role||''}\" oninput=\"updateParticipant('role',this.value)\" placeholder=\"e.g. instructional designer\"><\u002Flabel>\n      <label>Training name<input type=\"text\" value=\"${p.project||''}\" oninput=\"updateParticipant('project',this.value)\" placeholder=\"e.g. Substation Lockout-Tagout\"><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"home-cta\">\n    ${Object.keys(state.data).length\n      ? `<button class=\"btn btn-primary\" onclick=\"continueAssessment()\">Continue where you left off →<\u002Fbutton>\n    <button class=\"aq-link\" onclick=\"startNew()\">Start a new assessment<\u002Fbutton>`\n      : `<button class=\"btn btn-primary\" onclick=\"startAssessment()\">Begin assessment →<\u002Fbutton>`}\n    <label class=\"resume-link\">\n      or resume a saved assessment\n      <input type=\"file\" accept=\"application/json,.json\" onchange=\"loadSession(this)\" hidden>\n    <\u002Flabel>\n    <p class=\"home-sub\">About 17 questions · 5 minutes · runs offline, nothing leaves this device<\u002Fp>\n  <\u002Fdiv>\n`;\n}\n\nfunction updateParticipant(field, value){\n  if(!state.participant) state.participant = {};\n  state.participant[field] = value;\n}\n\n\n// ── v8 ADAPTIVE JOURNEY: same validated items, asked one at a time.\n// Profile answers adapt what comes next (examples, hints, available options,\n// inferred answers); diagnostic answers never get evaluative feedback here. ──\nconst PHASES = [\n  {n:'01', name:'Define the training', ids:['stage','domain','skillType','expertise','objectivesDeclared']},\n  {n:'02', name:'Analyse the task', ids:['taskType','complexity','taskValidated','sessionStructure']},\n  {n:'03', name:'Design the interaction', ids:['immersion','interactionHW','gestureCorrespondence','feedbackChannels','debriefPlanned']},\n  {n:'04', name:'Experience and evaluation', ids:['realismPriority','experienceProactive','evalDesign']},\n];\nconst QTEXT = {\n  stage:'Where is this training right now?',\n  domain:'What field is this training for?',\n  skillType:'What kind of skill is being trained?',\n  expertise:'How experienced are the learners?',\n  objectivesDeclared:'Are the learning objectives written down as observable behaviours?',\n  taskType:'Which part of the task is hardest to get right?',\n  complexity:'How much does the learner need to track and decide at once?',\n  taskValidated:'Has the task been checked with practitioners?',\n  sessionStructure:'Is the training planned as progressive stages or a single session?',\n  interactionHW:'What input hardware is planned?',\n  gestureCorrespondence:'Do the planned in-VR gestures resemble the real action?',\n  feedbackChannels:'Does the planned in-task feedback use more than one channel?',\n  debriefPlanned:'Is a structured debrief planned for after each session?',\n  immersion:'How much will the learner physically do in VR?',\n  realismPriority:'If time or budget runs short, which kind of realism in the simulation gets done first?',\n  experienceProactive:'Have you planned how learners stay challenged without being overwhelmed?',\n  evalDesign:'How does the evaluation plan connect to the objectives?',\n};\nconst FIELD_BY_ID = {}; STEPS.forEach(s=>s.fields.forEach(f=>FIELD_BY_ID[f.id]=f));\nFIELD_BY_ID.stage = {id:'stage', kind:'profile', label:'Project stage', options:[\n  {val:'starting', name:'Just starting', desc:'Defining the idea. No design decisions made yet.'},\n  {val:'designing', name:'In design', desc:'Decisions are being made. Nothing built yet.'},\n  {val:'built', name:'Already built', desc:'Reviewing or improving an existing training.'},\n]};\n// Stage-specific phrasing: S = just starting (intentions), D = in design (decisions made), B = built (what was done).\n// Each entry: [question, yesName, yesDesc, noName, noDesc]; values stored stay yes/no.\nconst STAGED = {\n  objectivesDeclared:{\n    S:['Is writing observable learning objectives part of your plan, before choosing technology?','Part of the plan','Objectives will be written as observable behaviours first','Not in the plan','Objectives will stay informal or undefined'],\n    B:['Did the training start from written, observable learning objectives?','Yes','They were documented as observable behaviours','No','They were informal, or not defined']},\n  taskValidated:{\n    S:['Do you plan to validate the task structure with practitioners?','Part of the plan','Practitioners will review the task before design','Not in the plan','The task will come from documentation or assumption'],\n    B:['Was the task structure validated with practitioners?','Yes','Practitioners reviewed the task structure','No','It came from documentation or assumption']},\n  gestureCorrespondence:{\n    S:['Do you intend in-VR gestures to resemble the real action?','Yes, that’s the intent','The motion should mirror the real task','Generic input is fine','A button or trigger is enough'],\n    B:['Do the in-VR gestures resemble the real action?',null,null,null,null]},\n  feedbackChannels:{\n    S:['Do you intend to combine more than one feedback channel?','Yes, that’s the intent','Visual, audio and/or haptic for the same event','One channel is enough','Typically on-screen text'],\n    B:['Does in-task feedback combine more than one channel?',null,null,null,null]},\n  debriefPlanned:{\n    S:['Is a structured post-session debrief part of your plan?','Part of the plan','A report the learner can revisit','Not in the plan','Only in-the-moment feedback'],\n    B:['Does the training include a structured post-session debrief?','Yes','A report the learner can revisit','No','Only in-the-moment feedback']},\n  experienceProactive:{\n    S:['Do you intend to plan how learners stay challenged without being overwhelmed?','Yes, that’s the intent','Pacing and difficulty will be design targets','Check it afterward','Engagement will be measured with a survey'],\n    B:['Was the training designed to keep learners challenged without overwhelming them?','Yes','Pacing and difficulty were design targets','Checked afterward only','Engagement was measured with a survey']},\n  sessionStructure:{ S:['Do you plan progressive stages or a single session?'], B:['Is the training structured as progressive stages or a single session?'] },\n  realismPriority:{ S:['If time or budget runs short, which kind of realism in the simulation will get done first?'], B:['When time or budget ran short, which kind of realism in the simulation got done first?'] },\n  immersion:{ B:['How much does the learner physically do in VR?'] },\n  interactionHW:{ B:['What input hardware does the training use?'] },\n};\nconst EVAL_STAGED = {\n  S:{q:'How do you intend evaluation to connect to the objectives?', none:['Not decided yet','Normal at this point. Evaluation hasn’t been thought through yet.']},\n  D:{q:'How does the evaluation plan connect to the objectives?', none:['Not planned yet','Evaluation hasn’t been decided on yet']},\n  B:{q:'How does the evaluation connect to the objectives?', none:['No evaluation','The training hasn’t been formally evaluated']},\n};\n// \"Partly\" is offered only where real projects are commonly half-way. Scored as a lighter gap.\nconst PARTIAL = {\n  objectivesDeclared:{S:['Partly','Some objectives will be written, others left informal'], B:['Partly','Some are written as observable behaviours, others are informal']},\n  taskValidated:{S:['Partly','Only some steps will be reviewed by practitioners'], B:['Partly','Some steps were checked with practitioners, others were not']},\n  gestureCorrespondence:{S:['For some actions','Key actions mirror the real motion, others use buttons'], B:['For some actions','Key actions mirror the real motion, others use buttons']},\n  feedbackChannels:{S:['For some events','Critical errors combine channels, the rest use one'], B:['For some events','Critical errors combine channels, the rest use one']},\n  experienceProactive:{S:['Partly','Some pacing is planned, the rest is checked afterward'], B:['Partly','Some pacing was planned, the rest checked afterward']},\n};\n// Realism trade-off: the domain example lives inside each option, so the choice reads concretely.\nconst REAL_EX = {\n  clinical:['Tissue that resists the needle correctly','A photorealistic operating room'],\n  industrial:['A valve that needs real torque to turn','A photorealistic plant'],\n  educational:['A reaction that responds correctly to wrong quantities','A photorealistic lab'],\n  emergency:['Smoke that spreads and blocks exits correctly','Photorealistic flames and debris'],\n};\n// Always-visible example: recognition over recall for the jargon-heavy items.\nconst EXQ = {\n  objectivesDeclared:{\n    clinical:'Example: “Places a central line with no break in sterility”, rather than “Understands sterile technique”.',\n    industrial:'Example: “Completes lockout/tagout in under 3 minutes with no skipped step”, rather than “Knows the safety procedure”.',\n    educational:'Example: “Calibrates the pipette within ±2%”, rather than “Understands lab technique”.',\n    emergency:'Example: “Triage-tags 10 casualties correctly in under 5 minutes”, rather than “Understands triage”.',\n    _:'Example: “Performs X to standard Y within Z minutes”, rather than “Understands X”.'},\n  taskValidated:'Practitioners are people who do this job today. Manuals and client briefs alone don’t count.',\n};\n// Neutral definitions shown before answering. Prescription and precedent stay\n// in the results, so the \"right\" answer isn't signalled while answering.\nconst DEFS = {\n  objectivesDeclared:'An observable objective describes something you could watch the learner do and check, with a condition and a standard.',\n  taskValidated:'Validated means someone who performs the task today has checked the steps, their order and the decision points.',\n  sessionStructure:'Progressive stages: the training is split into sessions or levels, with support removed or difficulty added as the learner advances.',\n  gestureCorrespondence:'Correspondence: the hand or body movement in VR resembles the real one (turning, pulling, squeezing) instead of a button press that triggers it.',\n  feedbackChannels:'A channel is the sense feedback reaches: sight (a visual cue), hearing (a sound) or touch (vibration, resistance).',\n  debriefPlanned:'A debrief is a summary after the session (what went well, which errors, when) that the learner or instructor can look at again later.',\n  realismPriority:'Functional realism is how things behave: physics, rules, consequences. Visual fidelity is how they look.',\n  experienceProactive:'This asks whether engagement is a target decided up front (pacing, difficulty, session length) or only measured afterward.',\n  evalDesign:'Linked means each thing you measure answers whether a specific objective was met.',\n};\nconst stageKey = d => d.stage==='starting' ? 'S' : d.stage==='built' ? 'B' : 'D';\nconst QORDER = PHASES.flatMap(p=>p.ids);\nconst phaseOf = id => PHASES.find(p=>p.ids.includes(id));\nconst optName = (id,v) => ((FIELD_BY_ID[id].options.find(o=>o.val===v))||{}).name;\nconst low = (id,d) => (optName(id,d[id])||'').toLowerCase();\nconst SKILL_TO_TASK = {procedural:'sequential', perceptual:'manipulative', decision:'decision'};\nconst SKILL_EX = {\n  clinical:   {procedural:'A sterile set-up or medication checklist', perceptual:'Suturing, catheter insertion, ultrasound probe handling', decision:'Triage or differential diagnosis under time pressure'},\n  industrial: {procedural:'A lockout/tagout or machine shutdown sequence', perceptual:'Welding, torque tools, precise assembly', decision:'Diagnosing a fault before acting on it'},\n  educational:{procedural:'Following a laboratory protocol', perceptual:'Pipetting, instrument handling', decision:'Choosing an experimental set-up'},\n  emergency:  {procedural:'An evacuation or decontamination protocol', perceptual:'Operating rescue or firefighting equipment', decision:'Incident command and resource allocation'},\n};\n// Which questions this user actually sees.\nfunction visibleQs(d){ return QORDER.filter(id => !(id==='taskType' && SKILL_TO_TASK[d.skillType])); }\n// Question as adapted to the answers so far.\nfunction adaptQ(id, d){\n  const f = FIELD_BY_ID[id];\n  let hint = f.kind==='diagnostic' ? f.hint : '';\n  let options = f.options;\n  if(id==='skillType' && SKILL_EX[d.domain]){\n    const ex = SKILL_EX[d.domain];\n    options = options.map(o => ex[o.val] ? {...o, desc: ex[o.val]} : o);\n  }\n  if(id==='taskType'){\n    // Only reached when skill = mixed: ask for the dominant component instead of repeating the skill question.\n    const ex = SKILL_EX[d.domain] || {};\n    const M = {sequential:['Following the steps in order', ex.procedural], decision:['Deciding what to do', ex.decision], manipulative:['Handling equipment by hand', ex.perceptual]};\n    options = options.map(o => M[o.val] ? {...o, name:M[o.val][0], desc:M[o.val][1] || o.desc} : o);\n  }\n  if(id==='complexity' && d.taskType) hint = 'For a '+low('taskType',d)+' task.';\n  if(id==='gestureCorrespondence'){\n    hint = 'Think of the main action in the task, for example turning, pulling or squeezing.';\n  }\n  if(id==='feedbackChannels') hint = 'Think of what the learner gets when they make an error.';\n  if(id==='experienceProactive') hint = d.complexity==='high'\n    ? 'At high complexity this can mean adjusting pacing or difficulty in real time.'\n    : 'At '+(low('complexity',d)||'this')+' complexity this can be as simple as planning session length and pacing.';\n  if(id==='evalDesign'){\n    if(d.objectivesDeclared==='no'){ options = options.filter(o=>o.val!=='linked'); hint = 'Without written objectives, metrics can’t be linked to them.'; }\n    else hint = '';\n  }\n  const sk = stageKey(d); let q = QTEXT[id];\n  const st = STAGED[id] && STAGED[id][sk];\n  if(st){\n    q = st[0] || q;\n    if(st.length>1) options = options.map(o => o.val==='yes' ? {...o, name:st[1]||o.name, desc:st[2]||o.desc} : o.val==='no' ? {...o, name:st[3]||o.name, desc:st[4]||o.desc} : o);\n  }\n  if(id==='evalDesign'){ const e = EVAL_STAGED[sk]; q = e.q; options = options.map(o => o.val==='none' ? {...o, name:e.none[0], desc:e.none[1]} : o); }\n  if(id==='realismPriority' && REAL_EX[d.domain]){ const e = REAL_EX[d.domain]; options = options.map(o => o.val==='functional' ? {...o, desc:e[0]} : o.val==='visual' ? {...o, desc:e[1]} : o); }\n  if(PARTIAL[id]){ const p = PARTIAL[id][sk==='S'?'S':'B']; const i = options.findIndex(o=>o.val==='yes'); options = [...options.slice(0,i+1), {val:'partial', name:p[0], desc:p[1]}, ...options.slice(i+1)]; }\n  if((id==='interactionHW' || id==='immersion') && d.stage==='built') options = options.filter(o=>o.val!=='undecided');\n  if(hint===f.hint) hint = '';\n  const ex = EXQ[id] ? (typeof EXQ[id]==='string' ? EXQ[id] : (EXQ[id][d.domain] || EXQ[id]._)) : '';\n  return {f, hint, options, q, ex};\n}\n// The tool's reply to the previous profile answer — shown at the top of the next question.\nfunction replyFor(prevId, d){\n  if(!prevId || !d[prevId]) return '';\n  const eff = (g)=>{ const e=computeEffort(g,d); if(!e) return ''; const L={low:'low',medium:'medium',high:'high',varies:'variable'}; return g+' effort for you: '+L[e.effort]+'. '+e.note; };\n  switch(prevId){\n    case 'stage': return {starting:'Questions will ask what you intend to do.', designing:'Questions will ask about decisions already made.', built:'Questions will ask about what the training does now.'}[d.stage];\n    case 'domain': return d.domain==='other' ? '' : 'Examples from here on are adapted to '+low('domain',d)+' training.';\n    case 'skillType': return SKILL_TO_TASK[d.skillType] ? '' : 'Most real tasks mix skills. Pick the part the advice should focus on.';\n  }\n  return '';\n}\nfunction firstUnanswered(){ const v=visibleQs(state.data); const i=v.findIndex(id=>!state.data[id]); return i<0 ? v.length-1 : i; }\n\nfunction renderStep(){\n  const d = state.data, v = visibleQs(d);\n  if(state.q==null || state.q>=v.length) state.q = Math.min(state.q||0, v.length-1);\n  const id = v[state.q], ph = phaseOf(id);\n  const {f, hint, options, q, ex} = adaptQ(id, d);\n  const answered = v.filter(k=>d[k]).length;\n  const allAnswered = answered===v.length, isLast = state.q===v.length-1;\n  let reply = replyFor(v[state.q-1], d);\n  const prevPh = state.q>0 && phaseOf(v[state.q-1]);\n  if(prevPh && prevPh!==ph) reply = '<strong>'+prevPh.name+': done.<\u002Fstrong> '+(reply||'Next: '+ph.name.toLowerCase()+'.');\n  const profile = ['stage','domain','skillType','expertise','taskType','complexity','interactionHW','immersion'].map(k=>{\n      if(!d[k]) return '';\n      const at = v.includes(k) ? v.indexOf(k) : v.indexOf('skillType');\n      return at < state.q ? '<button class=\"aq-chip\" onclick=\"goQ('+at+')\" title=\"Change this answer\">'+optName(k,d[k])+'<\u002Fbutton>' : '';\n    }).join('');\n  const why = DEFS[id] ? '<details class=\"aq-why\"><summary>What this means<\u002Fsummary><p>'+DEFS[id]+'<\u002Fp><\u002Fdetails>' : '';\n  const unsure = f.kind==='diagnostic' ? '<button class=\"aq-unsure'+(d[id]==='unsure'?' sel':'')+'\" role=\"radio\" aria-checked=\"'+(d[id]==='unsure')+'\" onclick=\"pickOpt(\\''+id+'\\',\\'unsure\\')\">'+(d[id]==='unsure'?'✓ Marked to check later':'I’m not sure. Mark it to check later')+'<\u002Fbutton>' : '';\n  return '<div class=\"aq\">'\n    +'<div class=\"aq-top\"><span class=\"aq-phase\">'+ph.n+' · '+ph.name+'<\u002Fspan><span class=\"aq-count\">Phase '+(PHASES.indexOf(ph)+1)+' of '+PHASES.length+'<\u002Fspan><\u002Fdiv>'\n    +'<div class=\"aq-bar\" aria-hidden=\"true\">'+PHASES.map(p=>{const ids=p.ids.filter(k=>v.includes(k)); const n=ids.filter(k=>d[k]).length; return '<i style=\"flex:'+ids.length+'\"><span style=\"width:'+Math.round(n/ids.length*100)+'%\"><\u002Fspan><\u002Fi>';}).join('')+'<\u002Fdiv>'\n    +(profile?'<div class=\"aq-profile\" aria-label=\"Your project so far\">'+profile+'<\u002Fdiv>':'')\n    +(reply?'<p class=\"aq-reply\" aria-live=\"polite\">'+reply+'<\u002Fp>':'')\n    +'<h2 class=\"aq-q\" id=\"aq-q\">'+q+'<\u002Fh2>'\n    +(hint?'<p class=\"aq-hint\">'+hint+'<\u002Fp>':'')\n    +(ex?'<p class=\"aq-ex\">'+ex+'<\u002Fp>':'')\n    +'<div class=\"aq-opts\" role=\"radiogroup\" aria-labelledby=\"aq-q\">'\n    +options.map(o=>{const sel=d[id]===o.val;return '<button class=\"aq-opt'+(sel?' sel':'')+'\" role=\"radio\" aria-checked=\"'+sel+'\" onclick=\"pickOpt(\\''+id+'\\',\\''+o.val+'\\')\"><span class=\"aq-opt-name\">'+o.name+'<\u002Fspan><span class=\"aq-opt-desc\">'+o.desc+'<\u002Fspan><\u002Fbutton>'}).join('')\n    +unsure\n    +'<\u002Fdiv>'\n    +(state.error?'<div class=\"err\" role=\"alert\" aria-live=\"assertive\">'+state.error+'<\u002Fdiv>':'')\n    +'<div class=\"aq-foot\">'\n    +'<button class=\"aq-link\" onclick=\"goBack()\">← Back<\u002Fbutton>'\n    +why\n    +(isLast||allAnswered ? '<button class=\"btn btn-primary\" onclick=\"'+(allAnswered?(isLast?'goNext()':'backToResults()'):'goNext()')+'\">'+(allAnswered&&!isLast?'Back to results →':'View diagnosis →')+'<\u002Fbutton>' : '<button class=\"aq-link\" onclick=\"saveSession()\">Save for later<\u002Fbutton>')\n    +'<\u002Fdiv><\u002Fdiv>';\n}\nfunction goQ(i){ state.screen='steps'; state.q=i; state.error=''; state.errorField=null; render(); }\nfunction pickOpt(id, val){\n  const d = state.data;\n  d[id] = val; state.error=''; state.errorField=null;\n  if(id==='skillType'){ if(SKILL_TO_TASK[val]) d.taskType = SKILL_TO_TASK[val]; else if(state._inferredTask) delete d.taskType; state._inferredTask = !!SKILL_TO_TASK[val]; }\n  if(id==='objectivesDeclared' && val==='no' && d.evalDesign==='linked') delete d.evalDesign;\n  render();\n  const v = visibleQs(d);\n  if(state.q < v.length-1 && !v.every(k=>d[k])){ clearTimeout(state._adv); state._adv = setTimeout(()=>{ state.q++; render(); }, 260); }\n}\ndocument.addEventListener('keydown', e=>{\n  if(state.screen!=='steps' || document.querySelector('.ws-overlay, .ws-modal') || e.metaKey || e.ctrlKey || e.altKey) return;\n  if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))) return;\n  const v = visibleQs(state.data), {options} = adaptQ(v[state.q], state.data);\n  const n = parseInt(e.key,10);\n  if(n>=1 && n<=options.length){ pickOpt(v[state.q], options[n-1].val); e.preventDefault(); }\n  else if(e.key==='Enter' && !(e.target.closest && e.target.closest('button,summary'))){ goNext(); e.preventDefault(); }\n});\n\n// Surface the framework's own dependency structure: what must be settled first,\n// and what this decision will constrain downstream. Turns the list into a sequence.\nfunction renderDeps(g, d){\n  const dep = DEPENDS[g.id];\n  if(!dep) return '';\n  const openReqs = dep.requires.filter(r => isFlagged(d, r));\n  const parts = [];\n\n  if(openReqs.length){\n    const links = openReqs.map(r=>`<a href=\"#\" class=\"g-dep-link\" onclick=\"jumpTo('${r}');return false;\">${r}<\u002Fa>`).join(' and ');\n    parts.push(`<div class=\"g-dep-warn\">\n      <strong>Settle ${links} first.<\u002Fstrong>\n      ${openReqs.length===1?'It is':'They are'} also flagged, and ${g.id} depends on ${openReqs.length===1?'it':'them'} —\n      decisions made here may need redoing once ${openReqs.length===1?'it changes':'they change'}.\n    <\u002Fdiv>`);\n  }\n\n  const bits = [];\n  if(dep.requires.length) bits.push(`<span class=\"g-dep-k\">Builds on<\u002Fspan> ${dep.requires.join(', ')}`);\n  if(dep.informs.length)  bits.push(`<span class=\"g-dep-k\">Feeds into<\u002Fspan> ${dep.informs.join(', ')}`);\n  if(bits.length){\n    parts.push(`<div class=\"g-dep\">${bits.join(' &nbsp;·&nbsp; ')} <span class=\"g-dep-note\">${dep.note}<\u002Fspan><\u002Fdiv>`);\n  }\n  return parts.join('');\n}\n\n// Compact effort/payoff chip for the dashboard tiles.\n// Which of the user's profile answers adapted this guideline's advice — shown\n// on each tile so the link between \"what I answered\" and \"what I'm told\" is visible.\nfunction capFirst(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }\nfunction tailoredBy(id, d){\n  const out=[];\n  if(d.domain && DOMAIN_GUIDELINES.includes(id)) out.push(LBL.domain[d.domain]);\n  if(d.skillType && SKILL_GUIDELINES.includes(id)) out.push(LBL.skillType[d.skillType]);\n  if(d.taskType && TASK_GUIDELINES.includes(id) && LBL.taskType[d.taskType]) out.push(LBL.taskType[d.taskType]+' task');\n  return out;\n}\nfunction tailoredTag(id, d){\n  const t=tailoredBy(id,d);\n  return t.length?`<div class=\"gd-tailored\"><span class=\"gd-tailored-k\">Tailored<\u002Fspan>${capFirst(t.join(' · '))}<\u002Fdiv>`:'';\n}\n\nfunction renderGuidelineCardBody(g, d, opts){\n  opts = opts || {};\n  const ex = EXAMPLES[g.id];\n  const diagram = DIAGRAMS[g.id];\n  return `<div class=\"g-header\">\n        <span class=\"g-icon\" style=\"background:${g.iconBg};color:${g.iconFg}\">${ICONS[g.id]}<\u002Fspan>\n        <div class=\"g-header-text\">\n          <div><span class=\"g-badge ${g.type.toLowerCase()}\">${g.type}<\u002Fspan> <span class=\"g-name\">${g.id} — ${g.name}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        ${g.flagged?`<span class=\"g-flag\">⚑ ${sevLabel(g,severityTier(g)).toLowerCase()}<\u002Fspan>`:''}\n      <\u002Fdiv>\n      <p class=\"g-prescription\">${g.prescription}<\u002Fp>\n      ${g.why?`<div class=\"g-why\"><strong>Why this is flagged for you:<\u002Fstrong> you answered “${g.why[1]}” to “${g.why[0]}”.${SOFT_NOTE[g.soft]||''}<\u002Fdiv>`:''}\n      ${renderDeps(g, d)}\n      <details class=\"g-details\" id=\"details-${g.id}\"${opts.openDetails?' open':''}>\n        <summary>How to fix this <span class=\"g-details-sub\">— pattern, steps, worksheet, and pitfalls<\u002Fspan><\u002Fsummary>\n        ${diagram?`<div class=\"g-diagram\">${diagram.svg}<div class=\"g-diagram-caption\">${diagram.caption}<\u002Fdiv><\u002Fdiv>`:''}\n        <div class=\"g-action\">\n          <span class=\"g-action-label\">How to put this into practice<\u002Fspan>\n          ${g.action.map((line,i)=>i===0\n            ? `<p class=\"g-action-primary\">${line}<\u002Fp>`\n            : `<p class=\"g-action-context\">${line}<\u002Fp>`).join('')}\n        <\u002Fdiv>\n        <button class=\"ws-open\" onclick=\"openWorksheet('${g.id}')\">\n          <span class=\"ws-open-icon\" aria-hidden=\"true\">▤<\u002Fspan>\n          <span><strong>Open the ${WORKSHEETS[g.id].title}<\u002Fstrong><\u002Fspan>\n          <span class=\"ws-open-arrow\" aria-hidden=\"true\">→<\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"g-example-row\">\n          <div class=\"g-example poor\"><div class=\"g-example-label\">✗ Common pitfall<\u002Fdiv>${ex.poor}<\u002Fdiv>\n          <div class=\"g-example good\"><div class=\"g-example-label\">✓ Better approach<\u002Fdiv>${ex.good}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"g-realworld\">\n          <div class=\"g-realworld-label\">Someone already did this<\u002Fdiv>\n          <p><strong>${g.exemplar.study}<\u002Fstrong> — ${g.exemplar.note}.<\u002Fp>\n        <\u002Fdiv>\n        ${(()=>{const eff=computeEffort(g.id,d); return eff?`<div class=\"g-effort\">\n          <div class=\"g-effort-head\">\n            <span class=\"g-effort-label\">Effort vs. payoff<\u002Fspan>\n            <span class=\"eff-chip eff-${eff.effort}\">${({low:'Low effort',medium:'Medium effort',high:'High effort',varies:'Effort varies'})[eff.effort]}<\u002Fspan>\n            <span class=\"eff-chip eff-payoff-${eff.payoff}\">${({high:'High retention payoff',varies:'Payoff depends on context'})[eff.payoff]}<\u002Fspan>\n          <\u002Fdiv>\n          <p>${eff.note}<\u002Fp>\n        <\u002Fdiv>`:'';})()}\n        <div class=\"g-footer\">\n          <strong>Research grounding:<\u002Fstrong> ${g.theory} &nbsp;·&nbsp;\n          <strong>How common this gap is:<\u002Fstrong> ${g.gap.pct}% of the studies we reviewed\n        <\u002Fdiv>\n      <\u002Fdetails>`;\n}\n\nfunction renderResults(){\n  const d=state.data;\n  const scored=getScoredGuidelines(d);\n  const answerTables = getAnswerTables(d);\n\n  const flaggedCount = scored.filter(g=>g.flagged).length;\n\n  // Effort lane per guideline — shared by the overview band and the card grid.\n  const laneOf = g => {\n    if(!g.flagged) return 'ok';\n    const e = computeEffort(g.id, d);\n    return (e && e.effort==='low') ? 'low' : 'higher';\n  };\n  const onTrack = 8 - flaggedCount;\n  const tierById = {};\n  scored.forEach(g=>{ tierById[g.id] = severityTier(g); });\n  const ringSvg = renderGuidelineRing(tierById, 220, {clickable:true, ariaLabel:`Your diagnosis: ${onTrack} of 8 guidelines on track, ${flaggedCount} to review.`});\n\n  const FIELD_STEP = {};\n  STEPS.forEach((s,i)=>s.fields.forEach(f=>{ FIELD_STEP[f.id]=i; }));\n\n  // ── 1. WHO YOU ARE — the training profile and what it changes.\n  // Read first: it frames every recommendation that follows. ──\n  const taskName = LBL.taskType[d.taskType];\n  const cols = [];\n  if(d.domain) cols.push({cat:'Domain', key:'domain', field:'domain', val:LBL.domain[d.domain], head:DOMAIN_HEAD[d.domain], guids:DOMAIN_GUIDELINES});\n  if(d.skillType) cols.push({cat:'Skill type', key:'skill', field:'skillType', val:LBL.skillType[d.skillType], head:SKILL_HEAD[d.skillType], guids:SKILL_GUIDELINES});\n  if(taskName) cols.push({cat:'Task type', key:'task', field:'taskType', val:taskName, head:TASK_HEAD[d.taskType], guids:TASK_GUIDELINES});\n  const meta = [\n    d.expertise && {field:'expertise', txt:`${capFirst(LBL.expertise[d.expertise])} learners`},\n    d.interactionHW && {field:'interactionHW', txt:capFirst(LBL.interactionHW[d.interactionHW])},\n    d.immersion && d.immersion!=='undecided' && {field:'immersion', txt:`${capFirst(d.immersion)} immersion`},\n  ].filter(Boolean);\n  let h=`<section class=\"tailor\" aria-label=\"Your training profile\">\n    <div class=\"tailor-head\">\n      <span class=\"tailor-kicker\">Your training<\u002Fspan>\n      <span class=\"tailor-meta\">${meta.map(m=>`<button class=\"tailor-edit\" onclick=\"editStep(${FIELD_STEP[m.field]})\" title=\"Change this answer\">${m.txt}<\u002Fbutton>`).join(' · ')}<\u002Fspan>\n    <\u002Fdiv>\n    ${cols.length?`<div class=\"tailor-grid tailor-${cols.length}\">${cols.map(x=>`\n      <button class=\"tailor-col tailor-card\" onclick=\"openSynthesisDetail('${x.key}')\">\n        <span class=\"tailor-cat\">${x.cat} · <strong>${capFirst(x.val)}<\u002Fstrong><\u002Fspan>\n        <span class=\"tailor-text\">${x.head}<\u002Fspan>\n        <span class=\"tailor-why\">What this means ›<\u002Fspan>\n      <\u002Fbutton>`).join('')}\n    <\u002Fdiv>`:''}\n  <\u002Fsection>`;\n\n  // Scoring, data table and raw answers — one disclosure at the end (Hick's Law,\n  // progressive disclosure). Built here, appended before the limits panel.\n  const detailsHtml = `<details class=\"data-table-toggle more-data\">\n    <summary>Scoring method, data table, and your answers<\u002Fsummary>\n    <h4 class=\"more-data-h\">How the priority score is calculated<\u002Fh4>\n    <p class=\"score-explain\"><strong>${SCORING.formula}.<\u002Fstrong> ${SCORING.detail}<\u002Fp>\n    <h4 class=\"more-data-h\">Priority scores<\u002Fh4>\n    <table>\n      <caption>Priority scores per guideline, sorted highest to lowest<\u002Fcaption>\n      <thead><tr><th scope=\"col\">Guideline<\u002Fth><th scope=\"col\">Name<\u002Fth><th scope=\"col\">Priority score (0–100)<\u002Fth><th scope=\"col\">Status<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>${scored.map(g=>`<tr><th scope=\"row\">${g.id}<\u002Fth><td>${g.name}<\u002Ftd><td>${g.score}<\u002Ftd><td>${g.flagged?sevLabel(g,'mod'):'No gap detected'}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody>\n    <\u002Ftable>\n    <h4 class=\"more-data-h\">Your answers<\u002Fh4>\n    <table>\n      <caption>What you entered, step by step<\u002Fcaption>\n      <thead><tr><th scope=\"col\">Question<\u002Fth><th scope=\"col\">Your answer<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>${[...answerTables.ctx, ...answerTables.diag].map(([q,a])=>`<tr><th scope=\"row\">${q}<\u002Fth><td>${a}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fdetails>`;\n\n  // ── 2. YOUR DIAGNOSIS — radar (overview) + effort lanes (the cards themselves).\n  // One representation per idea: severity lives in the radar and each card's label;\n  // effort lives in the lane; no separate hero, pill index or score bar. ──\n  const LANES = [\n    {key:'low', title:'Low effort — start here', sub:'Mostly planning time, not build time.'},\n    {key:'higher', title:'Higher effort — plan and budget for it', sub:'Real design or development time. Decide how far to go before committing.'},\n    {key:'ok', title:'Already on track', sub:''},\n  ];\n  const SEV = {crit:'Critical', mod:'Worth reviewing', ok:'On track'};\n  const rowHtml = g=>{\n    const tier = severityTier(g);\n    return `<button class=\"dx-row\" onclick=\"openGuidelineDetail('${g.id}')\" aria-label=\"${g.id} — ${g.name}, ${sevLabel(g,tier)}. Open details.\">\n      <span class=\"dx-row-icon\" style=\"background:${g.iconBg};color:${g.iconFg}\">${ICONS[g.id]}<\u002Fspan>\n      <span class=\"dx-row-body\">\n        <span class=\"dx-row-top\"><span class=\"dx-row-id\">${g.id}<\u002Fspan><span class=\"dx-sev dx-sev-${sevCls(g,tier)}\">${sevLabel(g,tier)}<\u002Fspan><\u002Fspan>\n        <span class=\"dx-row-name\">${g.name}<\u002Fspan>\n        <span class=\"dx-row-snip\">${SNIP[g.id]}<\u002Fspan>\n        ${tailoredBy(g.id,d).length?`<span class=\"gd-tailored\" title=\"Adapted to: ${capFirst(tailoredBy(g.id,d).join(' · '))}\"><span class=\"gd-tailored-k\">Tailored<\u002Fspan><\u002Fspan>`:''}\n      <\u002Fspan>\n    <\u002Fbutton>`;\n  };\n  const fullView = state.resultsView==='overview';\n  const lanesHtml = LANES.map(lane=>{\n    const items = scored.filter(g=>laneOf(g)===lane.key);\n    if(!items.length) return '';\n    let body;\n    if(lane.key==='ok') body = `<div class=\"gd-ok-row\">${items.map(g=>`<button class=\"gd-ok-chip\" onclick=\"openGuidelineDetail('${g.id}')\" aria-label=\"${g.id} — ${g.name}, on track. Open details.\"><span class=\"gd-ok-id\">${g.id}<\u002Fspan>${g.name}<\u002Fbutton>`).join('')}<\u002Fdiv>`;\n    else if(fullView) body = items.map(g=>`<article class=\"gm-card\" id=\"card-${g.id}\">${renderGuidelineModal(g, d, {inline:true})}<\u002Farticle>`).join('');\n    else body = `<div class=\"dx-grid\">${items.map(rowHtml).join('')}<\u002Fdiv>`;\n    return `<div class=\"dx-lane dx-lane-${lane.key}\">\n      <div class=\"dx-lane-head\"><span class=\"dx-lane-title\">${lane.title}<\u002Fspan>${lane.sub?`<span class=\"dx-lane-sub\">${lane.sub}<\u002Fspan>`:''}<\u002Fdiv>\n      ${body}\n    <\u002Fdiv>`;\n  }).join('');\n\n  h+=`<section class=\"diag\" aria-label=\"Your diagnosis\">\n    <div class=\"diag-side\">\n      <div class=\"ov-kicker\">Your diagnosis<\u002Fdiv>\n      <div class=\"diag-title\">${flaggedCount===0?'All 8 on track':`${flaggedCount} to review · ${onTrack} on track`}<\u002Fdiv>\n      <div class=\"diag-ring\">${ringSvg}<\u002Fdiv>\n      <div class=\"diag-legend\">\n        <span><span class=\"gd-legend-dot\" style=\"background:#C7302E\"><\u002Fspan>Act first<\u002Fspan>\n        <span><span class=\"gd-legend-dot\" style=\"background:#B5791A\"><\u002Fspan>Review or verify<\u002Fspan>\n        <span><span class=\"gd-legend-dot\" style=\"background:#2E8B4E\"><\u002Fspan>On track<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"diag-note\">${flaggedCount===0\n        ? 'None of your answers matched the common failure patterns from the review.'\n        : (onTrack?'<strong>Already solid:<\u002Fstrong> '+scored.filter(g=>!g.flagged).map(g=>g.name).join(', ')+'. ':'')+'Each guideline is a target, not a mandate. Go as far as your project’s stakes justify, checked against your G1 objective.'}<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"diag-main\">\n      <div class=\"diag-view\" role=\"group\" aria-label=\"Card view\">\n        <button class=\"diag-view-btn${fullView?'':' active'}\" aria-pressed=\"${!fullView}\" onclick=\"setResultsView('dashboard')\">Summary<\u002Fbutton>\n        <button class=\"diag-view-btn${fullView?' active':''}\" aria-pressed=\"${fullView}\" onclick=\"setResultsView('overview')\">Full cards<\u002Fbutton>\n      <\u002Fdiv>\n      ${lanesHtml}\n    <\u002Fdiv>\n  <\u002Fsection>`;\n\n  // ── Bridge from diagnosis to build: what to actually do next, in order.\n  // Added after Cycle 2 specialist feedback that the tool stopped at \"here are\n  // your gaps\" without connecting to how the person then starts building. ──\n  h+=`<div class=\"next-steps-bridge\">\n    <h3>From diagnosis to build — what to do next<\u002Fh3>\n    <ol class=\"nsb-list\">\n      <li><strong>Open each flagged card, easiest first.<\u002Fstrong> Each card has a worksheet that produces a table you can hand to your team.<\u002Fli>\n      <li><strong>Fix the foundations before the details.<\u002Fstrong> Settle what other guidelines build on first, or downstream work gets redone.<\u002Fli>\n      <li><strong>Re-run this diagnosis once those are addressed.<\u002Fstrong> Save your session and load it later to see which gaps remain.<\u002Fli>\n      <li><strong>Carry the evaluation plan into the build.<\u002Fstrong> Whatever G8 asks you to measure has to be instrumented while the experience is being built.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>`;\n\n  h+=detailsHtml;\n  h+=`<details class=\"data-table-toggle more-data\">\n    <summary>Where this comes from, and what it doesn't cover yet<\u002Fsummary>\n    <ul class=\"limits-list\" style=\"margin-top:8px\">${LIMITS.map(l=>`<li>${l}<\u002Fli>`).join('')}<\u002Ful>\n  <\u002Fdetails>\n  <div class=\"artifact-stamp\">\n    VR Training Design Framework — version ${ARTIFACT.version} · ${ARTIFACT.build} · released ${ARTIFACT.released}<br>\n    ${ARTIFACT.framework}\n  <\u002Fdiv>`;\n\n  h+=`<div class=\"nav\">\n    <button class=\"btn\" onclick=\"restart()\">← Restart assessment<\u002Fbutton>\n    <div class=\"export-row\">\n      <button class=\"btn\" onclick=\"copyResultsText()\">Copy as text<\u002Fbutton>\n      <button class=\"btn\" onclick=\"saveSession()\" title=\"A file you can send to the researcher or reopen later\">Download results ⇩<\u002Fbutton>\n      <button class=\"btn btn-primary\" onclick=\"openBrief()\">Full design brief ↗<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"copyConfirm\" style=\"text-align:right;font-size:11.5px;color:#1F6B3D;margin-top:8px;display:none;\">✓ Copied — paste into an email or shared document to send to the researcher.<\u002Fdiv>`;\n  return h;\n}\n\nfunction copyResultsText(){\n  const d=state.data;\n  const p=state.participant||{};\n  const scored=Object.keys(GUIDELINES)\n    .map(id=>({id,...GUIDELINES[id],gap:GAP[id],action:GUIDELINES[id].action(hardAns(d)),soft:softKind(d,id),\n      score:priorityScore(d,id),flagged:isFlagged(d,id),iconBg:ICON_COLORS[id].bg,iconFg:ICON_COLORS[id].fg,nextStep:NEXT_STEPS[id],why:whyFlagged(d,id)}))\n    .sort((a,b)=>b.score-a.score);\n\n  let lines=[\n    'VR TRAINING DESIGN FRAMEWORK — DIAGNOSTIC RESULTS',\n    '',\n    `Participant: ${p.name||'(not provided)'}`,\n    `Role: ${p.role||'(not provided)'}`,\n    `Training name: ${p.project||'(not provided)'}`,\n    `Assessment date: ${new Date().toISOString().slice(0,10)}`,\n    '',\n    '--- CONTEXT PROVIDED ---',\n    `Domain: ${LBL.domain[d.domain]||'—'}`,\n    `Skill type: ${LBL.skillType[d.skillType]||'—'}`,\n    `Learner expertise: ${LBL.expertise[d.expertise]||'—'}`,\n    `Interaction hardware: ${LBL.interactionHW[d.interactionHW]||'—'}`,\n    `Immersion level: ${d.immersion||'—'}`,\n    '',\n    `--- GAP DIAGNOSIS: ${scored.filter(g=>g.flagged).length} of 8 guidelines flagged ---`,\n  ];\n  scored.forEach(g=>{\n    lines.push('', `${g.flagged?'[GAP]':'[OK] '} ${g.id} — ${g.name} (priority score: ${g.score}/100)`);\n    lines.push(`  ${g.prescription}`);\n    lines.push(`  IMPLEMENTATION GUIDANCE: ${g.action[0]}`);\n    g.action.slice(1).forEach(line=>lines.push(`    \\u2192 ${line}`));\n    lines.push(`  (Theory: ${g.theory} · RBS: ${g.exemplar.study}, gap in ${g.gap.pct}% of corpus)`);\n  });\n  lines.push('', 'Generated by the VR Training Design Framework.');\n\n  const text = lines.join('\\n');\n  navigator.clipboard.writeText(text).then(()=>{\n    const c=document.getElementById('copyConfirm');\n    if(c){c.style.display='block'; setTimeout(()=>{c.style.display='none';},4000);}\n  }).catch(()=>{\n    // Fallback for browsers without clipboard API access in local file context\n    const ta=document.createElement('textarea');\n    ta.value=text; document.body.appendChild(ta); ta.select();\n    document.execCommand('copy'); document.body.removeChild(ta);\n    const c=document.getElementById('copyConfirm');\n    if(c){c.style.display='block'; setTimeout(()=>{c.style.display='none';},4000);}\n  });\n}\n\nfunction startAssessment(){state.screen='steps';state.q=0;state.step=0;state.data={};state.error='';render();}\nfunction restart(){ uiConfirm('Start a new assessment?', CLEAR_MSG, 'Clear and restart', ()=>{ clearAll(); state.screen='home'; render(); }); }\nfunction selectOpt(f,v){state.data[f]=v;state.error='';state.errorField=null;render();}\nfunction goBack(){\n  if(state.q===0){ state.screen='home'; }\n  else{state.q--;}\n  state.error='';state.errorField=null;\n  render();\n}\nfunction goNext(){\n  const v=visibleQs(state.data), id=v[state.q];\n  if(!state.data[id]){state.error='Choose one option to continue.';state.errorField=id;render();return;}\n  state.error='';state.errorField=null;\n  if(state.q===v.length-1){ if(v.every(k=>state.data[k])) state.screen='results'; else state.q=firstUnanswered(); }\n  else{state.q++;}\n  render();\n}\n\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Training Design Framework — PPGDesign/UFPR</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  color: #1a1a1a;
  background: #ffffff;
  line-height: 1.5;
}
.app { max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
#root { animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.header { text-align: center; margin-bottom: 2.25rem; }
.header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.header p { font-size: 13px; color: #6a6a6a; }

.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
.home-card { background: #f7f7f5; border: 1px solid #e2e2de; border-radius: 12px; padding: 1.1rem; }
.home-card .icon { font-size: 22px; color: #2b5f8e; display: block; margin-bottom: 8px; }
.home-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.home-card p { font-size: 12.5px; color: #6a6a6a; }
.home-note {
  background: #fdf2e3; border: 1px solid #e8d4b0; border-radius: 10px;
  padding: 0.9rem 1.1rem; margin-bottom: 1.75rem; font-size: 12.5px; color: #6b4600;
}
.home-note strong { color: #8b4a00; }

.participant-panel {
  background: #f7f7f5; border: 1px solid #e2e2de; border-radius: 12px;
  padding: 1.1rem 1.25rem; margin-bottom: 1.25rem;
}
.participant-panel h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
.participant-panel .p-sub { font-size: 11.5px; color: #999; margin-bottom: 12px; }
.p-field { margin-bottom: 10px; }
.p-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.p-field input, .p-field select {
  width: 100%; padding: 8px 10px; border: 1px solid #d5d5d0; border-radius: 6px;
  font-size: 13px; font-family: inherit; background: #fff;
}
.p-field input:focus, .p-field select:focus { outline: none; border-color: #2b5f8e; }
.p-optional { font-weight: 400; color: #999; font-size: 11px; }

.consent-note {
  font-size: 11px; color: #999; margin-top: 10px; line-height: 1.5;
}

.export-row { display: flex; gap: 8px; }

.filter-row { display: flex; gap: 8px; margin-bottom: 1.1rem; }
.chip {
  padding: 7px 14px; border-radius: 99px; font-size: 12.5px; cursor: pointer;
  border: 1px solid #d5d5d0; background: #fff; color: #6a6a6a; font-family: inherit;
}
.chip:hover { border-color: #b0b0aa; }
.chip.active { background: #2b5f8e; color: #fff; border-color: transparent; }
.home-cta { text-align: center; }
.home-sub { font-size: 12px; color: #999; margin-top: 8px; }

.btn { padding: 10px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid #c8c8c2; background: transparent; color: #1a1a1a; font-family: inherit; }
.btn:hover { background: #f2f2ef; }
.btn-primary { background: #2b5f8e; color: #fff; border-color: transparent; }
.btn-primary:hover { background: #234d75; }

.progress-label { font-size: 12px; color: #999; text-align: right; margin-bottom: 6px; }
.progress-bar { background: #eeeeea; border-radius: 99px; height: 5px; margin-bottom: 1.75rem; overflow: hidden; }
.progress-fill { height: 100%; background: #2b5f8e; border-radius: 99px; transition: width .35s ease; }
.step-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.step-sub { font-size: 13px; color: #6a6a6a; margin-bottom: 1.5rem; }

.field { background: #f7f7f5; border: 1px solid #e2e2de; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
.field.diagnostic { background: #fbf6ec; border-color: #e8d9b8; }
.field-label { font-size: 13px; font-weight: 700; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.field-tag {
  font-size: 9.5px; font-weight: 700; color: #8b4a00; background: #fdf2e3;
  padding: 2px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .3px;
}
.field-hint { font-size: 12px; color: #999; margin-bottom: 12px; }
.field-evidence { font-size: 11px; color: #8b6a2e; font-style: italic; margin-bottom: 12px; }
.options { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1px solid #e2e2de; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color .15s; }
.opt:hover { border-color: #b0b0aa; }
.opt.selected { border-color: #2b5f8e; background: #e8f1f9; }
.opt input { margin-top: 2px; accent-color: #2b5f8e; flex-shrink: 0; }
.opt-name { font-size: 13px; font-weight: 700; }
.opt-desc { font-size: 11.5px; color: #6a6a6a; margin-top: 1px; }
.opt.selected .opt-name { color: #2b5f8e; }

.err { font-size: 12px; color: #b23b3b; margin: 4px 0 8px; }

.nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
.step-dots { display: flex; gap: 6px; }
.dot {
  width: 8px; height: 8px; border-radius: 50%; background: #c8c8c2;
  display: inline-block; border: none; padding: 0; cursor: pointer;
  transition: background .15s, width .2s;
}
.dot:hover { background: #a0a09a; }
.dot:focus-visible { outline: 2px solid #2b5f8e; outline-offset: 2px; }
.dot.active { background: #2b5f8e; width: 20px; border-radius: 99px; }

.context-summary { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 8px; margin-bottom: 1.75rem; }
.ctx-chip { background: #f7f7f5; border: 1px solid #e2e2de; border-radius: 8px; padding: 8px 10px; }
.ctx-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 2px; }
.ctx-val { font-size: 12.5px; font-weight: 700; }


/* ── Worksheet call-to-action on each card ── */
.ws-open {
  display: flex; align-items: center; gap: 11px; width: 100%;
  background: #eef4fa; border: 1px solid #cfe0ee; border-radius: 9px;
  padding: 11px 13px; margin: 10px 0; cursor: pointer;
  font-family: inherit; font-size: 12.5px; color: #1a1a1a; text-align: left;
  line-height: 1.45; transition: border-color .15s, background .15s;
}
.ws-open:hover { background: #e3eef8; border-color: #a9cae5; }
.ws-open:focus-visible { outline: 2px solid #2b5f8e; outline-offset: 1px; }
.ws-open-icon { font-size: 17px; color: #2b5f8e; flex-shrink: 0; }
.ws-open strong { color: #0c447c; }
.ws-open-sub { font-size: 11.5px; color: #6a6a6a; }
.ws-open-arrow { margin-left: auto; color: #2b5f8e; font-size: 15px; flex-shrink: 0; }

/* ── Worksheet modal ── */
.ws-backdrop {
  position: fixed; inset: 0; background: rgba(26,26,26,.55);
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem 1rem; z-index: 100; animation: fadeIn .16s ease;
}
.ws-modal {
  background: #fff; border-radius: 14px; width: 100%; max-width: 940px;
  max-height: 90vh; display: flex; flex-direction: column;
  box-shadow: 0 14px 44px rgba(0,0,0,.25);
}
.ws-head {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 1.15rem 1.4rem 0.9rem; border-bottom: 1px solid #e8e8e4;
}
.ws-eyebrow { font-size: 11px; font-weight: 700; color: #2b5f8e; letter-spacing: .3px; margin-bottom: 3px; }
.ws-head h2 { font-size: 18px; font-weight: 700; margin: 0; }
.ws-close {
  margin-left: auto; background: transparent; border: none; font-size: 26px;
  line-height: 1; color: #999; cursor: pointer; padding: 0 4px; font-family: inherit;
}
.ws-close:hover { color: #1a1a1a; }
.ws-close:focus-visible { outline: 2px solid #2b5f8e; outline-offset: 2px; border-radius: 4px; }
.ws-body { padding: 1.1rem 1.4rem; overflow-y: auto; }
.ws-produces, .ws-method { font-size: 12.5px; line-height: 1.55; margin-bottom: 6px; color: #4a4a4a; }
.ws-method { color: #6a6a6a; font-size: 12px; margin-bottom: 1.4rem; }
.ws-sub {
  font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
  color: #2b5f8e; margin: 1.2rem 0 .55rem;
}
.ws-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.ws-table th, .ws-table td {
  border: 1px solid #e2e2de; padding: 7px 9px; text-align: left;
  vertical-align: top; line-height: 1.45;
}
.ws-table th { background: #f2f6fa; font-weight: 700; color: #0c447c; }
.ws-table tbody tr:nth-child(even) { background: #fafafa; }
.ws-notes { margin: 0; padding-left: 1.15rem; }
.ws-notes li { font-size: 12.5px; line-height: 1.6; margin-bottom: 7px; color: #4a4a4a; }
.ws-foot {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: .95rem 1.4rem; border-top: 1px solid #e8e8e4; background: #fafaf8;
  border-radius: 0 0 14px 14px;
}
.ws-copy-ok { display: none; font-size: 11.5px; color: #2f7a2f; }

@media (max-width: 640px) {
  .ws-body { padding: 1rem; }
  .ws-table { font-size: 10.5px; }
  .ws-table th, .ws-table td { padding: 5px 6px; }
}
@media print {
  .ws-backdrop { position: static; background: none; padding: 0; }
  .ws-modal { max-height: none; box-shadow: none; }
  .ws-close, .ws-foot { display: none; }
}





/* ── Shared disclosure panels inside the worksheet modal.
   Two peer panels answering two distinct questions: where the guideline
   came from, and what theory explains it. Both collapsed by default so the
   worksheet itself stays the primary content. ── */
.info-panel {
  margin-top: .85rem; border: 1px solid #dfe7ef; border-radius: 9px;
  background: #f6f9fc; overflow: hidden;
}
.info-panel.provenance-panel { background: #f7faf7; border-color: #d9e7d9; }
.info-panel summary {
  cursor: pointer; padding: 11px 13px; font-size: 12.5px;
  color: #1a1a1a; list-style: none; display: flex; align-items: center; gap: 11px;
  line-height: 1.45; transition: background .15s;
}
.info-panel summary::-webkit-details-marker { display: none; }
.info-panel summary:hover { background: #e8f0f8; }
.info-panel.provenance-panel summary:hover { background: #eaf3ea; }
.info-panel summary:focus-visible { outline: 2px solid #2b5f8e; outline-offset: -2px; }
.info-panel summary strong { color: #0c447c; }
.info-panel.provenance-panel summary strong { color: #27500A; }
.info-icon { font-size: 18px; flex-shrink: 0; color: #2b5f8e; }
.provenance-panel .info-icon { color: #27500A; }
.info-sum-text { flex: 1; min-width: 0; }
.info-sum-sub { font-size: 11.5px; color: #6a6a6a; }
.info-chev {
  margin-left: auto; flex-shrink: 0; color: #2b5f8e; font-size: 19px;
  transition: transform .2s; line-height: 1;
}
.provenance-panel .info-chev { color: #27500A; }
.info-panel[open] .info-chev { transform: rotate(90deg); }
.info-body { padding: 0 13px 13px; }

.prov-line { font-size: 12px; line-height: 1.6; color: #4a4a4a; margin-bottom: 7px; }
.prov-line:last-child { margin-bottom: 0; }
.prov-line strong { color: #27500A; }

.theory-diagram {
  background: #fff; border: 1px solid #e6ecf2; border-radius: 7px;
  padding: 12px; margin-bottom: 11px;
}
.theory-diagram svg { width: 100%; height: auto; display: block; }
.theory-use, .theory-caveat { font-size: 12px; line-height: 1.6; margin-bottom: 8px; color: #4a4a4a; }
.theory-use strong { color: #0c447c; }
.theory-caveat { color: #6b5320; background: #fff8e8; border-left: 3px solid #c9971e; padding: 8px 11px; border-radius: 0 5px 5px 0; }
.theory-caveat strong { color: #8b6a00; }
.theory-cite {
  font-size: 10.5px; color: #8a8a8a; line-height: 1.55;
  border-top: 1px dashed #dfe7ef; padding-top: 8px; margin-top: 10px;
}
@media print { .info-panel { display: none; } }

/* ── Cross-guideline dependencies ── */
.g-dep-warn {
  font-size: 12px; color: #7a3a00; background: #fdf1e3;
  border-left: 3px solid #d4881e; border-radius: 0 6px 6px 0;
  padding: 8px 11px; margin-bottom: 9px; line-height: 1.5;
}
.g-dep-warn strong { color: #8b4a00; }
.g-dep {
  font-size: 11.5px; color: #6a6a6a; padding: 7px 0 9px;
  border-top: 1px dashed #e8e8e4; margin-bottom: 4px; line-height: 1.55;
}
.g-dep-k {
  font-weight: 700; color: #2b5f8e; text-transform: uppercase;
  font-size: 9.5px; letter-spacing: .4px;
}
.g-dep-note { display: block; margin-top: 3px; font-style: italic; color: #8a8a8a; }

/* ── Scoring transparency & limitations ── */
.score-explain { font-size: 12px; color: #4a4a4a; line-height: 1.6; margin-top: 8px; }
.limits-panel {
  background: #f7f7f5; border: 1px solid #e2e2de; border-radius: 10px;
  padding: .8rem 1rem; margin: 1.5rem 0 .75rem; font-size: 12.5px;
}
.limits-panel summary {
  cursor: pointer; font-weight: 600; color: #2b5f8e; list-style: none;
}
.limits-panel summary::-webkit-details-marker { display: none; }
.limits-panel summary::before { content: '▸ '; }
.limits-panel[open] summary::before { content: '▾ '; }
.limits-list { margin: 10px 0 0; padding-left: 1.15rem; }
.limits-list li { font-size: 12px; line-height: 1.6; margin-bottom: 8px; color: #4a4a4a; }
.artifact-stamp {
  font-size: 10.5px; color: #999; line-height: 1.6;
  padding: .5rem 0 0; text-align: center;
}

/* ── Editable context chips ── */
.ctx-chip {
  display: block; width: 100%; text-align: left; cursor: pointer;
  font-family: inherit; transition: border-color .15s, background .15s;
}
.ctx-chip:hover { border-color: #a9cae5; background: #f2f6fa; }
.ctx-chip:focus-visible { outline: 2px solid #2b5f8e; outline-offset: 1px; }
.ctx-edit {
  font-size: 8.5px; color: #2b5f8e; opacity: 0; transition: opacity .15s;
  text-transform: none; letter-spacing: 0; font-weight: 600;
}
.ctx-chip:hover .ctx-edit, .ctx-chip:focus-visible .ctx-edit { opacity: 1; }

.resume-link {
  display: block; margin-top: 12px; font-size: 12px; color: #2b5f8e;
  cursor: pointer; text-decoration: underline;
}
.resume-link:hover { color: #234d75; }

/* ── Full design brief ── */
#briefHost { max-width: 940px; margin: 0 auto; padding: 0 1.25rem 4rem; }
.brief-bar { display: flex; gap: 9px; justify-content: space-between; padding: 1rem 0 1.5rem; }
.brief-doc { font-size: 12.5px; line-height: 1.6; color: #1a1a1a; }
.brief-header { border-bottom: 2px solid #2b5f8e; padding-bottom: 1rem; margin-bottom: 1.75rem; }
.brief-header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.brief-meta { font-size: 11.5px; color: #6a6a6a; line-height: 1.55; }
.brief-h2 {
  font-size: 16px; font-weight: 700; color: #0c447c;
  margin: 2rem 0 .75rem; padding-bottom: 5px; border-bottom: 1px solid #e2e2de;
}
.brief-h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.brief-tag {
  font-size: 10px; font-weight: 600; background: #eef4fa; color: #0c447c;
  padding: 2px 7px; border-radius: 99px; margin-left: 6px;
}
.brief-flag {
  font-size: 10px; font-weight: 600; background: #fbe4e4; color: #a23a3a;
  padding: 2px 7px; border-radius: 99px; margin-left: 4px;
}
.brief-p { margin-bottom: 9px; }
.brief-small { font-size: 11.5px; color: #6a6a6a; }
.brief-grounding { border-top: 1px dashed #e2e2de; padding-top: 8px; margin-top: 12px; }
.brief-why {
  background: #fff8e8; border-left: 3px solid #c9971e; padding: 7px 10px;
  margin-bottom: 9px; font-size: 12px;
}
.brief-ol { padding-left: 1.3rem; margin-bottom: 1rem; }
.brief-ol li { margin-bottom: 8px; }
.brief-ctx { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
.brief-ctx th, .brief-ctx td { border: 1px solid #e2e2de; padding: 6px 10px; text-align: left; font-size: 12px; }
.brief-ctx th { background: #f7f7f5; width: 190px; font-weight: 600; }
.brief-guideline {
  border: 1px solid #e2e2de; border-radius: 9px; padding: 1.1rem 1.25rem;
  margin-bottom: 1.25rem; page-break-inside: avoid; break-inside: avoid;
}
.brief-guideline.flagged { border-color: #e0b8b8; background: #fdfafa; }
.brief-ws-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
  color: #2b5f8e; margin: 1rem 0 .45rem;
}
.brief-notes { padding-left: 1.15rem; margin-top: .75rem; }
.brief-notes li { font-size: 12px; margin-bottom: 6px; color: #4a4a4a; }

/* ── Print: make the brief the deliverable, hide live-app controls ── */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .brief-bar, .nav, .filter-row, .ws-open, .data-table-toggle summary,
  .resume-link, .ctx-edit { display: none !important; }
  .data-table-toggle[open] table, .data-table-toggle table { display: table !important; }
  #briefHost { padding: 0; max-width: none; }
  .brief-guideline, .ws-table, .g-card { page-break-inside: avoid; break-inside: avoid; }
  .brief-h2 { page-break-after: avoid; break-after: avoid; }
  .ws-table { font-size: 9.5px; }
  .ws-table th, .ws-table td { padding: 4px 5px; }
  a[href]:after { content: none !important; }
}

/* ── Consolidated overview scorecard ── */
.scorecard {
  background: #f7f7f5; border: 1px solid #e2e2de; border-radius: 12px;
  padding: 1.1rem 1.25rem; margin-bottom: 1.75rem;
}
.scorecard-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
.scorecard-num {
  font-size: 34px; font-weight: 700; line-height: 1; color: #2f7a2f;
  min-width: 44px; text-align: center;
}
.scorecard-num.has-gaps { color: #b23b3b; }
.scorecard-title { font-size: 14.5px; font-weight: 700; }
.scorecard-sub { font-size: 12px; color: #6a6a6a; margin-top: 2px; }

.next-steps {
  background: #fff; border: 1px solid #e2e2de; border-radius: 9px;
  padding: 0.85rem 1rem; margin: 1rem 0 1.1rem;
}
.next-steps-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .4px; color: #2b5f8e; margin-bottom: 8px;
}
.next-steps-list { margin: 0; padding-left: 1.15rem; }
.next-steps-list li { font-size: 12.5px; line-height: 1.55; margin-bottom: 7px; }
.next-steps-list li:last-child { margin-bottom: 0; }

.result-section { margin-bottom: 1.75rem; }
.result-section h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #e2e2de; }

/* Ranked list doubles as diagnosis, priority chart, and jump navigation */
.bar-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
  width: 100%; padding: 5px 6px; border: 1px solid transparent; border-radius: 7px;
  background: transparent; font-family: inherit; text-align: left; cursor: pointer;
}
.bar-row:hover { background: #f2f2ef; border-color: #e2e2de; }
.bar-row:focus-visible { outline: 2px solid #2b5f8e; outline-offset: 1px; }
.bar-status {
  width: 17px; height: 17px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; background: #e2f0e0; color: #2f7a2f;
}
.bar-row.flagged .bar-status { background: #fbe4e4; color: #a23a3a; }
.bar-label { font-size: 11.5px; color: #4a4a4a; width: 178px; flex-shrink: 0; }
.bar-track { flex: 1; background: #eeeeea; border-radius: 99px; height: 8px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; background: #2b5f8e; display: block; }
.bar-fill.flagged { background: #b23b3b; }
.bar-val { font-size: 11px; color: #999; width: 28px; text-align: right; }

/* Explainability trace inside each card */
.g-why {
  font-size: 12px; color: #6b5320; background: #fff8e8;
  border-left: 3px solid #c9971e; border-radius: 0 6px 6px 0;
  padding: 8px 11px; margin-bottom: 10px; line-height: 1.5;
}
.g-why strong { color: #8b6a00; }

@keyframes jumpHighlight {
  0%, 70% { box-shadow: 0 0 0 3px rgba(43,95,142,.35); }
  100% { box-shadow: 0 0 0 0 rgba(43,95,142,0); }
}
.g-card.just-jumped { animation: jumpHighlight 1.6s ease-out; }

/* Accessible data table — a native <details> disclosure, keyboard- and screen-reader-friendly by default */
.data-table-toggle { margin-top: 10px; font-size: 12px; }
.data-table-toggle summary {
  cursor: pointer; color: #2b5f8e; font-weight: 600; padding: 4px 0; list-style: none;

/* Diagram animations — subtle, looping, purely CSS/SVG, no external assets */
@keyframes stagePulse {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1; }
}
.dg-stage { animation: stagePulse 3.2s ease-in-out infinite; }

/* Pause all diagram animations by default; only run for the card currently in view.

.g-diagram * { animation-play-state: paused; }
.g-card.in-view .g-diagram * { animation-play-state: running; }
.dg-stage:nth-of-type(1) { animation-delay: 0s; }
.dg-stage:nth-of-type(2) { animation-delay: 0.5s; }

@keyframes dashFlow {

@keyframes dotTravel {
  0% { transform: translateX(0); opacity: 0; }
  8% { opacity: 1; }

}

@keyframes buttonPress {

  50%, 100% { transform: translateY(0); }
}
.dg-press { animation: buttonPress 2.2s ease-in-out infinite; transform-box: fill-box; }

}
.dg-wobble { animation: wobble 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }

@keyframes arrowFly {
  0%, 15% { transform: translateX(0); }

}
.dg-spin-stop { animation: spinStop 2.6s cubic-bezier(.2,.8,.3,1) infinite; transform-box: fill-box; transform-origin: center; }

      hint:'Are presence, flow, and motivation designed as explicit targets, or only measured afterward?',
      evidence:'65% of the studies we reviewed only checked engagement and presence with a survey afterward, rather than designing for it from the start.',
      options:[
        {val:'yes',name:'Yes',desc:'Presence/flow conditions are designed in from the start'},
        {val:'no',name:'No / measured after',desc:'These are only assessed via post-test questionnaires'},
      ]},
  ]},
  {title:'Step 6 — Evaluation articulation', sub:'The central Cycle 1 finding: design–evaluation coupling (G8)', fields:[
    {id:'evalPlanned', kind:'diagnostic', guideline:'G8', label:'Evaluation strategy already planned?', cols:2,
      hint:'Is there a defined plan for how this training will be assessed?',
      evidence:'Half of the studies we reviewed added evaluation as an afterthought, disconnected from what was actually being taught.',
      options:[
        {val:'yes',name:'Yes',desc:'An evaluation approach has been defined'},
        {val:'no',name:'No / not yet',desc:'Evaluation has not been planned yet'},
      ]},
    {id:'evalLinked', kind:'diagnostic', guideline:'G8', label:'Evaluation linked to learning objectives?', cols:2,
      hint:'If an evaluation plan exists, is each metric explicitly traceable back to a learning objective from Step 1?',
      evidence:'This connection between evaluation and learning goals is the single biggest gap this framework was built to close.',
      options:[
        {val:'yes',name:'Yes',desc:'Each metric maps to a specific competency claim'},
        {val:'no',name:'No / unclear',desc:'Metrics exist independently of stated objectives'},
      ]},
  ]},
];
const LBL = {
  domain:{clinical:'clinical',industrial:'industrial',educational:'educational',emergency:'emergency response'},
  skillType:{procedural:'procedural',perceptual:'perceptual-motor',decision:'decision-making',mixed:'mixed'},
  expertise:{novice:'novice',intermediate:'intermediate',expert:'expert'},
  interactionHW:{controllers:'standard controllers',handtracking:'hand tracking',haptic:'haptic devices'},
};

// ── GUIDELINES — prescription (stable) + action (context + diagnostic aware) ──
const GUIDELINES = {
  G1:{name:'Pedagogical Framing',type:'Criterion',
    theory:'Constructive Alignment (Biggs, 2003); Experiential Learning (Kolb, 1984)',
    exemplar:{study:'Teichmann (2025)', note:'one of the few corpus studies that derives use cases and learning targets from real-world processes before any component design begins'},
    prescription:'Before any component design decision, declare the skill acquisition model, learning objectives as observable behaviours, learner profile, and technology mediation requirements.',
    action:(a)=>{let p=[];
      if(a.objectivesDeclared==='no'){p.push('⚑ Before designing anything, write down three things in one place: how people will learn this skill (step-by-step practice? decision-making? hands-on movement?), what success looks like in plain, observable terms — "correctly closes the valve within 90 seconds", not "understands valve safety" — and who your learner is (experience level, prior VR exposure, any access needs). Keep this as a single shared reference that guides every other decision, instead of everyone building from their own assumptions.');}
      else{p.push('Objectives are written down — good. Keep them specific and observable (not just topics), so the progression stages and the evaluation later on can point back to the exact same goals instead of drifting apart.');}
      p.push(`Skill type: ${LBL.skillType[a.skillType]||'—'}, for ${LBL.domain[a.domain]||'this'} training.`);
      return p.join(' ');}},
  G2:{name:'Task-Centered Structure',type:'Principle',
    theory:'Situated Learning (Lave & Wenger, 1991); Activity Theory (Engeström, 1987)',
    exemplar:{study:'Moore et al. (2020)', note:'validated task structure through 10 clinician interviews before system design began'},
    prescription:'Derive task structure and success/failure criteria from professional practice analysis validated with domain experts — not a superficial visual translation.',
    action:(a)=>{let p=[];
      if(a.taskValidated==='no'){p.push('⚑ Before designing any scene, map out the task step by step: what the learner does at each stage, what counts as doing it correctly, what a mistake looks like, and roughly how long each step should take. Walk through this map with two or three people who actually do this job — not with a working prototype, since by then people react to how it looks rather than whether the logic is right.');}
      else{p.push('Practitioner input is in place — keep a dated version of this task map so later changes can be compared against what was validated, and so the interaction and evaluation design can stay anchored to the same steps.');}
      if(a.taskType==='sequential')p.push('For step-by-step tasks: give each step its own clear pass/fail check, rather than judging the whole sequence at the end.');
      if(a.taskType==='decision')p.push('For decision-based tasks: give each choice a real consequence shown to the learner, not just a visual branch in the story.');
      if(a.taskType==='manipulative')p.push('For hands-on tasks: decide how much precision each step really needs, matched to what the real tool or equipment requires.');
      return p.join(' ');}},
  G3:{name:'Temporal Progression',type:'Principle',
    theory:'Cognitive Load Theory (Sweller, 1988); Zone of Proximal Development (Vygotsky, 1978)',
    exemplar:{study:'Holmer et al. (2024)', note:'demonstrates explicit CLT-based staging in a virtual physics laboratory'},
    prescription:'Structure the experience into progressive microcycles with explicit cognitive load gradient, scaffolding fading logic, and transfer readiness thresholds.',
    action:(a)=>{let p=[];
      if(a.sessionStructure==='single'){p.push('⚑ Design the experience as a set of clearly named stages — for example, Practice, Guided, Independent, Final Check — each with a simple rule for moving forward (three good attempts in a row) or repeating a stage. Keep these rules as settings you can adjust, rather than baking them permanently into the scene, so you can fine-tune pacing later without starting over.');}
      else{p.push('Progressive stages are planned — make the criteria for moving between them measurable and recorded (not just a feeling), so the pacing can be checked and improved after real use.');}
      if(a.expertise==='novice')p.push('For novice learners: start with maximum support (all hints on, fewer distractions) and ask for a longer streak of success before advancing.');
      if(a.complexity==='high')p.push('For high-complexity tasks: break the task itself into smaller pieces across stages, rather than keeping it whole and only changing the difficulty.');
      return p.join(' ');}},
  G4:{name:'Embodied Interaction',type:'Criterion',
    theory:'Embodied Cognition (Varela et al., 1991); Motor Schema Theory (Schmidt, 1975)',
    exemplar:{study:'Omar et al. (2024)', note:'explicitly adapted Nielsen\u2019s heuristics for metaverse/HMD interaction rather than applying generic desktop criteria'},
    prescription:'Specify HMD-specific interaction criteria where gestures have physical and proprioceptive correspondence with the real-world task.',
    action:(a)=>{let p=[];
      if(a.gestureCorrespondence==='no'){p.push('⚑ Make the VR gesture feel like the real motion, not a shortcut. If the real task involves turning a valve, the learner should turn their hand or controller — not just pull a trigger. Watch someone who actually does this job perform the motion, then check that your VR version asks for a similar physical movement.');}
      else{p.push('Gestures already mirror the real motion — good. Now decide how forgiving the system should be about small variations in movement, based on how much precision the real task actually calls for.');}
      if(a.interactionHW==='controllers')p.push('With standard controllers: tie the trigger or grip pressure to the strength of the in-world action, rather than treating it as a simple on/off press.');
      if(a.interactionHW==='handtracking')p.push('With hand tracking: build in some tolerance for tracking noise, so a shaky hand isn\u2019t mistaken for a mistake.');
      return p.join(' ');}},
  G5:{name:'Multimodal Feedback',type:'Principle',
    theory:'Operant Conditioning (Skinner, 1953); Metacognitive Reflection (Schön, 1983)',
    exemplar:{study:'Burova et al. (2022)', note:'implemented three designed feedback channels (visual, haptic, verbal) as a unified pedagogical mechanism'},
    prescription:'Design a dual-level feedback system: immediate multimodal sensory feedback, plus structured post-task debriefing for schema reflection.',
    action:(a)=>{let p=[];
      if(a.debriefPlanned==='no'){p.push('⚑ Give two kinds of feedback: something immediate the moment a mistake happens — a visual cue, a short vibration, a sound — and a clear summary afterward that the learner can look back on: what happened, what was expected, and where things went differently. Make sure that summary is still available once the headset comes off; a message that only appears inside VR and then disappears doesn\u2019t help anyone reflect.');}
      else{p.push('A debrief summary is planned — make sure it\u2019s easy to find afterward (emailed, or on a simple dashboard); a report only visible inside the headset is hard for most people to actually use.');}
      if(a.immersion==='high')p.push('At high immersion levels, combine all three immediate signals together (see it, feel it, hear it) — this helps errors register even when the learner is focused elsewhere in the scene.');
      return p.join(' ');}},
  G6:{name:'Contextual Functional Realism',type:'Principle',
    theory:'Affordance Theory (Gibson, 1979); Ecological Validity (Lave & Wenger, 1991)',
    exemplar:{study:'García Fracaro et al. (2021)', note:'prioritised functional realism (correct process logic) over visual fidelity in chemical industry VR training'},
    prescription:'Prioritise functional realism — logical rules, physical constraints, consequences — over visual fidelity.',
    action:(a)=>{let p=[];
      if(a.realismPriority==='visual'){p.push('⚑ Spend your early effort making things behave correctly before making them look beautiful. A valve that looks realistic but doesn\u2019t resist turning, or a tool that doesn\u2019t respond the way it should, teaches the wrong lesson even if it looks great. Get the logic and consequences right first; polish the visuals once the behaviour is solid.');}
      else{p.push('Correct behaviour is already the priority — good. Write down the specific real-world details you\u2019re matching (weight, resistance, friction) so they can be checked against the real equipment, not just judged by feel during testing.');}
      p.push('When someone makes a mistake, show the real consequence happening in the scene itself — not just a warning message on screen.');
      return p.join(' ');}},
  G7:{name:'Proactive Experiential Design',type:'Principle',
    theory:'Flow Theory (Csikszentmihalyi, 1990); Self-Determination Theory (Deci & Ryan, 1985)',
    exemplar:{study:'Pizzolante et al. (2023)', note:'designed and validated presence/awe conditions as explicit targets, not just post-hoc measurements'},
    prescription:'Map and induce specific experiential targets as explicit design parameters, not as emergent outcomes measured post-hoc.',
    action:(a)=>{let p=[];
      if(a.experienceProactive==='no'){p.push('⚑ Before building content, sketch out how the challenge should feel over the session — starting manageable, then gradually asking more as the learner\u2019s skill grows, so they stay engaged without feeling bored or overwhelmed. While people are training, watch how long each attempt takes; if it swings too far in either direction, that\u2019s your cue to adjust difficulty in the moment, rather than waiting for a survey afterward.');}
      else{p.push('This is already planned for — good. Keep track of a few simple signals (how engaged people seem, whether they retry voluntarily) so you can check later whether the experience is landing the way you intended.');}
      p.push(`Frame the scenario around real ${LBL.domain[a.domain]||'professional'} stakes from the start — people engage more when the "why this matters" is concrete, not abstract.`);
      return p.join(' ');}},
  G8:{name:'Constructive Evaluation Articulation',type:'Criterion',
    theory:'Evidence-Centered Design (Mislevy, 2003); Constructive Alignment (Biggs, 2003)',
    exemplar:{study:'Haj-Bolouri et al. (2024)', note:'one of only 4 corpus studies (of 20) with evaluation criteria explicitly derived from design decisions'},
    prescription:'Solder every evaluation metric to the training components from the framing phase (G1) — traceable to a specific competence claim.',
    action:(a)=>{let p=[];
      if(a.evalPlanned==='no'){p.push('⚑ For every learning goal you wrote down in Step 1, decide what you\u2019ll actually observe and record as proof the learner achieved it. Every piece of data you collect — a completion time, a mistake, a decision made — should clearly connect back to one of those goals; if you can\u2019t say which goal it\u2019s evidence for, it\u2019s probably not worth collecting.');}
      else if(a.evalLinked==='no'){p.push('⚑ You already have metrics, but they\u2019re not yet tied to specific goals — go back through your list and connect each one to a learning goal from Step 1. Anything that can\u2019t be connected is adding noise without telling you whether learning actually happened.');}
      else{p.push('Evaluation is planned and clearly tied to your learning goals — this is the target state. Keep that connection documented and up to date as the training evolves, so the two don\u2019t drift apart.');}
      if(a.skillType==='procedural')p.push('For procedural skills: track not just pass/fail but the type of mistake (skipped a step, wrong order, imprecise action) — this makes it much easier to know what to fix.');
      if(a.skillType==='decision')p.push('For decision-making skills: record the path the learner chose alongside the best possible path, so you can assess judgment quality, not just the final outcome.');
      return p.join(' ');}},
};

/**
 * priorityScore — diagnostic answers dominate the score (they detect whether
 * THIS user's plan matches a known corpus gap). Profile answers provide a
 * smaller contextual adjustment on top of the base corpus prevalence.
 */
// All 8 guidelines now share the identical diagnostic logic — each is
// flagged directly from its own dedicated SAM-evidenced question, with no
// guideline inferred indirectly from another guideline's profile variables.
// Traces each flag back to the specific answer that triggered it — makes the
// diagnosis scrutable rather than a black box (explainable-recommendation practice).
function whyFlagged(a, id){
  const t = {
    G1: a.objectivesDeclared==='no' && ['Learning objectives declared?','No / not yet'],
    G2: a.taskValidated==='no' && ['Task validated with domain practitioners?','No / not yet'],
    G3: a.sessionStructure==='single' && ['Single session or progressive stages?','Single session'],
    G4: a.gestureCorrespondence==='no' && ['Gestures correspond to the real task?','Abstracted / generic'],
    G5: a.debriefPlanned==='no' && ['Post-task debriefing planned?','No / not yet'],
    G6: a.realismPriority==='visual' && ['Realism priority','Visual fidelity'],
    G7: a.experienceProactive==='no' && ['Experience designed proactively?','No / measured after'],
    G8: a.evalPlanned==='no'
          ? ['Evaluation strategy already planned?','No / not yet']
          : (a.evalLinked==='no' ? ['Evaluation linked to learning objectives?','No / unclear'] : false),
  }[id];
  return t || null;
}

function computeFlags(a){
  return {
    G1: a.objectivesDeclared==='no',
    G2: a.taskValidated==='no',
    G3: a.sessionStructure==='single',
    G4: a.gestureCorrespondence==='no',
    G5: a.debriefPlanned==='no',
    G6: a.realismPriority==='visual',
    G7: a.experienceProactive==='no',
    G8: a.evalPlanned==='no' || a.evalLinked==='no',
  };
}

function priorityScore(a,id){
  const base = GAP[id].pct;
  const flags = computeFlags(a);
  if (flags[id]) return Math.min(100, base + 12);
  return Math.max(20, base - 25);
}

function isFlagged(a,id){
  return !!computeFlags(a)[id];
}

let state={screen:'home',step:0,data:{},error:'',showOnlyFlagged:false};

// ── Full design brief: everything on one page, worksheets inline, print-ready.
// This is the deliverable a designer hands to their team — the worksheets are
// the tool's most valuable output and must be exportable, not modal-only.
function openBrief(){
  const d = state.data;
  const scored = Object.keys(GUIDELINES)
    .map(id=>({id,...GUIDELINES[id],gap:GAP[id],action:GUIDELINES[id].action(d),
      score:priorityScore(d,id),flagged:isFlagged(d,id),nextStep:NEXT_STEPS[id],why:whyFlagged(d,id)}))
    .sort((a,b)=>b.score-a.score);
  const flaggedCount = scored.filter(g=>g.flagged).length;
  const p = state.participant || {};
  const today = new Date().toISOString().slice(0,10);

  // Derive the context table from the questionnaire itself, so it can never
  // drift out of sync with the actual fields (uses each option's own label).
  const ctx = [];
  STEPS.forEach(s => s.fields.forEach(f => {
    if(f.kind !== 'profile') return;
    const chosen = (f.options.find(o => o.val === d[f.id]) || {}).name;
    ctx.push([f.label, chosen || '—']);
  }));
  // Diagnostic answers matter too — record them so the brief is self-contained
  const diag = [];
  STEPS.forEach(s => s.fields.forEach(f => {
    if(f.kind !== 'diagnostic') return;
    const chosen = (f.options.find(o => o.val === d[f.id]) || {}).name;
    diag.push([f.label, chosen || '—']);
  }));

  const wsTable = (w, rows) => `<table class="ws-table">
    <thead><tr>${w.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  let h = `<div class="brief-doc">
    <div class="brief-header">
      <h1>VR Training Design Brief</h1>
      <div class="brief-meta">
        Generated ${today}${p.name?` · ${p.name}`:''}${p.domain?` · ${p.domain}`:''}<br>
        Based on the eight-guideline framework (G1–G8) derived from a systematic review of 20 immersive VR training studies (2020–2026).<br>
        <strong>Tool version ${ARTIFACT.version} · ${ARTIFACT.build} · released ${ARTIFACT.released}</strong>
      </div>
    </div>

    <h2 class="brief-h2">1. Training context</h2>
    <table class="brief-ctx"><tbody>
      ${ctx.map(([k,v])=>`<tr><th>${k}</th><td>${v||'—'}</td></tr>`).join('')}
    </tbody></table>

    <h2 class="brief-h2">2. Diagnostic answers</h2>
    <table class="brief-ctx"><tbody>
      ${diag.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('')}
    </tbody></table>

    <h2 class="brief-h2">3. Diagnosis summary</h2>
    <p class="brief-p"><strong>${flaggedCount} of 8 guidelines flagged as worth reviewing.</strong> Ranked by priority for this context.</p>
    <table class="ws-table">
      <thead><tr><th>Rank</th><th>Guideline</th><th>Priority</th><th>Status</th><th>Why flagged</th></tr></thead>
      <tbody>${scored.map((g,i)=>`<tr>
        <td>${i+1}</td><td><strong>${g.id}</strong> — ${g.name}</td><td>${g.score}</td>
        <td>${g.flagged?'Worth reviewing':'No gap detected'}</td>
        <td>${g.why?`Answered “${g.why[1]}” to “${g.why[0]}”`:'—'}</td></tr>`).join('')}</tbody>
    </table>`;

  const topFixes = scored.filter(g=>g.flagged).slice(0,3);
  if(topFixes.length){
    h += `<h2 class="brief-h2">4. Where to start</h2>
      <ol class="brief-ol">${topFixes.map(g=>`<li><strong>${g.id} — ${g.name}.</strong> ${g.nextStep}</li>`).join('')}</ol>`;
  }

  h += `<h2 class="brief-h2">${topFixes.length?5:4}. Guidance and worksheets</h2>`;

  scored.forEach(g=>{
    const w = WORKSHEETS[g.id];
    const blank = Array.from({length:4}, ()=> w.cols.map(()=>'&nbsp;'));
    h += `<div class="brief-guideline${g.flagged?' flagged':''}">
      <h3 class="brief-h3">${g.id} — ${g.name} <span class="brief-tag">${g.type}</span>${g.flagged?'<span class="brief-flag">worth reviewing</span>':''}</h3>
      <p class="brief-p"><em>${g.prescription}</em></p>
      ${g.why?`<p class="brief-why"><strong>Why flagged:</strong> you answered “${g.why[1]}” to “${g.why[0]}”.</p>`:''}
      <p class="brief-p"><strong>What to do:</strong> ${g.action}</p>
      <p class="brief-p brief-small"><strong>Derived from:</strong> the 20-study systematic review (2020\u20132026), via the focused code \u201c${DERIVATION[g.id]||'\u2014'}\u201d; present as a gap in ${g.gap.pct}% of the corpus.</p>
      <p class="brief-p brief-small"><strong>Interpreted through:</strong> ${g.theory}</p>
      <p class="brief-p brief-small"><strong>Worksheet built on:</strong> ${w.method}</p>

      <div class="brief-ws-title">${w.title} — worked example</div>
      ${wsTable(w, w.example)}
      <div class="brief-ws-title">${w.title} — your version</div>
      ${wsTable(w, blank)}
      <ul class="brief-notes">${w.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
      <p class="brief-p brief-small brief-grounding">${g.theory} · Seen working well in ${g.exemplar.study} · Gap present in ${g.gap.pct}% of the 20 studies reviewed.</p>
    </div>`;
  });

  h += `<h2 class="brief-h2">${topFixes.length?6:5}. Scope and limitations</h2>
    <ul class="brief-notes">${LIMITS.map(l=>`<li>${l}</li>`).join('')}</ul>
    <p class="brief-p brief-small brief-grounding">${SCORING.formula}. ${SCORING.detail}</p>
  </div>`;

  const host = document.createElement('div');
  host.id = 'briefHost';
  host.innerHTML = `<div class="brief-bar">
      <button class="btn" onclick="closeBrief()">← Back to results</button>
      <button class="btn btn-primary" onclick="window.print()">Print / save as PDF ↗</button>
    </div>${h}`;
  document.body.appendChild(host);
  document.getElementById('root').style.display='none';
  document.querySelector('.header').style.display='none';
  window.scrollTo(0,0);
}

function closeBrief(){
  const host = document.getElementById('briefHost');
  if(host) host.remove();
  document.getElementById('root').style.display='';
  document.querySelector('.header').style.display='';
}

// ── Save / resume: a JSON file the designer can keep with their project ──
function saveSession(){
  const payload = { version:1, savedAt:new Date().toISOString(),
    participant: state.participant||{}, data: state.data };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vr-training-assessment.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadSession(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed.data !== 'object') throw new Error('bad shape');
      state.data = parsed.data;
      state.participant = parsed.participant || {};
      const missing = STEPS.some(s => s.fields.some(f => !state.data[f.id]));
      state.screen = missing ? 'steps' : 'results';
      state.step = 0; state.error = missing ? 'Some answers were missing from that file — please review each step.' : '';
      render();
    } catch(err){
      alert('That file could not be read. Please choose a file saved from this tool.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ── Jump back to a specific step to change an answer ──
function backToResults(){
  state.screen = 'results';
  state.error = '';
  render();
}

function editStep(i){
  state.screen = 'steps';
  state.step = i;
  state.error = '';
  render();
}

// ── Worksheet modal: details-on-demand so the results page stays scannable ──

        ${THEORY[id]?`<details class="info-panel theory-panel">
          <summary>
            <span class="info-icon" aria-hidden="true">&#9432;</span>
            <span class="info-sum-text">
              <strong>Learn the theory behind this worksheet</strong><br>
              <span class="info-sum-sub">${THEORY[id].name} — diagram, how to apply it, and the reference</span>
            </span>
            <span class="info-chev" aria-hidden="true">›</span>
          </summary>
          <div class="info-body theory-body">
            <div class="theory-diagram">${THEORY[id].svg}</div>
            <p class="theory-use"><strong>How to use it here:</strong> ${THEORY[id].use}</p>
            <p class="theory-caveat"><strong>Worth knowing:</strong> ${THEORY[id].caveat}</p>
            <p class="theory-cite"><strong>Foundational reference:</strong> ${THEORY[id].cite}</p>
          </div>
        </details>`:''}
      </div>
      <div class="ws-foot">
        <button class="btn" onclick="closeWorksheet()">Close</button>
        <button class="btn btn-primary" onclick="copyWorksheet('${id}')">Copy table for Excel ⧉</button>
        <span id="wsCopyOK" class="ws-copy-ok">✓ Copied — paste into a spreadsheet</span>
      </div>
    </div>
  </div>`;

  const host = document.createElement('div');
  host.id = 'wsHost';
  host.innerHTML = html;
  document.body.appendChild(host);
  document.body.style.overflow = 'hidden';
  const closeBtn = host.querySelector('.ws-close');
  if(closeBtn) closeBtn.focus();
  document.addEventListener('keydown', _wsKeydown);
}

function _wsKeydown(e){
  if(e.key === 'Escape'){ closeWorksheet(); return; }
  if(e.key !== 'Tab') return;
  const modal = document.querySelector('.ws-modal');
  if(!modal) return;
  const f = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

function closeWorksheet(){
  const host = document.getElementById('wsHost');
  if(host) host.remove();
  document.body.style.overflow = '';
  document.removeEventListener('keydown', _wsKeydown);
  if(_lastFocused && _lastFocused.focus) _lastFocused.focus();
}

// Tab-separated so it pastes straight into Excel / Sheets as real columns
function copyWorksheet(id){
  const w = WORKSHEETS[id];
  const strip = s => String(s).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,'');
  const lines = [
    w.cols.map(strip).join('\t'),
    ...w.example.map(r=>r.map(strip).join('\t')),
    w.cols.map(()=>'').join('\t'),
    w.cols.map(()=>'').join('\t'),
    w.cols.map(()=>'').join('\t'),
  ];
  const text = lines.join('\n');
  const done = ()=>{
    const el = document.getElementById('wsCopyOK');
    if(el){ el.style.display='inline'; setTimeout(()=>{el.style.display='none';}, 3000); }
  };
  navigator.clipboard.writeText(text).then(done).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  });
}

function setFilter(val){ state.showOnlyFlagged = val; render(); }

// Jump from the overview list to a specific guideline card
function jumpTo(id){
  if(state.showOnlyFlagged){
    const g = Object.keys(GUIDELINES).find(k=>k===id);
    if(g && !isFlagged(state.data,id)){ state.showOnlyFlagged=false; render(); }
  }
  requestAnimationFrame(()=>{
    const el = document.getElementById('card-'+id);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth', block:'start'});
    el.classList.add('just-jumped');
    setTimeout(()=>el.classList.remove('just-jumped'), 1600);
  });
}

// Pause/resume diagram animations based on viewport visibility (perf + reduced cognitive load)
let _inViewObserver = null;
function setupInViewObserver(){
  if(_inViewObserver) _inViewObserver.disconnect();
  const cards = document.querySelectorAll('.g-card');
  if(!cards.length || typeof IntersectionObserver === 'undefined') return;
  _inViewObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      entry.target.classList.toggle('in-view', entry.isIntersecting);
    });
  }, { threshold: 0.35 });
  cards.forEach(c=>_inViewObserver.observe(c));
}

function render(){
  const r=document.getElementById('root');
  if(state.screen==='home'){r.innerHTML=renderHome();return;}
  if(state.screen==='steps'){r.innerHTML=renderStep();return;}
  if(state.screen==='results'){r.innerHTML=renderResults();window.scrollTo(0,0);setupInViewObserver();return;}
}

  const p = state.participant || {};

    <div class="home-card"><span class="icon">&#9650;</span><h3>Context & experience</h3><p>Realism, presence design (G6, G7)</p></div>
    <div class="home-card"><span class="icon">&#9632;</span><h3>Evaluation articulation</h3><p>Design–evaluation traceability (G8)</p></div>
  </div>
  <div class="home-note">
    <strong>How this differs from a generic checklist:</strong> each diagnostic question

      <label for="pYears">Years of experience in VR / training design</label>

    </div>
    <div class="consent-note">
      This tool runs entirely offline in your browser — nothing is transmitted anywhere.

    </div>

  <div class="home-cta">

}

function updateParticipant(field, value){
  if(!state.participant) state.participant = {};
  state.participant[field] = value;
}

function renderStep(){
  const s=STEPS[state.step];
  const pct=Math.round((state.step/STEPS.length)*100);
  let h=`<div class="progress-label">Step ${state.step+1} of ${STEPS.length}</div>
  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div class="step-title">${s.title}</div>
  <div class="step-sub">${s.sub}</div>`;
  s.fields.forEach(f=>{
    h+=`<div class="field${f.kind==='diagnostic'?' diagnostic':''}">
    <div class="field-label">${f.label}${f.kind==='diagnostic'?`<span class="field-tag">key question</span>`:''}</div>
    <div class="field-hint">${f.hint}</div>`;
    if(f.evidence)h+=`<div class="field-evidence">${f.evidence}</div>`;
    h+=`<div class="options" style="grid-template-columns:repeat(${f.cols||2},1fr)">`;
    f.options.forEach(o=>{
      const sel=state.data[f.id]===o.val;
      h+=`<label class="opt${sel?' selected':''}" onclick="selectOpt('${f.id}','${o.val}')">
        <input type="radio" name="${f.id}" ${sel?'checked':''}/>
        <div><div class="opt-name">${o.name}</div><div class="opt-desc">${o.desc}</div></div>
      </label>`;
    });
    h+=`</div></div>`;
  });
  if(state.error)h+=`<div class="err">${state.error}</div>`;
  // If every answer is already given (e.g. the user came back to edit one),
  // offer a direct return to results instead of clicking through every step.
  const allAnswered = STEPS.every(s => s.fields.every(f => state.data[f.id]));
  h+=`<div class="nav">
    <button class="btn" onclick="goBack()">${state.step===0?'← Home':'← Previous'}</button>
    <div class="step-dots">${STEPS.map((_,i)=>`<button class="dot${i===state.step?' active':''}" onclick="editStep(${i})" aria-label="Go to step ${i+1}"></button>`).join('')}</div>
    ${allAnswered && state.step!==STEPS.length-1
      ? `<button class="btn btn-primary" onclick="backToResults()">Back to results →</button>`
      : `<button class="btn btn-primary" onclick="goNext()">${state.step===STEPS.length-1?'View diagnosis →':'Next →'}</button>`}
  </div>`;
  return h;
}

// Surface the framework's own dependency structure: what must be settled first,
// and what this decision will constrain downstream. Turns the list into a sequence.
function renderDeps(g, d){
  const dep = DEPENDS[g.id];
  if(!dep) return '';
  const openReqs = dep.requires.filter(r => isFlagged(d, r));
  const parts = [];

  if(openReqs.length){
    parts.push(`<div class="g-dep-warn">
      <strong>Settle ${openReqs.join(' and ')} first.</strong>
      ${openReqs.length===1?'It is':'They are'} also flagged, and ${g.id} depends on ${openReqs.length===1?'it':'them'} —
      decisions made here may need redoing once ${openReqs.length===1?'it changes':'they change'}.
    </div>`);
  }

  const bits = [];
  if(dep.requires.length) bits.push(`<span class="g-dep-k">Builds on</span> ${dep.requires.join(', ')}`);
  if(dep.informs.length)  bits.push(`<span class="g-dep-k">Feeds into</span> ${dep.informs.join(', ')}`);
  if(bits.length){
    parts.push(`<div class="g-dep">${bits.join(' &nbsp;·&nbsp; ')} <span class="g-dep-note">${dep.note}</span></div>`);
  }
  return parts.join('');
}

function renderResults(){
  const d=state.data;
  const ids=Object.keys(GUIDELINES);
  const scored=ids.map(id=>({id,...GUIDELINES[id],gap:GAP[id],action:GUIDELINES[id].action(d),
    score:priorityScore(d,id),flagged:isFlagged(d,id),iconBg:ICON_COLORS[id].bg,iconFg:ICON_COLORS[id].fg,nextStep:NEXT_STEPS[id],why:whyFlagged(d,id)}))
    .sort((a,b)=>b.score-a.score);

  const flaggedCount = scored.filter(g=>g.flagged).length;

  const summary=[['Domain',LBL.domain[d.domain]],['Skill type',LBL.skillType[d.skillType]],
    ['Expertise',LBL.expertise[d.expertise]],['Interaction HW',LBL.interactionHW[d.interactionHW]],
    ['Immersion',d.immersion]];

  // Which step owns each context field, so a chip can jump back to fix it
  const FIELD_STEP = {};
  STEPS.forEach((s,i)=>s.fields.forEach(f=>{ FIELD_STEP[f.id]=i; }));
  const summaryKeys=['domain','skillType','expertise','interactionHW','immersion'];

  let h=`<div class="context-summary">`;
  summary.forEach(([l,v],i)=>{
    const stepIdx = FIELD_STEP[summaryKeys[i]];
    h+=`<button class="ctx-chip" onclick="editStep(${stepIdx})" aria-label="${l}: ${v||'not set'}. Click to change this answer.">
      <div class="ctx-label">${l} <span class="ctx-edit" aria-hidden="true">edit</span></div>
      <div class="ctx-val">${v||'—'}</div></button>`;
  });
  h+=`</div>`;

  // ── Consolidated overview: headline + one ranked list that doubles as
  // diagnosis, priority chart, and jump navigation (Shneiderman: overview → details) ──
  const topFixes = scored.filter(g=>g.flagged).slice(0,3);
  h+=`<div class="scorecard">
    <div class="scorecard-head">
      <span class="scorecard-num${flaggedCount?' has-gaps':''}">${flaggedCount}</span>
      <div>
        <div class="scorecard-title">${flaggedCount===0?'No gaps detected in your plan':`of 8 guidelines worth reviewing`}</div>
        <div class="scorecard-sub">${flaggedCount===0
          ? 'Your answers did not match any of the common failure patterns from the 20-study review.'
          : 'Ranked below by how much attention each deserves in your specific context.'}</div>
      </div>
    </div>`;

  if(topFixes.length){
    h+=`<div class="next-steps">
      <div class="next-steps-label">Where to start</div>
      <ol class="next-steps-list">${topFixes.map(g=>
        `<li><strong>${g.id} — ${g.name}.</strong> ${g.nextStep}</li>`).join('')}</ol>
    </div>`;
  }

  h+=`<div role="img" aria-label="Ranked list of all eight guidelines by priority score, from ${scored[0].id} at ${scored[0].score} down to ${scored[scored.length-1].id} at ${scored[scored.length-1].score}. A data table follows.">`;
  scored.forEach(g=>{
    h+=`<button class="bar-row${g.flagged?' flagged':''}" onclick="jumpTo('${g.id}')" aria-label="${g.id} ${g.name}, priority ${g.score} of 100, ${g.flagged?'worth reviewing':'no gap detected'}. Jump to details.">
      <span class="bar-status" aria-hidden="true">${g.flagged?'!':'✓'}</span>
      <span class="bar-label">${g.id}: ${g.name}</span>
      <span class="bar-track"><span class="bar-fill${g.flagged?' flagged':''}" style="width:${g.score}%"></span></span>
      <span class="bar-val">${g.score}</span>
    </button>`;
  });
  h+=`</div>
  <details class="data-table-toggle">
    <summary>How is the priority score calculated?</summary>
    <p class="score-explain"><strong>${SCORING.formula}.</strong> ${SCORING.detail}</p>
  </details>
  <details class="data-table-toggle">
    <summary>View as data table</summary>
    <table>
      <caption>Priority scores per guideline, sorted highest to lowest</caption>
      <thead><tr><th scope="col">Guideline</th><th scope="col">Name</th><th scope="col">Priority score (0–100)</th><th scope="col">Status</th></tr></thead>
      <tbody>${scored.map(g=>`<tr><th scope="row">${g.id}</th><td>${g.name}</td><td>${g.score}</td><td>${g.flagged?'Worth reviewing':'No gap detected'}</td></tr>`).join('')}</tbody>
    </table>
  </details>
  </div>`;

  h+=`<div class="result-section"><h3>Guidelines G1–G8 — what to do about it</h3>
  <p style="font-size:11.5px;color:#999;margin-bottom:10px;line-height:1.5;">
    Each card below gives you a concrete next step for your specific context. The research
    grounding is noted quietly at the bottom of each card, for anyone who wants to dig deeper.
  </p>
  <div class="filter-row">
    <button class="chip${state.showOnlyFlagged?'':' active'}" aria-pressed="${!state.showOnlyFlagged}" onclick="setFilter(false)">Show all 8</button>
    <button class="chip${state.showOnlyFlagged?' active':''}" aria-pressed="${state.showOnlyFlagged}" onclick="setFilter(true)">Show only what needs attention</button>
  </div>`;
  const cardsToShow = state.showOnlyFlagged ? scored.filter(g=>g.flagged) : scored;
  cardsToShow.forEach(g=>{
    const ex = EXAMPLES[g.id];
    const diagram = DIAGRAMS[g.id];
    h+=`<div class="g-card${g.flagged?' flagged':''}" id="card-${g.id}">
      <div class="g-header">
        <span class="g-icon" style="background:${g.iconBg};color:${g.iconFg}">${ICONS[g.id]}</span>
        <div class="g-header-text">
          <div><span class="g-badge ${g.type.toLowerCase()}">${g.type}</span> <span class="g-name">${g.id} — ${g.name}</span></div>
        </div>
        ${g.flagged?`<span class="g-flag">⚑ worth reviewing</span>`:''}
      </div>
      <p class="g-prescription">${g.prescription}</p>
      ${g.why?`<div class="g-why"><strong>Why this is flagged for you:</strong> you answered “${g.why[1]}” to “${g.why[0]}”.</div>`:''}
      ${renderDeps(g, d)}
      ${diagram?`<div class="g-diagram">${diagram.svg}<div class="g-diagram-caption">${diagram.caption}</div></div>`:''}
      <div class="g-action">
        <span class="g-action-label">How to put this into practice</span>
        ${g.action}
      </div>
      <button class="ws-open" onclick="openWorksheet('${g.id}')">
        <span class="ws-open-icon" aria-hidden="true">▤</span>
        <span><strong>Open the ${WORKSHEETS[g.id].title}</strong><br><span class="ws-open-sub">Worked example + blank template you can copy into a spreadsheet</span></span>
        <span class="ws-open-arrow" aria-hidden="true">→</span>
      </button>
      <div class="g-example-row">
        <div class="g-example poor"><div class="g-example-label">✗ Common pitfall</div>${ex.poor}</div>
        <div class="g-example good"><div class="g-example-label">✓ Better approach</div>${ex.good}</div>
      </div>
      <div class="g-footer">
        <strong>Research grounding:</strong> ${g.theory} &nbsp;·&nbsp;
        <strong>Seen working well in:</strong> ${g.exemplar.study} &nbsp;·&nbsp;
        <strong>How common this gap is:</strong> ${g.gap.pct}% of the 20 studies we reviewed
      </div>
    </div>`;
  });
  h+=`</div>`;

  h+=`<details class="limits-panel">
    <summary>Scope and limitations of this evidence base</summary>
    <ul class="limits-list">${LIMITS.map(l=>`<li>${l}</li>`).join('')}</ul>
  </details>
  <div class="artifact-stamp">
    VR Training Design Framework — version ${ARTIFACT.version} · ${ARTIFACT.build} · released ${ARTIFACT.released}<br>
    ${ARTIFACT.framework}
  </div>`;

  h+=`<div class="nav">
    <button class="btn" onclick="restart()">← Restart assessment</button>
    <div class="export-row">
      <button class="btn" onclick="saveSession()">Save progress ⇩</button>
      <button class="btn" onclick="copyResultsText()">Copy my results ⧉</button>
      <button class="btn btn-primary" onclick="openBrief()">Full design brief ↗</button>
    </div>
  </div>
  <div id="copyConfirm" style="text-align:right;font-size:11.5px;color:#2f7a2f;margin-top:8px;display:none;">✓ Copied — paste into an email or shared document to send to the researcher.</div>`;
  return h;
}

function copyResultsText(){
  const d=state.data;
  const p=state.participant||{};
  const scored=Object.keys(GUIDELINES)
    .map(id=>({id,...GUIDELINES[id],gap:GAP[id],action:GUIDELINES[id].action(d),
      score:priorityScore(d,id),flagged:isFlagged(d,id),iconBg:ICON_COLORS[id].bg,iconFg:ICON_COLORS[id].fg,nextStep:NEXT_STEPS[id],why:whyFlagged(d,id)}))
    .sort((a,b)=>b.score-a.score);

  let lines=[
    'VR TRAINING DESIGN FRAMEWORK — DIAGNOSTIC RESULTS',
    'PPGDesign / UFPR — Cycle 2 expert validation workshop',
    '',
    `Participant: ${p.name||'(not provided)'}`,
    `Domain of expertise: ${p.domain||'(not provided)'}`,
    `Years of VR/training design experience: ${p.years||'(not provided)'}`,
    `Assessment date: ${new Date().toISOString().slice(0,10)}`,
    '',
    '--- CONTEXT PROVIDED ---',
    `Domain: ${LBL.domain[d.domain]||'—'}`,
    `Skill type: ${LBL.skillType[d.skillType]||'—'}`,
    `Learner expertise: ${LBL.expertise[d.expertise]||'—'}`,
    `Interaction hardware: ${LBL.interactionHW[d.interactionHW]||'—'}`,
    `Immersion level: ${d.immersion||'—'}`,
    '',
    `--- GAP DIAGNOSIS: ${scored.filter(g=>g.flagged).length} of 8 guidelines flagged ---`,
  ];
  scored.forEach(g=>{
    lines.push('', `${g.flagged?'[GAP]':'[OK] '} ${g.id} — ${g.name} (priority score: ${g.score}/100)`);
    lines.push(`  ${g.prescription}`);
    lines.push(`  IMPLEMENTATION GUIDANCE: ${g.action}`);
    lines.push(`  (Theory: ${g.theory} · RBS: ${g.exemplar.study}, gap in ${g.gap.pct}% of corpus)`);
  });
  lines.push('', 'Generated by the VR Training Design Framework prototype — Cycle 2, PPGDesign/UFPR.');

  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const c=document.getElementById('copyConfirm');
    if(c){c.style.display='block'; setTimeout(()=>{c.style.display='none';},4000);}
  }).catch(()=>{
    // Fallback for browsers without clipboard API access in local file context
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    const c=document.getElementById('copyConfirm');
    if(c){c.style.display='block'; setTimeout(()=>{c.style.display='none';},4000);}
  });
}

function startAssessment(){state.screen='steps';state.step=0;state.data={};state.error='';render();}
function restart(){state.screen='home';state.data={};state.error='';state.showOnlyFlagged=false;render();}
function selectOpt(f,v){state.data[f]=v;state.error='';render();}
function goBack(){
  if(state.step===0){state.screen='home';}
  else{state.step--;state.error='';}
  render();
}
function goNext(){
  const s=STEPS[state.step];
  const missing=s.fields.find(f=>!state.data[f.id]);
  if(missing){state.error=`Please select an option for "${missing.label}" before continuing.`;render();return;}
  state.error='';
  if(state.step===STEPS.length-1){state.screen='results';}
  else{state.step++;}
  render();
}

render();
</script>
